<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="安规刷题">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<title>变电安规刷题</title>

<style>
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f6f8fa; --line:#d3dae1; --line-strong:#b3bec9;
  --ink:#15212b; --ink-2:#4a5a68; --ink-3:#7b8b99;
  --accent:#14618f; --accent-ink:#ffffff; --accent-soft:#e3eef5;
  --ok:#0e7052; --ok-soft:#dff0e9; --bad:#a9342a; --bad-soft:#f8e4e1;
  --warn:#8a5a00; --warn-soft:#fbeed2;
  --shadow:0 1px 2px rgba(21,33,43,.07),0 6px 18px -10px rgba(21,33,43,.22);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d151c; --surface:#16212b; --surface-2:#1d2a35; --line:#2c3b48; --line-strong:#3d505f;
  --ink:#e4ecf2; --ink-2:#a3b4c1; --ink-3:#71838f;
  --accent:#4ea3d8; --accent-ink:#06121b; --accent-soft:#17303f;
  --ok:#4cbf96; --ok-soft:#12332a; --bad:#e58579; --bad-soft:#3a1e1a;
  --warn:#d9a640; --warn-soft:#33270f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px -12px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --bg:#0d151c; --surface:#16212b; --surface-2:#1d2a35; --line:#2c3b48; --line-strong:#3d505f;
  --ink:#e4ecf2; --ink-2:#a3b4c1; --ink-3:#71838f;
  --accent:#4ea3d8; --accent-ink:#06121b; --accent-soft:#17303f;
  --ok:#4cbf96; --ok-soft:#12332a; --bad:#e58579; --bad-soft:#3a1e1a;
  --warn:#d9a640; --warn-soft:#33270f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px -12px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",sans-serif;
  font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;
}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Roboto Mono",monospace}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

/* ---------- 顶栏 ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:780px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;flex-direction:column;gap:1px;min-width:0}
.brand b{font-size:14px;font-weight:650;letter-spacing:.01em;white-space:nowrap}
.brand span{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.top-sp{flex:1}
.icobtn{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2);border:1px solid transparent}
.icobtn:hover{background:var(--surface-2);border-color:var(--line)}
.icobtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bar{height:3px;background:var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);transition:width .25s ease;display:block}

/* ---------- 布局 ---------- */
.wrap{max-width:780px;margin:0 auto;padding:16px;padding-block:18px 96px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.lab{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:500}

/* ---------- 首页 ---------- */
.hero{padding:22px;display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.hero h1{margin:0;font-size:24px;line-height:1.3;font-weight:680;text-wrap:balance;letter-spacing:-.01em}
.hero .std{color:var(--ink-2);font-size:13px}
.hero .scope{margin-top:10px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:14px}
.kpi{display:flex;flex-direction:column}
.kpi b{font-size:21px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi span{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}

.sec{margin:18px 0 8px;display:flex;align-items:baseline;gap:10px}
.sec h2{margin:0;font-size:13px;font-weight:620;letter-spacing:.02em}
.sec em{font-style:normal;font-size:12px;color:var(--ink-3)}

.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mode{padding:14px;text-align:left;border-radius:11px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:3px;transition:border-color .15s,transform .1s}
.mode:hover{border-color:var(--accent);transform:translateY(-1px)}
.mode b{font-size:14.5px;font-weight:620}
.mode span{font-size:12px;color:var(--ink-2);line-height:1.5}
.mode.wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:12px}
.mode.wide div{flex:1;display:flex;flex-direction:column;gap:2px}
.mode .cnt{font-size:12px;color:var(--ink-3);white-space:nowrap}

.filters{padding:14px;display:flex;flex-direction:column;gap:12px}
.frow{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.frow>.lab{width:52px;flex:none}
.chip{padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--surface-2);font-size:12.5px;color:var(--ink-2);transition:.12s}
.chip:hover{border-color:var(--line-strong)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:520}
.chip .n{opacity:.62;font-size:11px;margin-left:3px;font-variant-numeric:tabular-nums}

/* ---------- 题目 ---------- */
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tag{padding:2.5px 8px;border-radius:5px;font-size:11px;font-weight:550;letter-spacing:.02em;border:1px solid transparent}
.tag.t-single{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.tag.t-multi{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.tag.t-judge{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.tag.src{background:var(--surface-2);color:var(--ink-2);border-color:var(--line)}
.qidx{margin-left:auto;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.card{padding:18px}
.stem{font-size:16.5px;line-height:1.75;margin:0 0 14px;font-weight:500;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;padding:11px 13px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);transition:.13s;line-height:1.6}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default}
.opt .k{flex:none;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--surface);border:1px solid var(--line-strong);color:var(--ink-2);margin-top:1px}
.opt .tx{flex:1;font-size:14.5px}
.opt[data-s="pick"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[data-s="pick"] .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt[data-s="ok"]{border-color:var(--ok);background:var(--ok-soft)}
.opt[data-s="ok"] .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt[data-s="bad"]{border-color:var(--bad);background:var(--bad-soft)}
.opt[data-s="bad"] .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[data-s="miss"]{border-color:var(--ok);border-style:dashed}
.opt[data-s="miss"] .k{color:var(--ok);border-color:var(--ok)}

.verdict{margin-top:14px;padding:13px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2)}
.verdict.ok{border-color:var(--ok);background:var(--ok-soft)}
.verdict.bad{border-color:var(--bad);background:var(--bad-soft)}
.vtop{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:620;margin-bottom:6px}
.vtop .ans{margin-left:auto;font-weight:500;color:var(--ink-2);font-size:12.5px}
.verdict p{margin:0;font-size:13.5px;line-height:1.7;color:var(--ink-2)}
.verdict p b{color:var(--ink);font-weight:600}

/* ---------- 底部操作栏 ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.dock-in{max-width:780px;margin:0 auto;display:flex;gap:8px;align-items:center}
.btn{padding:10px 16px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface);font-size:14px;font-weight:550;transition:.13s;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri:disabled:hover{filter:none}
.dock-sp{flex:1}
.dock .meta{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.star{width:38px;padding:0;height:38px;display:grid;place-items:center;border-radius:9px;border:1px solid var(--line-strong)}
.star svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round}
.star[aria-pressed="true"]{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.star[aria-pressed="true"] svg{fill:currentColor}

/* ---------- 结算 ---------- */
.score{padding:22px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center}
.score .big{font-size:46px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.score .big.pass{color:var(--ok)} .score .big.fail{color:var(--bad)}
.score .sub{color:var(--ink-2);font-size:13.5px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;width:100%}
.stat{padding:11px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);text-align:center}
.stat b{display:block;font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.revlist{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.rev{padding:11px 13px;border-radius:9px;border:1px solid var(--line);background:var(--surface);text-align:left;display:flex;gap:10px;align-items:flex-start}
.rev .no{flex:none;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-size:11.5px;font-weight:600;background:var(--bad);color:#fff}
.rev .bd{flex:1;min-width:0}
.rev .bd p{margin:0;font-size:13.5px;line-height:1.6}
.rev .bd small{color:var(--ink-3);font-size:11.5px}

.empty{padding:40px 20px;text-align:center;color:var(--ink-3)}
.empty b{display:block;font-size:15px;color:var(--ink-2);margin-bottom:4px;font-weight:600}
.timer{padding:4px 9px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.timer.low{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.note{font-size:12px;color:var(--ink-3);line-height:1.65;margin-top:12px;padding:11px 13px;border-left:2px solid var(--line-strong);background:var(--surface-2);border-radius:0 8px 8px 0}
@media (max-width:460px){
  .modes{grid-template-columns:1fr}
  .hero h1{font-size:21px}
  .frow>.lab{width:100%}
  .btn{padding:10px 13px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

:"A006","type":"single","ch":"1~3","sec":"3.3","stem":"下列关于\"运用中的电气设备\"的表述，正确的是（　）。","options":["处于检修状态的电气设备","全部带有电压、一部分带有电压或一经操作即带有电压的电气设备","只有全部带有电压的电气设备","已经停电但未装设接地线的电气设备"],"answer":["B"],"exp":"3.3 运用中的电气设备：全部带有电压、一部分带有电压或一经操作即带有电压的电气设备。"},{"id":"A007","type":"judge","ch":"1~3","sec":"3.3","stem":"一经操作即带有电压的电气设备属于运用中的电气设备。","options":["正确","错误"],"answer":["A"],"exp":"3.3 运用中的电气设备的定义中明确包含\"一经操作即带有电压\"的情形。"},{"id":"H006","type":"single","ch":"1~3","sec":"3.3","stem":"一台断路器在冷备用状态，但一经操作即带有电压，它属于（　）。","options":["备用设备，不属于运用中设备","检修设备","停用设备","运用中的电气设备"],"answer":["D"],"exp":"3.3 运用中的电气设备包括一经操作即带有电压的电气设备。"},{"id":"A008","type":"single","ch":"1~3","sec":"3.4","stem":"事故紧急抢修工作是指电气设备发生故障被迫紧急停止运行，需（　）恢复的抢修和排除故障的工作。","options":["24小时内","短时间内","48小时内","一周内"],"answer":["B"],"exp":"3.4 事故紧急抢修工作：指电气设备发生故障被迫紧急停止运行，需短时间内恢复的抢修和排除故障的工作。"},{"id":"H007","type":"judge","ch":"1~3","sec":"3.4","stem":"非连续进行、需较长时间的设备修复工作属于事故紧急抢修工作。","options":["正确","错误"],"answer":["B"],"exp":"3.4 事故紧急抢修工作指需短时间内恢复的抢修和排除故障的工作；6.3.5 规定非连续进行的事故修复工作应使用工作票。"},{"id":"A009","type":"single","ch":"1~3","sec":"3.5","stem":"设备双重名称是指（　）。","options":["设备型号和编号","设备编号和相别","设备名称和规格","设备名称和编号"],"answer":["D"],"exp":"3.5 设备双重名称：即设备名称和编号。"},{"id":"A010","type":"judge","ch":"1~3","sec":"3.5","stem":"设备双重名称指的是设备的中文名称和英文名称。","options":["正确","错误"],"answer":["B"],"exp":"3.5 设备双重名称即设备名称和编号。"},{"id":"H008","type":"single","ch":"1~3","sec":"3.5","stem":"倒闸操作发布指令时应使用规范的调度术语和（　）。","options":["设备型号","设备双重名称","设备安装位置","设备投运日期"],"answer":["B"],"exp":"5.3.1 发布指令应使用规范的调度术语和设备双重名称；3.5 设备双重名称即设备名称和编号。"},{"id":"B001","type":"multi","ch":"4","sec":"4.1","stem":"制定本规程的目的是（　）。","options":["加强电力生产现场管理","保证人身、电网和设备安全","规范各类工作人员的行为","提高设备利用率"],"answer":["A","B","C"],"exp":"4.1 为加强电力生产现场管理，规范各类工作人员的行为，保证人身、电网和设备安全，依据国家有关法律、法规，结合电力生产的实际，制定本规程。"},{"id":"H018","type":"multi","ch":"4","sec":"4.2","stem":"作业现场的基本条件包括（　）。","options":["作业现场的生产条件和安全设施等应符合有关标准、规范的要求","现场使用的安全工器具应合格并符合有关要求","工作人员的劳动防护用品应合格、齐备","各类作业人员应被告知作业现场和工作岗位存在的危险因素、防范措施及事故紧急处理措施"],"answer":["A","B","C","D"],"exp":"4.2.1~4.2.4 作业现场的基本条件。"},{"id":"B002","type":"single","ch":"4","sec":"4.2.1","stem":"作业现场的生产条件和安全设施等应符合有关标准、规范的要求，工作人员的劳动防护用品应（　）。","options":["统一采购","登记造册","合格、齐备","定期更换"],"answer":["C"],"exp":"4.2.1 作业现场的生产条件和安全设施等应符合有关标准、规范的要求，工作人员的劳动防护用品应合格、齐备。"},{"id":"B003","type":"single","ch":"4","sec":"4.2.2","stem":"经常有人工作的场所及施工车辆上（　）配备急救箱，存放急救用品，并应指定专人经常检查、补充或更换。","options":["必须","可以不","应","宜"],"answer":["D"],"exp":"4.2.2 经常有人工作的场所及施工车辆上宜配备急救箱。注意此处用\"宜\"而非\"应\"。"},{"id":"B004","type":"judge","ch":"4","sec":"4.2.2","stem":"急救箱内的急救用品应指定专人经常检查、补充或更换。","options":["正确","错误"],"answer":["A"],"exp":"4.2.2 存放急救用品，并应指定专人经常检查、补充或更换。"},{"id":"H017","type":"judge","ch":"4","sec":"4.2.2","stem":"经常有人工作的场所及施工车辆上必须配备急救箱。","options":["正确","错误"],"answer":["B"],"exp":"4.2.2 原文为\"宜配备急救箱\"，不是\"必须\"。"},{"id":"B023","type":"judge","ch":"4","sec":"4.2.3","stem":"现场使用的安全工器具应合格并符合有关要求。","options":["正确","错误"],"answer":["A"],"exp":"4.2.3 现场使用的安全工器具应合格并符合有关要求。"},{"id":"B005","type":"single","ch":"4","sec":"4.2.4","stem":"各类作业人员应被告知其作业现场和工作岗位存在的（　）。","options":["危险因素、防范措施及事故紧急处理措施","工作流程和技术要求","设备参数和运行方式","考核标准和奖惩办法"],"answer":["A"],"exp":"4.2.4 各类作业人员应被告知其作业现场和工作岗位存在的危险因素、防范措施及事故紧急处理措施。"},{"id":"B008","type":"multi","ch":"4","sec":"4.3","stem":"作业人员的基本条件包括（　）。","options":["具备必要的电气知识和业务技能，且按工作性质熟悉本规程的相关部分，并经考试合格","进入作业现场应正确佩戴安全帽，现场作业人员应穿全棉长袖工作服、绝缘鞋","具备必要的安全生产知识，学会紧急救护法，特别要学会触电急救","经医师鉴定，无妨碍工作的病症"],"answer":["A","B","C","D"],"exp":"4.3.1~4.3.4 规定了作业人员的四项基本条件。"},{"id":"B006","type":"single","ch":"4","sec":"4.3.1","stem":"作业人员应经医师鉴定，无妨碍工作的病症，体格检查（　）至少一次。","options":["每半年","每三年","每两年","每年"],"answer":["C"],"exp":"4.3.1 经医师鉴定，无妨碍工作的病症（体格检查每两年至少一次）。"},{"id":"B007","type":"judge","ch":"4","sec":"4.3.1","stem":"作业人员的体格检查每年至少进行一次。","options":["正确","错误"],"answer":["B"],"exp":"4.3.1 规定体格检查每两年至少一次。注意区别：4.4.2 规定作业人员对本规程应每年考试一次。"},{"id":"H009","type":"single","ch":"4","sec":"4.3.1","stem":"某作业人员上次体格检查在两年半前，按本规程要求（　）。","options":["由工作负责人判断即可","只需本人签字确认身体状况","已超过规定周期，应进行体格检查","未超周期，无需检查"],"answer":["C"],"exp":"4.3.1 体格检查每两年至少一次，两年半未检查已超周期。"},{"id":"H020","type":"judge","ch":"4","sec":"4.3.2","stem":"作业人员应按工作性质，熟悉本规程的相关部分，并经考试合格。","options":["正确","错误"],"answer":["A"],"exp":"4.3.2 具备必要的电气知识和业务技能，且按工作性质，熟悉本规程的相关部分，并经考试合格。"},{"id":"B009","type":"single","ch":"4","sec":"4.3.3","stem":"作业人员应具备必要的安全生产知识，学会紧急救护法，特别要学会（　）。","options":["触电急救","消防灭火","心肺复苏","止血包扎"],"answer":["A"],"exp":"4.3.3 具备必要的安全生产知识，学会紧急救护法，特别要学会触电急救。"},{"id":"B010","type":"multi","ch":"4","sec":"4.3.4","stem":"进入作业现场，现场作业人员应（　）。","options":["穿全棉长袖工作服","穿绝缘鞋","佩戴护目镜","正确佩戴安全帽"],"answer":["A","B","D"],"exp":"4.3.4 进入作业现场应正确佩戴安全帽，现场作业人员应穿全棉长袖工作服、绝缘鞋。护目镜仅在装卸高压熔断器等特定作业中要求（5.3.6.10）。"},{"id":"H019","type":"single","ch":"4","sec":"4.3.4","stem":"现场作业人员应穿（　）。","options":["阻燃服、绝缘靴","短袖工作服、绝缘鞋","全棉长袖工作服、绝缘鞋","化纤工作服、劳保鞋"],"answer":["C"],"exp":"4.3.4 现场作业人员应穿全棉长袖工作服、绝缘鞋。"},{"id":"H022","type":"single","ch":"4","sec":"4.4","stem":"下列关于教育和培训的说法，错误的是（　）。","options":["因故间断电气工作连续三个月以上者，应重新学习本规程并经考试合格","外来工作人员工作前，设备运维管理单位应告知现场电气设备接线情况、危险点和安全注意事项","实习人员经安全知识教育后可以单独工作","各类作业人员应接受相应的安全生产教育和岗位技能培训，经考试合格上岗"],"answer":["C"],"exp":"4.4.3 实习人员不得单独工作。"},{"id":"B024","type":"single","ch":"4","sec":"4.4.1","stem":"各类作业人员应接受相应的安全生产教育和岗位技能培训，（　）上岗。","options":["经考试合格","经体检合格","经师傅带教","经领导批准"],"answer":["A"],"exp":"4.4.1 各类作业人员应接受相应的安全生产教育和岗位技能培训，经考试合格上岗。"},{"id":"B011","type":"single","ch":"4","sec":"4.4.2","stem":"作业人员对本规程应（　）考试一次。","options":["每半年","每三年","每两年","每年"],"answer":["D"],"exp":"4.4.2 作业人员对本规程应每年考试一次。"},{"id":"B012","type":"single","ch":"4","sec":"4.4.2","stem":"因故间断电气工作连续（　）以上者，应重新学习本规程，并经考试合格后，方能恢复工作。","options":["一个月","三个月","六个月","一年"],"answer":["B"],"exp":"4.4.2 因故间断电气工作连续三个月以上者，应重新学习本规程，并经考试合格后，方能恢复工作。"},{"id":"B013","type":"judge","ch":"4","sec":"4.4.2","stem":"因故间断电气工作连续六个月以上者，应重新学习本规程并经考试合格后方能恢复工作。","options":["正确","错误"],"answer":["B"],"exp":"4.4.2 规定的间断时间是连续三个月以上。"},{"id":"H010","type":"single","ch":"4","sec":"4.4.2","stem":"某员工因病休假连续4个月，返岗后（　）。","options":["只需班组长口头交底","应重新学习本规程，并经考试合格后方能恢复工作","等下次年度考试时再考","可直接恢复工作"],"answer":["B"],"exp":"4.4.2 因故间断电气工作连续三个月以上者，应重新学习本规程，并经考试合格后，方能恢复工作。"},{"id":"H011","type":"single","ch":"4","sec":"4.4.2","stem":"下列关于安规考试的说法，错误的是（　）。","options":["作业人员对本规程每两年考试一次","新参加电气工作的人员应经过安全知识教育","作业人员对本规程应每年考试一次","间断电气工作连续三个月以上应重新学习并考试"],"answer":["A"],"exp":"4.4.2 作业人员对本规程应每年考试一次，\"每两年\"是体格检查的周期（4.3.1）。"},{"id":"B014","type":"multi","ch":"4","sec":"4.4.3","stem":"下列（　）人员应经过安全知识教育后，方可到现场参加指定的工作，并且不得单独工作。","options":["临时参加劳动的管理人员","新参加电气工作的人员","实习人员","临时参加劳动的非全日制用工"],"answer":["A","B","C","D"],"exp":"4.4.3 新参加电气工作的人员、实习人员和临时参加劳动的人员（管理人员、非全日制用工等），应经过安全知识教育后，方可到现场参加指定的工作，并且不得单独工作。"},{"id":"B015","type":"judge","ch":"4","sec":"4.4.3","stem":"实习人员经过安全知识教育后，可以单独到现场参加指定的工作。","options":["正确","错误"],"answer":["B"],"exp":"4.4.3 明确规定这类人员\"不得单独工作\"。"},{"id":"H012","type":"single","ch":"4","sec":"4.4.3","stem":"一名刚入职的新员工，经过安全知识教育后，（　）。","options":["可担任工作负责人","可担任专责监护人","可单独到现场工作","可到现场参加指定的工作，但不得单独工作"],"answer":["D"],"exp":"4.4.3 新参加电气工作的人员经过安全知识教育后，方可到现场参加指定的工作，并且不得单独工作。"},{"id":"H013","type":"judge","ch":"4","sec":"4.4.3","stem":"临时参加劳动的管理人员，经过安全知识教育后，方可到现场参加指定的工作，并且不得单独工作。","options":["正确","错误"],"answer":["A"],"exp":"4.4.3 临时参加劳动的人员（管理人员、非全日制用工等）同样适用。"},{"id":"B016","type":"single","ch":"4","sec":"4.4.4","stem":"参与公司系统所承担电气工作的外单位或外来工作人员应熟悉本规程，经考试合格，并经（　）认可，方可参加工作。","options":["调度控制中心","安全监察部门","设备运维管理单位","工作票签发人"],"answer":["C"],"exp":"4.4.4 应熟悉本规程，经考试合格，并经设备运维管理单位认可，方可参加工作。"},{"id":"B017","type":"multi","ch":"4","sec":"4.4.4","stem":"外来工作人员工作前，设备运维管理单位应告知现场（　）。","options":["电气设备接线情况","安全注意事项","设备缺陷清单","危险点"],"answer":["A","B","D"],"exp":"4.4.4 工作前，设备运维管理单位应告知现场电气设备接线情况、危险点和安全注意事项。"},{"id":"H014","type":"judge","ch":"4","sec":"4.4.4","stem":"外单位工作人员只要熟悉本规程并经考试合格，即可参加公司系统所承担的电气工作。","options":["正确","错误"],"answer":["B"],"exp":"4.4.4 还需经设备运维管理单位认可，方可参加工作。"},{"id":"B018","type":"single","ch":"4","sec":"4.5","stem":"任何人发现有违反本规程的情况，应（　）。","options":["记录后向上级报告","等待工作负责人处理","视情节轻重决定是否制止","立即制止，经纠正后才能恢复作业"],"answer":["D"],"exp":"4.5 任何人发现有违反本规程的情况，应立即制止，经纠正后才能恢复作业。"},{"id":"B019","type":"multi","ch":"4","sec":"4.5","stem":"各类作业人员的权利包括（　）。","options":["拒绝强令冒险作业","拒绝违章指挥","发现直接危及人身、电网和设备安全的紧急情况时，有权停止作业","发现紧急情况时，在采取可能的紧急措施后撤离作业场所"],"answer":["A","B","C","D"],"exp":"4.5 各类作业人员有权拒绝违章指挥和强令冒险作业；在发现直接危及人身、电网和设备安全的紧急情况时，有权停止作业或者在采取可能的紧急措施后撤离作业场所，并立即报告。"},{"id":"B020","type":"judge","ch":"4","sec":"4.5","stem":"作业人员在发现直接危及人身安全的紧急情况时停止作业或撤离作业场所后，可不必报告。","options":["正确","错误"],"answer":["B"],"exp":"4.5 规定停止作业或撤离后应\"立即报告\"。"},{"id":"H015","type":"judge","ch":"4","sec":"4.5","stem":"只有工作负责人和专责监护人发现违反本规程的情况时，才有权制止。","options":["正确","错误"],"answer":["B"],"exp":"4.5 任何人发现有违反本规程的情况，应立即制止，经纠正后才能恢复作业。"},{"id":"H016","type":"single","ch":"4","sec":"4.5","stem":"作业人员发现违章指挥和强令冒险作业时，（　）。","options":["应先执行后报告","应服从并做好记录","应请示工作票签发人","有权拒绝"],"answer":["D"],"exp":"4.5 各类作业人员有权拒绝违章指挥和强令冒险作业。"},{"id":"B021","type":"single","ch":"4","sec":"4.6","stem":"在试验和推广新技术、新工艺、新设备、新材料的同时，应制定相应的安全措施，经（　）批准后执行。","options":["安全监察部门","本单位","调度控制中心","上级主管部门"],"answer":["B"],"exp":"4.6 应制定相应的安全措施，经本单位批准后执行。"},{"id":"B022","type":"multi","ch":"4","sec":"4.6","stem":"在试验和推广\"四新\"的同时应制定相应的安全措施，\"四新\"是指（　）。","options":["新设备","新材料","新技术","新工艺"],"answer":["A","B","C","D"],"exp":"4.6 在试验和推广新技术、新工艺、新设备、新材料的同时，应制定相应的安全措施。"},{"id":"H021","type":"single","ch":"4","sec":"4.6","stem":"试验推广新设备时制定的安全措施，应经（　）批准后执行。","options":["安全监察质量部","本单位","设备厂家","上级公司"],"answer":["B"],"exp":"4.6 应制定相应的安全措施，经本单位批准后执行。"},{"id":"I046","type":"single","ch":"5","sec":"5.1","stem":"下列关于高压设备一般安全要求的说法，错误的是（　）。","options":["待用间隔应有名称、编号，并列入调度控制中心管辖范围","换流站在满足条件时可以单人值班","运行中的中性点接地系统的中性点应视作带电体","无论高压设备是否带电，作业人员不得单独移开或越过遮栏进行工作"],"answer":["B"],"exp":"5.1.3 换流站不允许单人值班或单人操作。"},{"id":"C001","type":"single","ch":"5","sec":"5.1.1","stem":"运维人员应熟悉电气设备。单独值班人员或运维负责人还应（　）。","options":["有实际工作经验","持有特种作业证","具有高级工职称","经上级单位批准"],"answer":["A"],"exp":"5.1.1 运维人员应熟悉电气设备。单独值班人员或运维负责人还应有实际工作经验。"},{"id":"C002","type":"single","ch":"5","sec":"5.1.2","stem":"室内高压设备的隔离室设有遮栏，遮栏的高度在（　）以上，安装牢固并加锁者，可由单人值班或单人操作。","options":["2.0m","1.8m","1.7m","1.5m"],"answer":["C"],"exp":"5.1.2 a）室内高压设备的隔离室设有遮栏，遮栏的高度在1.7m以上，安装牢固并加锁者。"},{"id":"C003","type":"multi","ch":"5","sec":"5.1.2","stem":"高压设备符合下列（　）条件者，可由单人值班或单人操作。","options":["室外高压设备已装设围栏者","室内高压断路器（开关）装有远方操动机构者","室内高压设备的隔离室设有遮栏，遮栏的高度在1.7m以上，安装牢固并加锁者","室内高压断路器（开关）的操动机构用墙或金属板与该断路器隔离者"],"answer":["B","C","D"],"exp":"5.1.2 规定了两项条件，其中 b）包含\"用墙或金属板与该断路器（开关）隔离\"或\"装有远方操动机构\"两种情形。"},{"id":"I027","type":"judge","ch":"5","sec":"5.1.2","stem":"室内高压设备隔离室的遮栏高度为1.5m、安装牢固并加锁，可由单人值班或单人操作。","options":["正确","错误"],"answer":["B"],"exp":"5.1.2 a）遮栏高度应在1.7m以上。"},{"id":"I028","type":"single","ch":"5","sec":"5.1.2","stem":"下列不满足单人值班或单人操作条件的是（　）。","options":["换流站","室内高压设备隔离室遮栏高1.8m、安装牢固并加锁","室内断路器操动机构用墙与断路器隔离","室内断路器装有远方操动机构"],"answer":["A"],"exp":"5.1.3 换流站不允许单人值班或单人操作；其余符合5.1.2。"},{"id":"C004","type":"judge","ch":"5","sec":"5.1.3","stem":"换流站不允许单人值班或单人操作。","options":["正确","错误"],"answer":["A"],"exp":"5.1.3 换流站不允许单人值班或单人操作。"},{"id":"C005","type":"single","ch":"5","sec":"5.1.4","stem":"无论高压设备是否带电，作业人员不得单独移开或越过遮栏进行工作；若有必要移开遮栏时，应（　）。","options":["先行验电","经工作许可人同意","有监护人在场，并符合表1的安全距离","佩戴绝缘手套"],"answer":["C"],"exp":"5.1.4 若有必要移开遮栏时，应有监护人在场，并符合表1的安全距离。"},{"id":"C050","type":"judge","ch":"5","sec":"5.1.4","stem":"高压设备已停电时，作业人员可以单独移开或越过遮栏进行工作。","options":["正确","错误"],"answer":["B"],"exp":"5.1.4 无论高压设备是否带电，作业人员不得单独移开或越过遮栏进行工作。"},{"id":"I029","type":"judge","ch":"5","sec":"5.1.4","stem":"有必要移开遮栏时，只要作业人员与带电部分保持表1安全距离，可不设监护人。","options":["正确","错误"],"answer":["B"],"exp":"5.1.4 若有必要移开遮栏时，应有监护人在场，并符合表1的安全距离，两个条件缺一不可。"},{"id":"C006","type":"single","ch":"5","sec":"表1","stem":"设备不停电时的安全距离，10kV及以下（13.8kV）为（　）。","options":["0.70m","1.00m","0.35m","0.95m"],"answer":["A"],"exp":"表1 设备不停电时的安全距离：10kV及以下（13.8kV）为0.70m。注意与表3（正常活动范围0.35m）、表2（车辆外廓0.95m）区分。"},{"id":"C007","type":"single","ch":"5","sec":"表1","stem":"设备不停电时的安全距离，20kV、35kV为（　）。","options":["0.70m","1.00m","0.60m","1.50m"],"answer":["B"],"exp":"表1 设备不停电时的安全距离：20kV、35kV为1.00m。"},{"id":"C008","type":"single","ch":"5","sec":"表1","stem":"设备不停电时的安全距离，66kV、110kV为（　）。","options":["2.00m","1.50m","1.65m","1.00m"],"answer":["B"],"exp":"表1 设备不停电时的安全距离：66kV、110kV为1.50m。"},{"id":"C009","type":"single","ch":"5","sec":"表1","stem":"设备不停电时的安全距离，220kV为（　）。","options":["3.00m","2.55m","4.00m","2.00m"],"answer":["A"],"exp":"表1 设备不停电时的安全距离：220kV为3.00m。"},{"id":"C010","type":"single","ch":"5","sec":"表1","stem":"设备不停电时的安全距离，330kV为（　）。","options":["5.00m","3.25m","4.00m","3.00m"],"answer":["C"],"exp":"表1 设备不停电时的安全距离：330kV为4.00m。"},{"id":"C011","type":"single","ch":"5","sec":"表1","stem":"设备不停电时的安全距离，500kV为（　）。","options":["4.55m","4.00m","5.00m","6.00m"],"answer":["C"],"exp":"表1 设备不停电时的安全距离：500kV为5.00m。"},{"id":"C012","type":"single","ch":"5","sec":"表1","stem":"设备不停电时的安全距离，750kV为（　）。","options":["6.70m","7.20m","8.70m","8.00m"],"answer":["B"],"exp":"表1 设备不停电时的安全距离：750kV为7.20m（按海拔2000m校正）。"},{"id":"C013","type":"single","ch":"5","sec":"表1","stem":"设备不停电时的安全距离，1000kV为（　）。","options":["9.50m","8.25m","8.70m","9.30m"],"answer":["C"],"exp":"表1 设备不停电时的安全距离：1000kV为8.70m。"},{"id":"C014","type":"single","ch":"5","sec":"表1","stem":"设备不停电时的安全距离，±800kV为（　）。","options":["9.30m","9.00m","10.10m","8.40m"],"answer":["A"],"exp":"表1 设备不停电时的安全距离：±800kV为9.30m。"},{"id":"C015","type":"single","ch":"5","sec":"表1","stem":"设备不停电时的安全距离，±400kV为（　）。","options":["5.45m","6.70m","6.00m","5.90m"],"answer":["D"],"exp":"表1 设备不停电时的安全距离：±400kV为5.90m（按海拔3000m校正，海拔4000m时为6.00m）。"},{"id":"C016","type":"single","ch":"5","sec":"表1","stem":"设备不停电时的安全距离，±500kV为（　）。","options":["5.60m","5.90m","6.80m","6.00m"],"answer":["D"],"exp":"表1 设备不停电时的安全距离：±500kV为6.00m。"},{"id":"C017","type":"single","ch":"5","sec":"表1","stem":"设备不停电时的安全距离，±660kV为（　）。","options":["8.70m","8.40m","9.00m","8.00m"],"answer":["B"],"exp":"表1 设备不停电时的安全距离：±660kV为8.40m。"},{"id":"C018","type":"single","ch":"5","sec":"表1","stem":"设备不停电时的安全距离，±50kV及以下为（　）。","options":["1.50m","1.00m","0.70m","1.65m"],"answer":["A"],"exp":"表1 设备不停电时的安全距离：±50kV及以下为1.50m。"},{"id":"C019","type":"single","ch":"5","sec":" ,"answer":["B"],"exp":"5.1.7 应设有明显标志的永久性隔离挡板（护网）。"},{"id":"C032","type":"single","ch":"5","sec":"5.1.8","stem":"待用间隔（母线连接排、引线已接上母线的备用间隔）应有名称、编号，并列入（　）管辖范围。","options":["调度控制中心","变电运维班","检修单位","设备运维管理单位"],"answer":["A"],"exp":"5.1.8 待用间隔应有名称、编号，并列入调度控制中心管辖范围。其隔离开关（刀闸）操作手柄、网门应加锁。"},{"id":"C033","type":"judge","ch":"5","sec":"5.1.8","stem":"待用间隔的隔离开关（刀闸）操作手柄、网门应加锁。","options":["正确","错误"],"answer":["A"],"exp":"5.1.8 其隔离开关（刀闸）操作手柄、网门应加锁。"},{"id":"I032","type":"single","ch":"5","sec":"5.1.8","stem":"待用间隔是指（　）。","options":["母线连接排、引线已接上母线的备用间隔","已拆除全部设备的间隔","正在检修的间隔","尚未建设的预留场地"],"answer":["A"],"exp":"5.1.8 待用间隔（母线连接排、引线已接上母线的备用间隔）。"},{"id":"C034","type":"single","ch":"5","sec":"5.1.9","stem":"在手车开关拉出后，应观察（　）。","options":["储能是否释放","控制电源是否断开","接地刀闸是否合上","隔离挡板是否可靠封闭"],"answer":["D"],"exp":"5.1.9 在手车开关拉出后，应观察隔离挡板是否可靠封闭。封闭式组合电器引出电缆备用孔或母线的终端备用孔应用专用器具封闭。"},{"id":"I033","type":"judge","ch":"5","sec":"5.1.9","stem":"封闭式组合电器引出电缆备用孔或母线的终端备用孔应用专用器具封闭。","options":["正确","错误"],"answer":["A"],"exp":"5.1.9 封闭式组合电器引出电缆备用孔或母线的终端备用孔应用专用器具封闭。"},{"id":"C035","type":"single","ch":"5","sec":"5.1.10","stem":"运行中的高压设备，其中性点接地系统的中性点应（　）。","options":["视作绝缘体","视作等电位体","视作接地体","视作带电体"],"answer":["D"],"exp":"5.1.10 运行中的高压设备，其中性点接地系统的中性点应视作带电体。在运行中若必须进行中性点接地点断开的工作时，应先建立有效的旁路接地才可进行断开工作。"},{"id":"C036","type":"single","ch":"5","sec":"5.1.10","stem":"在运行中若必须进行中性点接地点断开的工作时，应（　）才可进行断开工作。","options":["先验明无电压","先建立有效的旁路接地","先取得调控人员许可","先停用相关保护"],"answer":["B"],"exp":"5.1.10 应先建立有效的旁路接地才可进行断开工作。"},{"id":"I034","type":"judge","ch":"5","sec":"5.1.10","stem":"运行中的中性点接地系统的中性点可视作不带电，直接断开接地点进行工作。","options":["正确","错误"],"answer":["B"],"exp":"5.1.10 中性点应视作带电体；必须断开中性点接地点时，应先建立有效的旁路接地。"},{"id":"C037","type":"multi","ch":"5","sec":"5.1.11","stem":"换流站内，运行中高压直流系统下列（　）应视为带电体。","options":["直流场中性区域设备","接地极","接地极线路","站内临时接地极"],"answer":["A","B","C","D"],"exp":"5.1.11 换流站内，运行中高压直流系统直流场中性区域设备、站内临时接地极、接地极线路及接地极均应视为带电体。"},{"id":"I048","type":"multi","ch":"5","sec":"5.1.11","stem":"下列设备或设施中，在换流站运行中应视为带电体的有（　）。","options":["站内临时接地极","直流场中性区域设备","接地极线路","运行中中性点接地系统的中性点"],"answer":["A","B","C","D"],"exp":"5.1.11 直流场中性区域设备、站内临时接地极、接地极线路及接地极均应视为带电体；5.1.10 中性点接地系统的中性点应视作带电体。"},{"id":"C038","type":"judge","ch":"5","sec":"5.1.12","stem":"换流站阀厅未转检修前，人员禁止进入作业（巡视通道除外）。","options":["正确","错误"],"answer":["A"],"exp":"5.1.12 换流站阀厅未转检修前，人员禁止进入作业（巡视通道除外）。"},{"id":"I035","type":"single","ch":"5","sec":"5.1.12","stem":"换流站阀厅未转检修前，人员（　）。","options":["可在监护下进入作业","经许可可进入作业","禁止进入作业（巡视通道除外）","可进入进行一般清扫"],"answer":["C"],"exp":"5.1.12 换流站阀厅未转检修前，人员禁止进入作业（巡视通道除外）。"},{"id":"I047","type":"single","ch":"5","sec":"5.2","stem":"下列关于高压设备巡视的说法，错误的是（　）。","options":["高压室钥匙至少应有2把","雷雨天气巡视室外高压设备应穿绝缘靴","巡视室内设备应随手关门","单独巡视人员不准移开或越过遮栏"],"answer":["A"],"exp":"5.2.6 高压室的钥匙至少应有3把。"},{"id":"C039","type":"multi","ch":"5","sec":"5.2.1","stem":"经本单位批准允许单独巡视高压设备的人员巡视高压设备时，（　）。","options":["不准移开遮栏","不准使用手电筒","不准越过遮栏","不准进行其他工作"],"answer":["A","C","D"],"exp":"5.2.1 巡视高压设备时，不准进行其他工作，不准移开或越过遮栏。"},{"id":"I036","type":"single","ch":"5","sec":"5.2.1","stem":"允许单独巡视高压设备的人员，应经（　）批准。","options":["调度控制中心","本单位","设备运维管理单位","工区"],"answer":["B"],"exp":"5.2.1 经本单位批准允许单独巡视高压设备的人员。"},{"id":"I037","type":"judge","ch":"5","sec":"5.2.1","stem":"单独巡视高压设备时，发现设备缺陷可以顺手处理。","options":["正确","错误"],"answer":["B"],"exp":"5.2.1 巡视高压设备时，不准进行其他工作。"},{"id":"C040","type":"single","ch":"5","sec":"5.2.2","stem":"雷雨天气，需要巡视室外高压设备时，应穿绝缘靴，并不准（　）。","options":["靠近变压器","进入高压室","单独巡视","靠近避雷器和避雷针"],"answer":["D"],"exp":"5.2.2 雷雨天气，需要巡视室外高压设备时，应穿绝缘靴，并不准靠近避雷器和避雷针。"},{"id":"I038","type":"single","ch":"5","sec":"5.2.2","stem":"雷雨天气巡视室外高压设备时，下列做法正确的是（　）。","options":["穿普通雨靴巡视","穿绝缘靴，不靠近避雷器和避雷针","戴绝缘手套，靠近避雷器检查动作次数","打伞巡视避雷针"],"answer":["B"],"exp":"5.2.2 雷雨天气，需要巡视室外高压设备时，应穿绝缘靴，并不准靠近避雷器和避雷针。"},{"id":"C041","type":"judge","ch":"5","sec":"5.2.3","stem":"地震、台风、洪水、泥石流等灾害发生时，禁止巡视灾害现场。","options":["正确","错误"],"answer":["A"],"exp":"5.2.3 地震、台风、洪水、泥石流等灾害发生时，禁止巡视灾害现场。"},{"id":"C042","type":"multi","ch":"5","sec":"5.2.3","stem":"灾害发生后，如需要对设备进行巡视时，应（　）。","options":["至少两人一组","巡视人员应与派出部门之间保持通信联络","得到设备运维管理单位批准","制定必要的安全措施"],"answer":["A","B","C","D"],"exp":"5.2.3 灾害发生后如需巡视，应制定必要的安全措施，得到设备运维管理单位批准，并至少两人一组，巡视人员应与派出部门之间保持通信联络。"},{"id":"I039","type":"single","ch":"5","sec":"5.2.3","stem":"灾害发生后需要对设备进行巡视时，至少应（　）一组。","options":["三人","四人","一人即可","两人"],"answer":["D"],"exp":"5.2.3 并至少两人一组，巡视人员应与派出部门之间保持通信联络。"},{"id":"I040","type":"judge","ch":"5","sec":"5.2.3","stem":"台风正在发生时，经批准可以巡视灾害现场。","options":["正确","错误"],"answer":["B"],"exp":"5.2.3 地震、台风、洪水、泥石流等灾害发生时，禁止巡视灾害现场；灾害发生后方可按要求巡视。"},{"id":"C043","type":"single","ch":"5","sec":"5.2.4","stem":"高压设备发生接地时，室内人员应距离故障点（　）以外。","options":["8m","4m","10m","2m"],"answer":["B"],"exp":"5.2.4 高压设备发生接地时，室内人员应距离故障点4m以外，室外人员应距离故障点8m以外。"},{"id":"C044","type":"single","ch":"5","sec":"5.2.4","stem":"高压设备发生接地时，室外人员应距离故障点（　）以外。","options":["10m","4m","8m","6m"],"answer":["C"],"exp":"5.2.4 室外人员应距离故障点8m以外。"},{"id":"C045","type":"multi","ch":"5","sec":"5.2.4","stem":"高压设备发生接地时，进入室内4m、室外8m范围内的人员应（　）。","options":["穿绝缘靴","使用验电器验电","佩戴安全帽","接触设备的外壳和构架时应戴绝缘手套"],"answer":["A","D"],"exp":"5.2.4 进入上述范围人员应穿绝缘靴，接触设备的外壳和构架时，应戴绝缘手套。"},{"id":"I041","type":"single","ch":"5","sec":"5.2.4","stem":"室外高压设备发生接地，运维人员需要到距故障点5m处检查设备，应（　）。","options":["只需戴安全帽","只需戴绝缘手套","穿绝缘靴，接触设备外壳和构架时戴绝缘手套","无需任何防护"],"answer":["C"],"exp":"5.2.4 室外人员应距离故障点8m以外，进入上述范围人员应穿绝缘靴，接触设备的外壳和构架时，应戴绝缘手套。"},{"id":"I042","type":"judge","ch":"5","sec":"5.2.4","stem":"室内高压设备发生接地时，人员距故障点5m处无需穿绝缘靴。","options":["正确","错误"],"answer":["A"],"exp":"5.2.4 室内人员应距离故障点4m以外；5m已在4m以外。"},{"id":"I043","type":"judge","ch":"5","sec":"5.2.4","stem":"高压设备发生接地时，室外人员应距离故障点4m以外。","options":["正确","错误"],"answer":["B"],"exp":"5.2.4 室内4m以外，室外8m以外。"},{"id":"C046","type":"judge","ch":"5","sec":"5.2.5","stem":"巡视室内设备，应随手关门。","options":["正确","错误"],"answer":["A"],"exp":"5.2.5 巡视室内设备，应随手关门。"},{"id":"C047","type":"single","ch":"5","sec":"5.2.6","stem":"高压室的钥匙至少应有（　），由运维人员负责保管，按值移交。","options":["2把","5把","4把","3把"],"answer":["D"],"exp":"5.2.6 高压室的钥匙至少应有3把，由运维人员负责保管，按值移交。"},{"id":"C048","type":"multi","ch":"5","sec":"5.2.6","stem":"关于高压室钥匙的管理，下列说法正确的是（　）。","options":["借用钥匙应登记签名，巡视或当日工作结束后交还","1把专供运维人员使用","其他可以借给经批准的巡视高压设备人员和经批准的检修、施工队伍的工作负责人使用","1把专供紧急时使用"],"answer":["A","B","C","D"],"exp":"5.2.6 高压室的钥匙至少应有3把，1把专供紧急时使用，1把专供运维人员使用，其他可以借给经批准的人员使用，但应登记签名，巡视或当日工作结束后交还。"},{"id":"C049","type":"judge","ch":"5","sec":"5.2.6","stem":"借出的高压室钥匙可在工作全部完成后统一交还，不必当日交还。","options":["正确","错误"],"answer":["B"],"exp":"5.2.6 规定\"巡视或当日工作结束后交还\"。"},{"id":"I044","type":"single","ch":"5","sec":"5.2.6","stem":"高压室的钥匙由（　）负责保管，按值移交。","options":["安全员","运维人员","工作负责人","检修班长"],"answer":["B"],"exp":"5.2.6 高压室的钥匙至少应有3把，由运维人员负责保管，按值移交。"},{"id":"I045","type":"single","ch":"5","sec":"5.2.6","stem":"下列人员中，不能借用高压室钥匙的是（　）。","options":["经批准的施工队伍的工作负责人","经批准的检修队伍的工作负责人","经批准的巡视高压设备人员","未经批准的检修人员"],"answer":["D"],"exp":"5.2.6 钥匙可以借给经批准的巡视高压设备人员和经批准的检修、施工队伍的工作负责人使用。"},{"id":"D001","type":"single","ch":"5","sec":"5.3.1","stem":"倒闸操作应根据（　）的指令，受令人复诵无误后执行。","options":["值班调控人员或运维负责人","安全监察部门","工作票签发人","设备运维管理单位"],"answer":["A"],"exp":"5.3.1 倒闸操作应根据值班调控人员或运维负责人的指令，受令人复诵无误后执行。"},{"id":"D002","type":"multi","ch":"5","sec":"5.3.1","stem":"关于倒闸操作发布指令，下列说法正确的是（　）。","options":["发布指令应准确、清晰，使用规范的调度术语和设备双重名称","发令人和受令人应先互报单位和姓名","发令人、受令人、操作人员（包括监护人）均应具备相应资质","发布指令的全过程（包括对方复诵指令）和听取指令的报告时应录音并作好记录"],"answer":["A","B","C","D"],"exp":"5.3.1 对发布指令的规范、互报身份、录音记录和资质均作了要求。"},{"id":"D003","type":"judge","ch":"5","sec":"5.3.1","stem":"操作人员对指令有疑问时可按自己的判断执行，事后报告发令人。","options":["正确","错误"],"answer":["B"],"exp":"5.3.1 对指令有疑问时应向发令人询问清楚无误后执行。"},{"id":"J001","type":"single","ch":"5","sec":"5.3.1","stem":"倒闸操作中，受令人接到指令后应（　）。","options":["复诵无误后执行","记录后择机执行","立即执行","请示运维负责人后执行"],"answer":["A"],"exp":"5.3.1 倒闸操作应根据值班调控人员或运维负责人的指令，受令人复诵无误后执行。"},{"id":"J002","type":"judge","ch":"5","sec":"5.3.1","stem":"发布倒闸操作指令时，只需对发令过程录音，受令人复诵和汇报可不录音。","options":["正确","错误"],"answer":["B"],"exp":"5.3.1 发布指令的全过程（包括对方复诵指令）和听取指令的报告时应录音并作好记录。"},{"id":"J003","type":"judge","ch":"5","sec":"5.3.1","stem":"操作人员（包括监护人）应了解操作目的和操作顺序。","options":["正确","错误"],"answer":["A"],"exp":"5.3.1 操作人员（包括监护人）应了解操作目的和操作顺序。"},{"id":"J004","type":"single","ch":"5","sec":"5.3.1","stem":"发令人和受令人在发布和接受指令前，应先（　）。","options":["互报单位和姓名","核对操作票编号","确认设备状态","报告当前时间"],"answer":["A"],"exp":"5.3.1 发令人和受令人应先互报单位和姓名。"},{"id":"D004","type":"multi","ch":"5","sec":"5.3.2","stem":"倒闸操作可以通过（　）完成。","options":["就地操作","遥控操作","程序操作","解锁操作"],"answer":["A","B","C"],"exp":"5.3.2 倒闸操作可以通过就地操作、遥控操作、程序操作完成。遥控操作、程序操作的设备应满足有关技术条件。"},{"id":"J005","type":"judge","ch":"5","sec":"5.3.2","stem":"遥控操作、程序操作的设备应满足有关技术条件。","options":["正确","错误"],"answer":["A"],"exp":"5.3.2 遥控操作、程序操作的设备应满足有关技术条件。"},{"id":"D005","type":"multi","ch":"5","sec":"5.3.3","stem":"倒闸操作的分类包括（　）。","options":["检修人员操作","程序操作","单人操作","监护操作"],"answer":["A","C","D"],"exp":"5.3.3 倒闸操作分为监护操作、单人操作、检修人员操作三类。程序操作是操作方式而非分类。"},{"id":"D006","type":"single","ch":"5","sec":"5.3.3.1","stem":"监护操作时，其中一人对设备（　）者作监护。","options":["资质较高","较为熟悉","职务较高","工龄较长"],"answer":["B"],"exp":"5.3.3.1 监护操作时，其中一人对设备较为熟悉者作监护。"},{"id":"D007","type":"single","ch":"5","sec":"5.3.3.1","stem":"特别重要和复杂的倒闸操作，由（　）。","options":["运维负责人操作，熟练的运维人员监护","检修人员操作，运维人员监护","熟练的运维人员操作，运维负责人监护","两名运维人员共同操作"],"answer":["C"],"exp":"5.3.3.1 特别重要和复杂的倒闸操作，由熟练的运维人员操作，运维负责人监护。"},{"id":"J006","type":"single","ch":"5","sec":"5.3.3.1","stem":"监护操作是指（　）。","options":["由检修人员完成的操作","有人监护的操作","由一人完成的操作","通过程序自动完成的操作"],"answer":["B"],"exp":"5.3.3.1 监护操作：有人监护的操作。"},{"id":"D008","type":"single","ch":"5","sec":"5.3.3.2","stem":"单人值班的变电站或发电厂升压站操作时，运维人员根据发令人用电话传达的操作指令（　）。","options":["可不填用操作票","由发令人代为填票","事后补填操作票","填用操作票，复诵无误"],"answer":["D"],"exp":"5.3.3.2 a）单人值班的变电站或发电厂升压站操作时，运维人员根据发令人用电话传达的操作指令填用操作票，复诵无误。"},{"id":"D009","type":"judge","ch":"5","sec":"5.3.3.2","stem":"若有可靠的确认和自动记录手段，调控人员可实行单人操作。","options":["正确","错误"],"answer":["A"],"exp":"5.3.3.2 b）若有可靠的确认和自动记录手段，调控人员可实行单人操作。"},{"id":"D010","type":"single","ch":"5","sec":"5.3.3.2","stem":"实行单人操作的设备、项目及人员需经（　）批准，人员应通过专项考核。","options":["工作票签发人","设备运维管理单位或调度控制中心","本单位安监部门","上级主管单位"],"answer":["B"],"exp":"5.3.3.2 c）实行单人操作的设备、项目及人员需经设备运维管理单位或调度控制中心批准，人员应通过专项考核。"},{"id":"J007","type":"single","ch":"5","sec":"5.3.3.2","stem":"单人操作是指（　）。","options":["无监护的遥控操作","由一人完成的操作","夜间值班的操作","事故紧急处理操作"],"answer":["B"],"exp":"5.3.3.2 单人操作：由一人完成的操作。"},{"id":"J008","type":"judge","ch":"5","sec":"5.3.3.2","stem":"实行单人操作的人员应通过专项考核。","options":["正确","错误"],"answer":["A"],"exp":"5.3.3.2 c）人员应通过专项考核。"},{"id":"D011","type":"single","ch":"5","sec":"5.3.3.3","stem":"经设备运维管理单位考试合格并批准的本单位的检修人员，可进行（　）及以下的电气设备由热备用至检修或由检修至热备用的监护操作。","options":["110kV","220kV","330kV","500kV"],"answer":["B"],"exp":"5.3.3.3 a）可进行220kV及以下的电气设备由热备用至检修或由检修至热备用的监护操作。"},{"id":"D012","type":"single","ch":"5","sec":"5.3.3.3","stem":"检修人员进行操作时，监护人应是（　）。","options":["工作票签发人","值班调控人员","同一单位的检修人员或设备运维人员","设备运维管理单位负责人"],"answer":["C"],"exp":"5.3.3.3 a）监护人应是同一单位的检修人员或设备运维人员。"},{"id":"D013","type":"judge","ch":"5","sec":"5.3.3.3","stem":"检修人员可进行500kV电气设备由热备用至检修的监护操作。","options":["正确","错误"],"answer":["B"],"exp":"5.3.3.3 a）限定为220kV及以下。"},{"id":"J009","type":"single","ch":"5","sec":"5.3.3.3","stem":"检修人员操作的范围是电气设备（　）的监护操作。","options":["由冷备用至运行","由运行至冷备用","由热备用至检修或由检修至热备用","由运行至检修"],"answer":["C"],"exp":"5.3.3.3 a）可进行220kV及以下的电气设备由热备用至检修或由检修至热备用的监护操作。"},{"id":"J010","type":"single","ch":"5","sec":"5.3.3.3","stem":"检修人员进行操作的接、发令程序及安全要求应由（　）审定，并报相关部门和调度控制中心备案。","options":["设备运维管理单位","检修单位","工区","安监部门"],"answer":["A"],"exp":"5.3.3.3 b）检修人员进行操作的接、发令程序及安全要求应由设备运维管理单位审定，并报相关部门和调度控制中心备案。"},{"id":"J011","type":"judge","ch":"5","sec":"5.3.3.3","stem":"检修人员进行倒闸操作时，可以由外单位人员担任监护人。","options":["正确","错误"],"answer":["B"],"exp":"5.3.3.3 a）监护人应是同一单位的检修人员或设备运维人员。"},{"id":"J012","type":"single","ch":"5","sec":"5.3.3.3","stem":"可进行检修人员操作的，应是经（　）考试合格并批准的本单位的检修人员。","options":["调度控制中心","设备运维管理单位","检修工区","本单位人资部门"],"answer":["B"],"exp":"5.3.3.3 a）经设备运维管理单位考试合格并批准的本单位的检修人员。"},{"id":"D014","type":"single","ch":"5","sec":"5.3.4.1","stem":"倒闸操作由（　）填用操作票。","options":["监护人","操作人员","值班调控人员","运维负责人"],"answer":["B"],"exp":"5.3.4.1 倒闸操作由操作人员填用操作票（见附录A）。"},{"id":"D015","type":"multi","ch":"5","sec":"5.3.4.2","stem":"关于操作票的填写，下列说法正确的是（　）。","options":["操作票票面应清楚整洁，不得任意涂改","应用黑色或蓝色的钢（水）笔或圆珠笔逐项填写","每张操作票只能填写一个操作任务","用计算机开出的操作票应与手写票面统一"],"answer":["A","B","C","D"],"exp":"5.3.4.2 对操作票的书写工具、票面统一、整洁不涂改以及\"每张操作票只能填写一个操作任务\"均有规定。"},{"id":"D016","type":"single","ch":"5","sec":"5.3.4.2","stem":"操作人和监护人应根据模拟图或接线图核对所填写的操作项目，并分别手工或电子签名，然后经（　）审核签名。","options":["值班调控人员","变电运维班长","运维负责人（检修人员操作时由工作负责人）","工作票签发人"],"answer":["C"],"exp":"5.3.4.2 操作人和监护人应根据模拟图或接线图核对所填写的操作项目，并分别手工或电子签名，然后经运维负责人（检修人员操作时由工作负责人）审核签名。"},{"id":"D017","type":"judge","ch":"5","sec":"5.3.4.2","stem":"每张操作票可以填写多个操作任务，以提高工作效率。","options":["正确","错误"],"answer":["B"],"exp":"5.3.4.2 每张操作票只能填写一个操作任务。"},{"id":"J013","type":"single","ch":"5","sec":"5.3.4.2","stem":"检修人员操作时，操作票由（　）审核签名。","options":["工作负责人","运维负责人","值班调控人员","工作票签发人"],"answer":["A"],"exp":"5.3.4.2 然后经运维负责人（检修人员操作时由工作负责人）审核签名。"},{"id":"J014","type":"single","ch":"5","sec":"5.3.4.2","stem":"操作票票面应使用（　）。","options":["设备的双重名称","设备型号","设备简称","设备编号"],"answer":["A"],"exp":"5.3.4.2 操作票应填写设备的双重名称。"},{"id":"J015","type":"judge","ch":"5","sec":"5.3.4.2","stem":"用计算机开出的操作票与手写票面格式可以不同。","options":["正确","错误"],"answer":["B"],"exp":"5.3.4.2 用计算机开出的操作票应与手写票面统一。"},{"id":"J016","type":"judge","ch":"5","sec":"5.3.4.2","stem":"操作票票面应清楚整洁，不得任意涂改。","options":["正确","错误"],"answer":["A"],"exp":"5.3.4.2 操作票票面应清楚整洁，不得任意涂改。"},{"id":"D018","type":"multi","ch":"5","sec":"5.3.4.3","stem":"下列（　）项目应填入操作票内。","options":["设备检修后合闸送电前，检查送电范围内接地刀闸（装置）已拉开，接地线已拆除","进行停、送电操作时，在拉合隔离开关（刀闸）或拉出、推入手车式开关前，检查断路器（开关）确在分闸位置","应拉合的设备［断路器（开关）、隔离开关（刀闸）、接地刀闸（装置）等］，验电，装拆接地线","拉合设备后检查设备的位置"],"answer":["A","B","C","D"],"exp":"5.3.4.3 a）~e）列举了应填入操作票的项目。"},{"id":"D019","type":"single","ch":"5","sec":"5.3.4.3","stem":"在进行倒负荷或解、并列操作前后，应检查（　）。","options":["接地线是否拆除","保护是否投入","直流电源是否正常","相关电源运行及负荷分配情况"],"answer":["D"],"exp":"5.3.4.3 d）在进行倒负荷或解、并列操作前后，检查相关电源运行及负荷分配情况。"},{"id":"D020","type":"multi","ch":"5","sec":"5.3.4.3","stem":"下列属于应填入操作票的高压直流输电系统相关项目的是（　）。","options":["控制方式改变、主控站转换，控制、保护系统投退","阀冷却、阀厅消防和空调系统的投退、方式变化等操作","换流变压器冷却器切换及分接头手动调节","高压直流输电系统启停、功率变化及状态转换"],"answer":["A","B","C","D"],"exp":"5.3.4.3 f）、g）以及 h）直流输电控制系统对断路器（开关）进行的锁定操作，均应填入操作票。"},{"id":"J017","type":"single","ch":"5","sec":"5.3.4.3","stem":"进行停、送电操作时，在拉合隔离开关（刀闸）或拉出、推入手车式开关前，应检查（　），此项应填入操作票。","options":["断路器（开关）确在分闸位置","控制电源确已断开","接地刀闸确在合闸位置","保护装置确已投入"],"answer":["A"],"exp":"5.3.4.3 c）检查断路器（开关）确在分闸位置。"},{"id":"J018","type":"single","ch":"5","sec":"5.3.4.3","stem":"设备检修后合闸送电前，应检查（　），此项应填入操作票。","options":["送电范围内接地刀闸（装置）已拉开，接地线已拆除","工作票已延期","遮栏已加高","保护定值已更改"],"answer":["A"],"exp":"5.3.4.3 e）设备检修后合闸送电前，检查送电范围内接地刀闸（装置）已拉开，接地线已拆除。"},{"id":"J019","type":"multi","ch":"5","sec":"5.3.4.3","stem":"根据5.3.4.3 a），下列应填入操作票的项目有（　）。","options":["检验是否确无电压","验电，装拆接地线","合上（安装）或断开（拆除）控制回路或电压互感器回路的空气开关、熔断器","切换保护回路和自动化装置"],"answer":["A","B","C","D"],"exp":"5.3.4.3 a）应拉合的设备，验电，装拆接地线，合上（安装）或断开（拆除）控制回路或电压互感器回路的空气开关、熔断器，切换保护回路和自动化装置及检验是否确无电压等。"},{"id":"J020","type":"judge","ch":"5","sec":"5.3.4.3","stem":"直流输电控制系统对断路器（开关）进行的锁定操作应填入操作票。","options":["正确","错误"],"answer":["A"],"exp":"5.3.4.3 h）直流输电控制系统对断路器（开关）进行的锁定操作。"},{"id":"J021","type":"judge","ch":"5","sec":"5.3.4.3","stem":"拉合设备后检查设备的位置，可以不填入操作票。","options":["正确","错误"],"answer":["B"],"exp":"5.3.4.3 b）拉合设备［断路器（开关）、隔离开关（刀闸）、接地刀闸（装置）等］后检查设备的位置，应填入操作票。"},{"id":"J022","type":"multi","ch":"5","sec":"5.3.5","stem":"倒闸操作的基本条件包括（　）。","options":["操作设备应具有明显的标志","高压电气设备都应安装完善的防误操作闭锁装置","有与现场一次设备和实际运行方式相符的一次系统模拟图","有值班调控人员、运维负责人正式发布的指令，并使用经事先审核合格的操作票"],"answer":["A","B","C","D"],"exp":"5.3.5.1~5.3.5.4 倒闸操作的基本条件。"},{"id":"D021","type":"single","ch":"5","sec":"5.3.5.1","stem":"倒闸操作的基本条件之一是，有与现场一次设备和实际运行方式相符的（　）。","options":["二次回路图","一次系统模拟图（包括各种电子接线图）","设备台账","运行规程"],"answer":["B"],"exp":"5.3.5.1 有与现场一次设备和实际运行方式相符的一次系统模拟图（包括各种电子接线图）。"},{"id":"D022","type":"multi","ch":"5","sec":"5.3.5.2","stem":"操作设备应具有明显的标志，包括（　）。","options":["设备相色","命名、编号","分合指示","旋转方向、切换位置的指示"],"answer":["A","B","C","D"],"exp":"5.3.5.2 操作设备应具有明显的标志，包括命名、编号、分合指示，旋转方向、切换位置的指示及设备相色等。"},{"id":"D023","type":"single","ch":"5","sec":"5.3.5.3","stem":"停用防误操作闭锁装置应经（　）批准。","options":["设备运维管理单位","变电运维班（站）长","值班调控人员","工作票签发人"],"answer":["A"],"exp":"5.3.5.3 防误操作闭锁装置不得随意退出运行，停用防误操作闭锁装置应经设备运维管理单位批准。"},{"id":"D024","type":"single","ch":"5","sec":"5.3.5.3","stem":"短时间退出防误操作闭锁装置时，应经（　）批准，并应按程序尽快投入。","options":["设备运维管理单位","调度控制中心","变电运维班（站）长或发电厂当班值长","安监部门"],"answer":["C"],"exp":"5.3.5.3 短时间退出防误操作闭锁装置时，应经变电运维班（站）长或发电厂当班值长批准，并应按程序尽快投入。"},{"id":"D025","type":"judge","ch":"5","sec":"5.3.5.3","stem":"防误操作闭锁装置可以根据现场需要随意退出运行。","options":["正确","错误"],"answer":["B"],"exp":"5.3.5.3 防误操作闭锁装置不得随意退出运行。"},{"id":"J023","type":"single","ch":"5","sec":"5.3.5.3","stem":"（　）都应安装完善的防误操作闭锁装置。","options":["35kV及以上设备","所有电气设备","高压电气设备","110kV及以上设备"],"answer":["C"],"exp":"5.3.5.3 高压电气设备都应安装完善的防误操作闭锁装置。"},{"id":"J024","type":"single","ch":"5","sec":"5.3.5.3","stem":"发电厂短时间退出防误操作闭锁装置时，应经（　）批准。","options":["调度","设备运维管理单位","当班值长","厂长"],"answer":["C"],"exp":"5.3.5.3 短时间退出防误操作闭锁装置时，应经变电运维班（站）长或发电厂当班值长批准，并应按程序尽快投入。"},{"id":"J025","type":"single","ch":"5","sec":"5.3.5.4","stem":"倒闸操作应使用（　）的操作票。","options":["经事先审核合格","当场填写","调度下发","口头确认"],"answer":["A"],"exp":"5.3.5.4 有值班调控人员、运维负责人正式发布的指令，并使用经事先审核合格的操作票。"},{"id":"D026","type":"multi","ch":"5","sec":"5.3.5.5","stem":"下列（　）情况应加挂机械锁。","options":["高压室大门","设备检修时，回路中的各来电侧刀闸操作手柄和电动操作刀闸机构箱的箱门","当电气设备处于冷备用时，网门闭锁失去作用时的有电间隔网门","未装防误操作闭锁装置或闭锁装置失灵的刀闸手柄、阀厅大门和网门"],"answer":["B","C","D"],"exp":"5.3.5.5 规定了应加挂机械锁的三种情况。"},{"id":"D027","type":"single","ch":"5","sec":"5.3.5.5","stem":"机械锁要（　）。","options":["1把钥匙开多把锁，便于管理","由工作负责人统一保管","1把钥匙开1把锁，钥匙要编号并妥善保管","与防误装置钥匙通用"],"answer":["C"],"exp":"5.3.5.5 机械锁要1把钥匙开1把锁，钥匙要编号并妥善保管。"},{"id":"J026","type":"single","ch":"5","sec":"5.3.5.5","stem":"当电气设备处于冷备用时，网门闭锁失去作用时的（　）应加挂机械锁。","options":["有电间隔网门","所有网门","主控室大门","检修间隔网门"],"answer":["A"],"exp":"5.3.5.5 b）当电气设备处于冷备用时，网门闭锁失去作用时的有电间隔网门。"},{"id":"J027","type":"single","ch":"5","sec":"5.3.5.5","stem":"设备检修时，回路中的各来电侧刀闸操作手柄和（　）应加挂机械锁。","options":["开关柜后门","保护屏柜门","端子箱门","电动操作刀闸机构箱的箱门"],"answer":["D"],"exp":"5.3.5.5 c）设备检修时，回路中的各来电侧刀闸操作手柄和电动操作刀闸机构箱的箱门。"},{"id":"J028","type":"judge","ch":"5","sec":"5.3.5.5","stem":"未装防误操作闭锁装置的阀厅大门应加挂机械锁。","options":["正确","错误"],"answer":["A"],"exp":"5.3.5.5 a）未装防误操作闭锁装置或闭锁装置失灵的刀闸手柄、阀厅大门和网门。"},{"id":"J059","type":"single","ch":"5","sec":"5.3.6","stem":"下列关于倒闸操作基本要求的说法，错误的是（　）。","options":["雷电时禁止就地倒闸操作","装卸高压熔断器应戴护目眼镜和绝缘手套","单人操作时可以进行登高操作","禁止带负荷拉合隔离开关"],"answer":["C"],"exp":"5.3.6.13 单人操作时不得进行登高或登杆操作。"},{"id":"D028","type":"single","ch":"5","sec":"5.3.6.1","stem":"停电拉闸操作应按照（　）的顺序依次进行。","options":["断路器（开关）→负荷侧隔离开关（刀闸）→电源侧隔离开关（刀闸）","负荷侧隔离开关（刀闸）→断路器（开关）→电源侧隔离开关（刀闸）","断路器（开关）→电源侧隔离开关（刀闸）→负荷侧隔离开关（刀闸）","电源侧隔离开关（刀闸）→断路器（开关）→负荷侧隔离开关（刀闸）"],"answer":["A"],"exp":"5.3.6.1 停电拉闸操作应按照断路器（开关）—负荷侧隔离开关（刀闸）—电源侧隔离开关（刀闸）的顺序依次进行，送电合闸操作应按与上述相反的顺序进行。"},{"id":"D029","type":"judge","ch":"5","sec":"5.3.6.1","stem":"送电合闸操作应按照断路器（开关）→负荷侧隔离开关→电源侧隔离开关的顺序进行。","options":["正确","错误"],"answer":["B"],"exp":"5.3.6.1 送电合闸操作应按与停电拉闸相反的顺序进行，即电源侧隔离开关→负荷侧隔离开关→断路器。"},{"id":"D030","type":"judge","ch":"5","sec":"5.3.6.1","stem":"禁止带负荷拉合隔离开关（刀闸）。","options":["正确","错误"],"answer":["A"],"exp":"5.3.6.1 禁止带负荷拉合隔离开关（刀闸）。"},{"id":"J029","type":"single","ch":"5","sec":"5.3.6.1","stem":"某线路停电，已断开断路器，下一步应拉开（　）。","options":["接地刀闸","负荷侧（线路侧）隔离开关","电源侧（母线侧）隔离开关","母联断路器"],"answer":["B"],"exp":"5.3.6.1 停电拉闸：断路器→负荷侧隔离开关→电源侧隔离开关。"},{"id":"J030","type":"single","ch":"5","sec":"5.3.6.1","stem":"送电合闸操作时，首先应合上（　）。","options":["电源侧隔离开关","接地刀闸","负荷侧隔离开关","断路器"],"answer":["A"],"exp":"5.3.6.1 送电合闸操作应按与停电相反的顺序进行：电源侧隔离开关→负荷侧隔离开关→断路器。"},{"id":"J031","type":"single","ch":"5","sec":"5.3.6.1","stem":"送电合闸操作中，最后操作的设备是（　）。","options":["负荷侧隔离开关","断路器（开关）","接地刀闸","电源侧隔离开关"],"answer":["B"],"exp":"5.3.6.1 送电：电源侧隔离开关→负荷侧隔离开关→断路器，断路器最后合。"},{"id":"D031","type":"multi","ch":"5","sec":"5.3.6.2","stem":"关于现场开始操作前后的要求，下列正确的是（　）。","options":["操作中应认真执行监护复诵制度，单人操作时也应高声唱票","宜全过程录音","操作前应先核对系统方式、设备名称、编号和位置","应先在模拟图（或微机防误装置、微机监控装置）上进行核对性模拟预演"],"answer":["A","B","C","D"],"exp":"5.3.6.2 对模拟预演、核对、监护复诵、录音均有规定。"},{"id":"D032","type":"single","ch":"5","sec":"5.3.6.2","stem":"操作过程中应按操作票填写的顺序逐项操作。每操作完一步，应（　）。","options":["记录操作时间","检查无误后作一个\"√\"记号","立即向发令人汇报","请监护人签字"],"answer":["B"],"exp":"5.3.6.2 每操作完一步，应检查无误后作一个\"√\"记号，全部操作完毕后进行复查。"},{"id":"J032","type":"judge","ch":"5","sec":"5.3.6.2","stem":"单人操作时，可不进行唱票。","options":["正确","错误"],"answer":["B"],"exp":"5.3.6.2 操作中应认真执行监护复诵制度（单人操作时也应高声唱票）。"},{"id":"J033","type":"judge","ch":"5","sec":"5.3.6.2","stem":"倒闸操作全部完毕后应进行复查。","options":["正确","错误"],"answer":["A"],"exp":"5.3.6.2 全部操作完毕后进行复查。"},{"id":"J034","type":"judge","ch":"5","sec":"5.3.6.2","stem":"熟练的运维人员可以根据现场情况调整操作票中的操作顺序。","options":["正确","错误"],"answer":["B"],"exp":"5.3.6.2 操作过程中应按操作票填写的顺序逐项操作；5.3.6.5 不准擅自更改操作票。"},{"id":"J035","type":"single","ch":"5","sec":"5.3.6.2","stem":"倒闸操作过程中，（　）全过程录音。","options":["应","不必","必须","宜"],"answer":["D"],"exp":"5.3.6.2 宜全过程录音。注意：5.3.1 规定发布指令全过程应录音。"},{"id":"D033","type":"judge","ch":"5","sec":"5.3.6.3","stem":"监护操作时，操作人在操作过程中不准有任何未经监护人同意的操作行为。","options":["正确","错误"],"answer":["A"],"exp":"5.3.6.3 监护操作时，操作人在操作过程中不准有任何未经监护人同意的操作行为。"},{"id":"D034","type":"single","ch":"5","sec":"5.3.6.4","stem":"远方操作一次设备前，（　）对现场发出提示信号，提醒现场人员远离操作设备。","options":["宜","不必","必须","应"],"answer":["A"],"exp":"5.3.6.4 远方操作一次设备前，宜对现场发出提示信号。"},{"id":"D035","type":"single","ch":"5","sec":"5.3.6.5","stem":"操作中发生疑问时，应（　）。","options":["立即停止操作并向发令人报告，待发令人再行许可后方可进行操作","自行判断后调整操作顺序","按操作票继续操作","由监护人决定是否继续"],"answer":["A"],"exp":"5.3.6.5 操作中发生疑问时，应立即停止操作并向发令人报告。待发令人再行许可后，方可进行操作。"},{"id":"D036","type":"multi","ch":"5","sec":"5.3.6.5","stem":"关于解锁工具（钥匙）的管理，下列说法正确的是（　）。","options":["所有操作人员和检修人员禁止擅自使用解锁工具（钥匙）","解锁工具（钥匙）使用后应及时封存并作好记录","解锁工具（钥匙）应封存保管","单人操作、检修人员在倒闸操作过程中禁止解锁"],"answer":["A","B","C","D"],"exp":"5.3.6.5 对解锁工具的封存、禁止擅自使用、禁止单人及检修人员解锁、使用后封存记录均有规定。"},{"id":"D037","type":"single","ch":"5","sec":"5.3.6.5","stem":"若遇特殊情况需解锁操作，应经运维管理部门防误操作装置专责人或运维管理部门指定并经书面公布的人员到现场核实无误并签字后，由（　）告知当值调控人员，方能使用解锁工具（钥匙）。","options":["工作负责人","检修人员","运维人员","操作人"],"answer":["C"],"exp":"5.3.6.5 由运维人员告知当值调控人员，方能使用解锁工具（钥匙）。"},{"id":"D038","type":"single","ch":"5","sec":"5.3.6.5","stem":"单人操作、检修人员在倒闸操作过程中如需解锁，应（　）。","options":["向发令人口头报告后解锁","停止操作并结束当日工作","待增派运维人员到现场，履行规定手续后处理","经监护人同意后自行解锁"],"answer":["C"],"exp":"5.3.6.5 如需解锁，应待增派运维人员到现场，履行上述手续后处理。"},{"id":"J036","type":"judge","ch":"5","sec":"5.3.6.5","stem":"操作中闭锁装置影响操作进度时，操作人员可以随意解除闭锁装置。","options":["正确","错误"],"answer":["B"],"exp":"5.3.6.5 不准随意解除闭锁装置。"},{"id":"J037","type":"single","ch":"5","sec":"5.3.6.5","stem":"特殊情况需解锁操作时，应经（　）到现场核实无误并签字。","options":["工作负责人","运维管理部门防误操作装置专责人或运维管理部门指定并经书面公布的人员","当值调控人员","操作监护人"],"answer":["B"],"exp":"5.3.6.5 应经运维管理部门防误操作装置专责人或运维管理部门指定并经书面公布的人员到现场核实无误并签字后，由运维人员告知当值调控人员，方能使用解锁工具（钥匙）。"},{"id":"J038","type":"single","ch":"5","sec":"5.3.6.5","stem":"下列关于倒闸操作中发生疑问的处理，错误的是（　）。","options":["待发令人再行许可后，方可进行操作","应向发令人报告","由监护人确认无误后继续操作","应立即停止操作"],"answer":["C"],"exp":"5.3.6.5 操作中发生疑问时，应立即停止操作并向发令人报告，待发令人再行许可后，方可进行操作。"},{"id":"D039","type":"single","ch":"5","sec":"5.3.6.6","stem":"电气设备操作后的位置检查应以（　）为准。","options":["操作票记录","监控系统遥信","控制屏信号指示","设备各相实际位置"],"answer":["D"],"exp":"5.3.6.6 电气设备操作后的位置检查应以设备各相实际位置为准，无法看到实际位置时，应通过间接方法判断。"},{"id":"D040","type":"single","ch":"5","sec":"5.3.6.6","stem":"间接判断设备位置时，至少应有（　）个非同样原理或非同源的指示发生对应变化，且所有这些确定的指示均已同时发生对应变化，方可确认该设备已操作到位。","options":["三","四","两","一"],"answer":["C"],"exp":"5.3.6.6 判断时，至少应有两个非同样原理或非同源的指示发生对应变化。"},{"id":"D041","type":"judge","ch":"5","sec":"5.3.6.6","stem":"间接判断设备位置的检查项目应填写在操作票中作为检查项。","options":["正确","错误"],"answer":["A"],"exp":"5.3.6.6 以上检查项目应填写在操作票中作为检查项。"},{"id":"J039","type":"judge","ch":"5","sec":"5.3.6.6","stem":"间接判断设备位置时，只要有两个同源的指示同时发生对应变化，即可确认设备已操作到位。","options":["正确","错误"],"answer":["B"],"exp":"5.3.6.6 至少应有两个非同样原理或非同源的指示发生对应变化。"},{"id":"J040","type":"single","ch":"5","sec":"5.3.6.6","stem":"间接判断设备位置时，若发现其他任何信号有异常，应（　）。","options":["报告后继续操作","继续操作并记录","停止操作，查明原因","以多数信号为准"],"answer":["C"],"exp":"5.3.6.6 检查中若发现其他任何信号有异常，均应停止操作，查明原因。"},{"id":"J041","type":"multi","ch":"5","sec":"5.3.6.6","stem":"无法看到设备实际位置时，可通过下列（　）间接方法判断设备位置。","options":["仪表","设备机械位置指示","电气指示、带电显示装置","各种遥测、遥信等信号的变化"],"answer":["A","B","C","D"],"exp":"5.3.6.6 应通过间接方法，如设备机械位置指示、电气指示、带电显示装置、仪表及各种遥测、遥信等信号的变化来判断。"},{"id":"D042","type":"single","ch":"5","sec":"5.3.6.7","stem":"继电保护远方操作时，至少应有（　）个指示发生对应变化，且所有这些确定的指示均已同时发生对应变化，才能确认该设备已操作到位。","options":["一","三","四","两"],"answer":["D"],"exp":"5.3.6.7 继电保护远方操作时，至少应有两个指示发生对应变化。"},{"id":"D043","type":"single","ch":"5","sec":"5.3.6.8","stem":"换流站直流系统应采用程序操作，程序操作不成功，在查明原因并经（　）许可后可进行遥控步进操作。","options":["工作负责人","设备运维管理单位","运维负责人","值班调控人员"],"answer":["D"],"exp":"5.3.6.8 在查明原因并经值班调控人员许可后可进行遥控步进操作。"},{"id":"J042","type":"judge","ch":"5","sec":"5.3.6.8","stem":"换流站直流系统程序操作不成功时，运维人员可直接进行遥控步进操作。","options":["正确","错误"],"answer":["B"],"exp":"5.3.6.8 应在查明原因并经值班调控人员许可后可进行遥控步进操作。"},{"id":"D044","type":"multi","ch":"5","sec":"5.3.6.9","stem":"用绝缘棒拉合隔离开关（刀闸）、高压熔断器或经传动机构拉合断路器（开关）和隔离开关（刀闸），（　）。","options":["接地网电阻不符合要求的，晴天也应穿绝缘靴","均应戴绝缘手套","雨天操作室外高压设备时，绝缘棒应有防雨罩，还应穿绝缘靴","雷电时，禁止就地倒闸操作"],"answer":["A","B","C","D"],"exp":"5.3.6.9 对绝缘手套、雨天防雨罩与绝缘靴、接地网电阻不合格时晴天也穿绝缘靴、雷电时禁止就地倒闸操作均有规定。"},{"id":"D045","type":"judge","ch":"5","sec":"5.3.6.9","stem":"雷电时，禁止就地倒闸操作。","options":["正确","错误"],"answer":["A"],"exp":"5.3.6.9 雷电时，禁止就地倒闸操作。"},{"id":"J043","type":"single","ch":"5","sec":"5.3.6.9","stem":"接地网电阻不符合要求时，用绝缘棒拉合隔离开关（　）。","options":["无需穿绝缘靴","晴天也应穿绝缘靴","只需戴绝缘手套","仅雨天需穿绝缘靴"],"answer":["B"],"exp":"5.3.6.9 接地网电阻不符合要求的，晴天也应穿绝缘靴。"},{"id":"J044","type":"single","ch":"5","sec":"5.3.6.9","stem":"雨天操作室外高压设备时，绝缘棒应有（　）。","options":["接地线","防雨罩","标示牌","加长杆"],"answer":["B"],"exp":"5.3.6.9 雨天操作室外高压设备时，绝缘棒应有防雨罩，还应穿绝缘靴。"},{"id":"J045","type":"judge","ch":"5","sec":"5.3.6.9","stem":"经传动机构拉合断路器（开关）和隔离开关（刀闸）时，可以不戴绝缘手套。","options":["正确","错误"],"answer":["B"],"exp":"5.3.6.9 用绝缘棒拉合隔离开关（刀闸）、高压熔断器或经传动机构拉合断路器（开关）和隔离开关（刀闸），均应戴绝缘手套。"},{"id":"D046","type":"multi","ch":"5","sec":"5.3.6.10","stem":"装卸高压熔断器，应（　）。","options":["戴绝缘手套","戴护目眼镜","站在绝缘垫或绝缘台上","必要时使用绝缘夹钳"],"answer":["A","B","C","D"],"exp":"5.3.6.10 装卸高压熔断器，应戴护目眼镜和绝缘手套，必要时使用绝缘夹钳，并站在绝缘垫或绝缘台上。"},{"id":"J046","type":"single","ch":"5","sec":"5.3.6.10","stem":"装卸高压熔断器时，必要时应使用（　）。","options":["接地线","绝缘棒","绝缘夹钳","验电器"],"answer":["C"],"exp":"5.3.6.10 装卸高压熔断器，应戴护目眼镜和绝缘手套，必要时使用绝缘夹钳，并站在绝缘垫或绝缘台上。"},{"id":"D047","type":"multi","ch":"5","sec":"5.3.6.11","stem":"断路器（开关）遮断容量应满足电网要求。如遮断容量不够，应（　）。","options":["用墙或金属板将操动机构（操作机构）与该断路器（开关）隔开","重合闸装置应停用","增加监护人","进行远方操作"],"answer":["A","B","D"],"exp":"5.3.6.11 如遮断容量不够，应用墙或金属板将操动机构与该断路器隔开，应进行远方操作，重合闸装置应停用。"},{"id":"J047","type":"judge","ch":"5","sec":"5.3.6.11","stem":"断路器遮断容量不够时，应进行就地操作，重合闸装置应投入。","options":["正确","错误"],"answer":["B"],"exp":"5.3.6.11 如遮断容量不够，应进行远方操作，重合闸装置应停用。"},{"id":"D048","type":"single","ch":"5","sec":"5.3.6.12","stem":"电气设备停电后（包括事故停电），在未拉开有关隔离开关（刀闸）和做好安全措施前，（　）。","options":["可以进入遮栏但不得触及设备","可由两人进入遮栏","可以进行外观检查","不得触及设备或进入遮栏"],"answer":["D"],"exp":"5.3.6.12 在未拉开有关隔离开关（刀闸）和做好安全措施前，不得触及设备或进入遮栏，以防突然来电。"},{"id":"J048","type":"judge","ch":"5","sec":"5.3.6.12","stem":"事故停电后，在未拉开有关隔离开关和做好安全措施前，可以进入遮栏检查设备。","options":["正确","错误"],"answer":["B"],"exp":"5.3.6.12 电气设备停电后（包括事故停电），在未拉开有关隔离开关（刀闸）和做好安全措施前，不得触及设备或进入遮栏，以防突然来电。"},{"id":"J049","type":"single","ch":"5","sec":"5.3.6.12","stem":"电气设备停电后不得触及设备或进入遮栏，目的是（　）。","options":["以防误入间隔","以防突然来电","以防设备损坏","以防感应电压"],"answer":["B"],"exp":"5.3.6.12 以防突然来电。"},{"id":"D049","type":"judge","ch":"5","sec":"5.3.6.13","stem":"单人操作时不得进行登高或登杆操作。","options":["正确","错误"],"answer":["A"],"exp":"5.3.6.13 单人操作时不得进行登高或登杆操作。"},{"id":"D050","type":"single","ch":"5","sec":"5.3.6.14","stem":"在发生人身触电事故时，（　）断开有关设备的电源，但事后应立即报告调度控制中心（或设备运维管理单位）和上级部门。","options":["应经工作负责人许可后","可以不经许可，即行","应经调控人员许可后","应填用操作票后"],"answer":["B"],"exp":"5.3.6.14 在发生人身触电事故时，可以不经许可，即行断开有关设备的电源，但事后应立即报告。"},{"id":"J050","type":"judge","ch":"5","sec":"5.3.6.14","stem":"发生人身触电事故时，应先向调控人员申请，经许可后再断开有关设备电源。","options":["正确","错误"],"answer":["B"],"exp":"5.3.6.14 在发生人身触电事故时，可以不经许可，即行断开有关设备的电源，但事后应立即报告。"},{"id":"J051","type":"multi","ch":"5","sec":"5.3.6.14","stem":"发生人身触电事故不经许可断开电源后，事后应立即报告（　）。","options":["公安部门","调度控制中心（或设备运维管理单位）","上级部门","工作票签发人"],"answer":["B","C"],"exp":"5.3.6.14 事后应立即报告调度控制中心（或设备运维管理单位）和上级部门。"},{"id":"D051","type":"single","ch":"5","sec":"5.3.6.15","stem":"同一直流系统两端换流站间发生系统通信故障时，两换流站间的操作应根据（　）的指令配合执行。","options":["运维负责人","值班调控人员","主控站","设备运维管理单位"],"answer":["B"],"exp":"5.3.6.15 两换流站间的操作应根据值班调控人员的指令配合执行。"},{"id":"D052","type":"multi","ch":"5","sec":"5.3.6.16","stem":"双极直流输电系统单极停运检修时，（　）。","options":["禁止合上停运极中性线大地/金属回线隔离开关（刀闸）","可以操作双极公共区域设备","禁止操作双极公共区域设备","可以合上停运极中性线隔离开关"],"answer":["A","C"],"exp":"5.3.6.16 双极直流输电系统单极停运检修时，禁止操作双极公共区域设备，禁止合上停运极中性线大地/金属回线隔离开关（刀闸）。"},{"id":"D053","type":"single","ch":"5","sec":"5.3.6.17","stem":"直流系统升降功率前应确认功率设定值（　）当前系统允许的最小功率，且不能超过当前系统允许的最大功率限制。","options":["不小于","等于","不大于","远大于"],"answer":["A"],"exp":"5.3.6.17 应确认功率设定值不小于当前系统允许的最小功率，且不能超过当前系统允许的最大功率限制。"},{"id":"J052","type":"judge","ch":"5","sec":"5.3.6.17","stem":"直流系统升降功率时，功率设定值可以超过当前系统允许的最大功率限制。","options":["正确","错误"],"answer":["B"],"exp":"5.3.6.17 不能超过当前系统允许的最大功率限制。"},{"id":"D054","type":"single","ch":"5","sec":"5.3.6.18","stem":"手动切除交流滤波器（并联电容器）前，应检查系统（　）。","options":["负荷率低于50%","有足够的备用数量，保证满足当前输送功率无功需求","电压在允许范围内","频率正常"],"answer":["B"],"exp":"5.3.6.18 应检查系统有足够的备用数量，保证满足当前输送功率无功需求。"},{"id":"D055","type":"single","ch":"5","sec":"5.3.6.19","stem":"交流滤波器（并联电容器）退出运行后再次投入运行前，应满足（　）要求。","options":["系统电压","无功平衡","电容器放电时间","保护投入"],"answer":["C"],"exp":"5.3.6.19 交流滤波器（并联电容器）退出运行后再次投入运行前，应满足电容器放电时间要求。"},{"id":"D056","type":"multi","ch":"5","sec":"5.3.7","stem":"下列（　）工作可以不用操作票。","options":["单人操作","程序操作","拉合断路器（开关）的单一操作","事故紧急处理"],"answer":["B","C","D"],"exp":"5.3.7 下列各项工作可以不用操作票：a）事故紧急处理；b）拉合断路器（开关）的单一操作；c）程序操作。"},{"id":"D057","type":"judge","ch":"5","sec":"5.3.7","stem":"可以不用操作票的操作，在完成后也不需要作记录。","options":["正确","错误"],"answer":["B"],"exp":"5.3.7 上述操作在完成后应作好记录，事故紧急处理应保存原始记录。"},{"id":"J053","type":"judge","ch":"5","sec":"5.3.7","stem":"拉合断路器（开关）的单一操作可以不用操作票。","options":["正确","错误"],"answer":["A"],"exp":"5.3.7 b）拉合断路器（开关）的单一操作可以不用操作票。"},{"id":"J054","type":"judge","ch":"5","sec":"5.3.7","stem":"拉合隔离开关（刀闸）的单一操作可以不用操作票。","options":["正确","错误"],"answer":["B"],"exp":"5.3.7 只有拉合断路器（开关）的单一操作可不用操作票，不含隔离开关。"},{"id":"J055","type":"single","ch":"5","sec":"5.3.7","stem":"事故紧急处理不用操作票，但应（　）。","options":["保存原始记录","事后补填操作票","经调度书面批准","由两人签字确认"],"answer":["A"],"exp":"5.3.7 上述操作在完成后应作好记录，事故紧急处理应保存原始记录。"},{"id":"D058","type":"multi","ch":"5","sec":"5.3.8","stem":"关于操作票的编号与注明，下列说法正确的是（　）。","options":["同一变电站的操作票应事先连续编号，计算机生成的操作票应在正式出票前连续编号","作废的操作票应注明\"作废\"字样，未执行的应注明\"未执行\"字样","操作票按编号顺序使用","已操作的应注明\"已执行\"字样"],"answer":["A","B","C","D"],"exp":"5.3.8 对操作票的编号、使用顺序和三种注明字样均有规定。"},{"id":"D059","type":"single","ch":"5","sec":"5.3.8","stem":"操作票应保存（　）。","options":["三年","一年","两年","半年"],"answer":["B"],"exp":"5.3.8 操作票应保存一年。已终结的工作票、事故紧急抢修单也应保存1年（6.6.7）。"},{"id":"J056","type":"single","ch":"5","sec":"5.3.8","stem":"计算机生成的操作票应在（　）连续编号。","options":["月末统一","正式出票前","使用后","打印后手工"],"answer":["B"],"exp":"5.3.8 计算机生成的操作票应在正式出票前连续编号。"},{"id":"J057","type":"single","ch":"5","sec":"5.3.8","stem":"已填写但因故未执行的操作票，应注明（　）字样。","options":["\"作废\"","\"未执行\"","\"取消\"","\"已执行\""],"answer":["B"],"exp":"5.3.8 作废的注明\"作废\"，未执行的注明\"未执行\"，已操作的注明\"已执行\"。"},{"id":"J058","type":"judge","ch":"5","sec":"5.3.8","stem":"同一变电站的操作票可以不按编号顺序使用。","options":["正确","错误"],"answer":["B"],"exp":"5.3.8 操作票按编号顺序使用。"},{"id":"J063","type":"single","ch":"5","sec":"5.4","stem":"在高压设备上工作，下列说法错误的是（　）。","options":["应完成保证安全的技术措施","应完成保证安全的组织措施","应至少由两人进行","技术措施完备时可一人进行"],"answer":["D"],"exp":"5.4.2 在高压设备上工作，应至少由两人进行，并完成保证安全的组织措施和技术措施。"},{"id":"D060","type":"multi","ch":"5","sec":"5.4.1","stem":"在运用中的高压设备上工作，分为（　）。","options":["部分停电的工作","带电作业","不停电工作","全部停电的工作"],"answer":["A","C","D"],"exp":"5.4.1 在运用中的高压设备上工作，分为全部停电的工作、部分停电的工作、不停电工作三类。"},{"id":"J060","type":"single","ch":"5","sec":"5.4.1","stem":"室内高压设备全部停电，但通至邻接高压室的门并未全部闭锁，此类工作属于（　）。","options":["部分停电的工作","不停电工作","全部停电的工作","带电作业"],"answer":["A"],"exp":"5.4.1.2 部分停电的工作包括室内虽全部停电，而通至邻接高压室的门并未全部闭锁的工作。"},{"id":"D061","type":"single","ch":"5","sec":"5.4.1.1","stem":"全部停电的工作，是指室内高压设备全部停电（包括架空线路与电缆引入线在内），并且（　），以及室外高压设备全部停电（包括架空线路与电缆引入线在内）的工作。","options":["通至邻接高压室的门部分闭锁","已悬挂标示牌","所有设备已装设接地线","通至邻接高压室的门全部闭锁"],"answer":["D"],"exp":"5.4.1.1 全部停电的工作要求通至邻接高压室的门全部闭锁。"},{"id":"J061","type":"judge","ch":"5","sec":"5.4.1.1","stem":"室外高压设备全部停电的工作，应包括架空线路与电缆引入线在内。","options":["正确","错误"],"answer":["A"],"exp":"5.4.1.1 室外高压设备全部停电（包括架空线路与电缆引入线在内）的工作。"},{"id":"D062","type":"single","ch":"5","sec":"5.4.1.2","stem":"部分停电的工作，是指高压设备部分停电，或（　）的工作。","options":["室内虽全部停电，而通至邻接高压室的门并未全部闭锁","设备处于冷备用状态","室内全部停电且门全部闭锁","室外全部停电"],"answer":["A"],"exp":"5.4.1.2 部分停电的工作，是指高压设备部分停电，或室内虽全部停电，而通至邻接高压室的门并未全部闭锁的工作。"},{"id":"D063","type":"multi","ch":"5","sec":"5.4.1.3","stem":"不停电工作是指（　）。","options":["部分停电的工作","可在带电设备外壳上或导电部分上进行的工作","设备停电后不装设接地线的工作","工作本身不需要停电并且不可能触及导电部分的工作"],"answer":["B","D"],"exp":"5.4.1.3 不停电工作包括 a）工作本身不需要停电并且不可能触及导电部分的工作；b）可在带电设备外壳上或导电部分上进行的工作。"},{"id":"J062","type":"single","ch":"5","sec":"5.4.1.3","stem":"在带电设备外壳上进行的工作属于（　）。","options":["带电作业","不停电工作","全部停电的工作","部分停电的工作"],"answer":["B"],"exp":"5.4.1.3 b）可在带电设备外壳上或导电部分上进行的工作属于不停电工作。"},{"id":"D064","type":"single","ch":"5","sec":"5.4.2","stem":"在高压设备上工作，应至少由（　）人进行，并完成保证安全的组织措施和技术措施。","options":["两","四","一","三"],"answer":["A"],"exp":"5.4.2 在高压设备上工作，应至少由两人进行，并完成保证安全的组织措施和技术措施。"},{"id":"D065","type":"judge","ch":"5","sec":"5.4.2","stem":"在高压设备上工作，只要完成了保证安全的技术措施，可由一人单独进行。","options":["正确","错误"],"answer":["B"],"exp":"5.4.2 应至少由两人进行，并同时完成保证安全的组织措施和技术措施。"},{"id":"E001","type":"multi","ch":"6","sec":"6.1","stem":"在电气设备上工作，保证安全的组织措施包括（　）。","options":["工作监护制度；工作间断、转移和终结制度","现场勘察制度","工作许可制度","工作票制度"],"answer":["A","B","C","D"],"exp":"6.1 保证安全的组织措施为：现场勘察制度、工作票制度、工作许可制度、工作监护制度、工作间断转移和终结制度，共5项。"},{"id":"E002","type":"single","ch":"6","sec":"6.1","stem":"保证安全的组织措施共有（　）项。","options":["5","4","3","6"],"answer":["A"],"exp":"6.1 共5项组织措施：现场勘察、工作票、工作许可、工作监护、工作间断转移和终结制度。"},{"id":"E003","type":"judge","ch":"6","sec":"6.1","stem":"停电、验电、接地属于保证安全的组织措施。","options":["正确","错误"],"answer":["B"],"exp":"停电、验电、接地、悬挂标示牌和装设遮栏（围栏）属于保证安全的技术措施（7.1）；组织措施见6.1。"},{"id":"K001","type":"single","ch":"6","sec":"6.1","stem":"下列不属于保证安全的组织措施的是（　）。","options":["工作票制度","现场勘察制度","工作许可制度","验电制度"],"answer":["D"],"exp":"6.1 组织措施为现场勘察、工作票、工作许可、工作监护、工作间断转移和终结制度；验电属于技术措施（7.1）。"},{"id":"K002","type":"single","ch":"6","sec":"6.1","stem":"保证安全的组织措施中，排在第一项的是（　）。","options":["现场勘察制度","工作票制度","工作监护制度","工作许可制度"],"answer":["A"],"exp":"6.1 a）现场勘察制度；b）工作票制度；c）工作许可制度；d）工作监护制度；e）工作间断、转移和终结制度。"},{"id":"K003","type":"judge","ch":"6","sec":"6.1","stem":"工作间断、转移和终结制度属于保证安全的组织措施。","options":["正确","错误"],"answer":["A"],"exp":"6.1 e）工作间断、转移和终结制度。"},{"id":"E004","type":"single","ch":"6","sec":"6.2","stem":"变电检修（施工）作业，现场勘察由（　）组织。","options":["工作票签发人或工作负责人","设备运维管理单位","工作许可人","专责监护人"],"answer":["A"],"exp":"6.2 现场勘察由工作票签发人或工作负责人组织。"},{"id":"E005","type":"single","ch":"6","sec":"6.2","stem":"工作票签发人或工作负责人认为有必要现场勘察的，（　）应根据工作任务组织现场勘察，并填写现场勘察记录。","options":["设备运维管理单位","调度控制中心","检修（施工）单位","安监部门"],"answer":["C"],"exp":"6.2 检修（施工）单位应根据工作任务组织现场勘察，并填写现场勘察记录。"},{"id":"K004","type":"judge","ch":"6","sec":"6.2","stem":"所有变电检修作业都必须进行现场勘察。","options":["正确","错误"],"answer":["B"],"exp":"6.2 工作票签发人或工作负责人认为有必要现场勘察的，才组织现场勘察。"},{"id":"K005","type":"judge","ch":"6","sec":"6.2","stem":"现场勘察后应填写现场勘察记录。","options":["正确","错误"],"answer":["A"],"exp":"6.2 检修（施工）单位应根据工作任务组织现场勘察，并填写现场勘察记录。"},{"id":"E006","type":"single","ch":"6","sec":"6.3.1","stem":"在电气设备上的工作，应填用工作票或事故紧急抢修单，其方式有（　）种。","options":["7","4","6","5"],"answer":["C"],"exp":"6.3.1 共6种：变电站（发电厂）第一种工作票、电力电缆第一种工作票、变电站（发电厂）第二种工作票、电力电缆第二种工作票、变电站（发电厂）带电作业工作票、变电站（发电厂）事故紧急抢修单。"},{"id":"E007","type":"multi","ch":"6","sec":"6.3.1","stem":"在电气设备上的工作，应填用的工作票（单）方式包括（　）。","options":["变电站（发电厂）第一种工作票、电力电缆第一种工作票","变电站（发电厂）带电作业工作票","变电站（发电厂）第二种工作票、电力电缆第二种工作票","变电站（发电厂）事故紧急抢修单"],"answer":["A","B","C","D"],"exp":"6.3.1 列举了6种工作票（单）方式。"},{"id":"K016","type":"single","ch":"6","sec":"6.3.1","stem":"变电站（发电厂）事故紧急抢修单的格式见本规程（　）。","options":["附录B","附录F","附录D","附录G"],"answer":["D"],"exp":"6.3.1 f）填用变电站（发电厂）事故紧急抢修单（见附录G）。附录B为第一种工作票，附录D为第二种工作票，附录F为带电作业工作票。"},{"id":"K017","type":"single","ch":"6","sec":"6.3.1","stem":"变电站（发电厂）第一种工作票的格式见本规程（　）。","options":["附录A","附录C","附录D","附录B"],"answe
