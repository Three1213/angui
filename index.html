options":["仅第一种工作票","工作票，或事故紧急抢修单","仅事故紧急抢修单","不需要任何票据"],"answer":["B"],"exp":"6.3.5 事故紧急抢修应填用工作票，或事故紧急抢修单。"},{"id":"E017","type":"single","ch":"6","sec":"6.3.5","stem":"非连续进行的事故修复工作，应使用（　）。","options":["口头命令","事故紧急抢修单","操作票","工作票"],"answer":["D"],"exp":"6.3.5 非连续进行的事故修复工作，应使用工作票。"},{"id":"E018","type":"judge","ch":"6","sec":"6.3.5","stem":"非连续进行的事故修复工作可以使用事故紧急抢修单。","options":["正确","错误"],"answer":["B"],"exp":"6.3.5 非连续进行的事故修复工作，应使用工作票。"},{"id":"K015","type":"judge","ch":"6","sec":"6.3.5","stem":"事故紧急抢修只能使用事故紧急抢修单，不能使用工作票。","options":["正确","错误"],"answer":["B"],"exp":"6.3.5 事故紧急抢修应填用工作票，或事故紧急抢修单。"},{"id":"E019","type":"single","ch":"6","sec":"6.3.6","stem":"运维人员实施不需高压设备停电或做安全措施的变电运维一体化业务项目时，（　）。","options":["可不作任何记录","可不使用工作票，但应以书面形式记录相应的操作和工作等内容","应填用第二种工作票","应填用第一种工作票"],"answer":["B"],"exp":"6.3.6 可不使用工作票，但应以书面形式记录相应的操作和工作等内容。"},{"id":"E020","type":"judge","ch":"6","sec":"6.3.6","stem":"各单位应明确发布所实施的变电运维一体化业务项目及所采取的书面记录形式。","options":["正确","错误"],"answer":["A"],"exp":"6.3.6 各单位应明确发布所实施的变电运维一体化业务项目及所采取的书面记录形式。"},{"id":"K018","type":"single","ch":"6","sec":"6.3.6","stem":"运维人员实施不需高压设备停电或做安全措施的变电运维一体化业务项目时，可不使用工作票，但应（　）。","options":["以书面形式记录相应的操作和工作等内容","经调控人员口头许可","事后补办工作票","由专责监护人监护"],"answer":["A"],"exp":"6.3.6 可不使用工作票，但应以书面形式记录相应的操作和工作等内容。"},{"id":"E021","type":"multi","ch":"6","sec":"6.3.7.1","stem":"关于工作票的填写与签发，下列说法正确的是（　）。","options":["应使用黑色或蓝色的钢（水）笔或圆珠笔填写与签发","内容应正确，填写应清楚，不得任意涂改","一式两份","如有个别错、漏字需要修改，应使用规范的符号，字迹应清楚"],"answer":["A","B","C","D"],"exp":"6.3.7.1 对工作票填写工具、份数、内容、修改方式均有规定。"},{"id":"E022","type":"single","ch":"6","sec":"6.3.7.1","stem":"工作票应一式（　）份。","options":["两","三","四","一"],"answer":["A"],"exp":"6.3.7.1 工作票一式两份。"},{"id":"K019","type":"judge","ch":"6","sec":"6.3.7.1","stem":"工作票可以使用铅笔填写，便于修改。","options":["正确","错误"],"answer":["B"],"exp":"6.3.7.1 工作票应使用黑色或蓝色的钢（水）笔或圆珠笔填写与签发。"},{"id":"E023","type":"single","ch":"6","sec":"6.3.7.2","stem":"用计算机生成或打印的工作票应使用统一的票面格式，由（　）审核无误，手工或电子签名后方可执行。","options":["工作负责人","运维负责人","工作许可人","工作票签发人"],"answer":["D"],"exp":"6.3.7.2 由工作票签发人审核无误，手工或电子签名后方可执行。"},{"id":"E024","type":"multi","ch":"6","sec":"6.3.7.2","stem":"关于工作票两份的保存，下列说法正确的是（　）。","options":["一份应保存在工作地点，由工作负责人收执","两份均由工作票签发人保存","工作许可人应将工作票的编号、工作任务、许可及终结时间记入登记簿","另一份由工作许可人收执，按值移交"],"answer":["A","C","D"],"exp":"6.3.7.2 工作票一份由工作负责人收执保存在工作地点，另一份由工作许可人收执按值移交，并记入登记簿。"},{"id":"K020","type":"judge","ch":"6","sec":"6.3.7.2","stem":"用计算机生成的工作票，经工作票签发人审核无误并手工或电子签名后方可执行。","options":["正确","错误"],"answer":["A"],"exp":"6.3.7.2 由工作票签发人审核无误，手工或电子签名后方可执行。"},{"id":"K021","type":"single","ch":"6","sec":"6.3.7.2","stem":"工作票的一份应保存在工作地点，由（　）收执。","options":["工作负责人","工作票签发人","工作许可人","专责监护人"],"answer":["A"],"exp":"6.3.7.2 工作票一份应保存在工作地点，由工作负责人收执；另一份由工作许可人收执，按值移交。"},{"id":"K022","type":"single","ch":"6","sec":"6.3.7.2","stem":"由工作许可人收执的一份工作票，应（　）。","options":["按值移交","交回工作票签发人","在工作结束后销毁","存档备查"],"answer":["A"],"exp":"6.3.7.2 另一份由工作许可人收执，按值移交。"},{"id":"E025","type":"single","ch":"6","sec":"6.3.7.3","stem":"一张工作票中，（　）不得互相兼任。","options":["工作票签发人与工作负责人","工作票签发人与工作许可人","专责监护人与工作班成员","工作许可人与工作负责人"],"answer":["D"],"exp":"6.3.7.3 一张工作票中，工作许可人与工作负责人不得互相兼任。"},{"id":"E026","type":"judge","ch":"6","sec":"6.3.7.3","stem":"工作票签发人可以兼任工作许可人或工作负责人，但应具备相应的资质，并履行相应的安全责任。","options":["正确","错误"],"answer":["A"],"exp":"6.3.7.3 若工作票签发人兼任工作许可人或工作负责人，应具备相应的资质，并履行相应的安全责任。"},{"id":"K023","type":"single","ch":"6","sec":"6.3.7.3","stem":"某张工作票中，张三既是工作许可人又是工作负责人，这种做法（　）。","options":["不允许","允许","在小型工作中允许","经批准允许"],"answer":["A"],"exp":"6.3.7.3 一张工作票中，工作许可人与工作负责人不得互相兼任。"},{"id":"E027","type":"multi","ch":"6","sec":"6.3.7.4","stem":"工作票可由（　）填写。","options":["专责监护人","工作票签发人","工作负责人","工作许可人"],"answer":["B","C"],"exp":"6.3.7.4 工作票由工作负责人填写，也可以由工作票签发人填写。"},{"id":"K024","type":"judge","ch":"6","sec":"6.3.7.4","stem":"工作票只能由工作负责人填写。","options":["正确","错误"],"answer":["B"],"exp":"6.3.7.4 工作票由工作负责人填写，也可以由工作票签发人填写。"},{"id":"E028","type":"multi","ch":"6","sec":"6.3.7.5","stem":"工作票可由（　）签发。","options":["经设备运维管理单位审核合格且经批准的检修及基建单位","工作负责人所在班组","调度控制中心","设备运维管理单位"],"answer":["A","D"],"exp":"6.3.7.5 工作票由设备运维管理单位签发，也可由经设备运维管理单位审核合格且经批准的检修及基建单位签发。检修及基建单位的工作票签发人名单应事先送有关设备运维管理单位、调度控制中心备案。"},{"id":"E029","type":"judge","ch":"6","sec":"6.3.7.5","stem":"检修及基建单位的工作票签发人名单应事先送有关设备运维管理单位、调度控制中心备案。","options":["正确","错误"],"answer":["A"],"exp":"6.3.7.5 该名单应事先送有关设备运维管理单位、调度控制中心备案。"},{"id":"K025","type":"judge","ch":"6","sec":"6.3.7.5","stem":"检修及基建单位不得签发工作票。","options":["正确","错误"],"answer":["B"],"exp":"6.3.7.5 也可由经设备运维管理单位审核合格且经批准的检修及基建单位签发。"},{"id":"E030","type":"single","ch":"6","sec":"6.3.7.6","stem":"承发包工程中，工作票可实行（　）形式。","options":["\"双签发\"","\"双监护\"","\"双许可\"","\"双终结\""],"answer":["A"],"exp":"6.3.7.6 承发包工程中，工作票可实行\"双签发\"形式。"},{"id":"E031","type":"single","ch":"6","sec":"6.3.7.6","stem":"实行\"双签发\"时，双方工作票签发人在工作票上分别签名，（　）。","options":["由发包方承担全部安全责任","安全责任由工作负责人承担","由承包方承担全部安全责任","各自承担部分工作票签发人相应的安全责任"],"answer":["D"],"exp":"6.3.7.6 签发工作票时，双方工作票签发人在工作票上分别签名，各自承担部分工作票签发人相应的安全责任。"},{"id":"K026","type":"judge","ch":"6","sec":"6.3.7.6","stem":"承发包工程实行\"双签发\"时，由发包方工作票签发人承担全部安全责任。","options":["正确","错误"],"answer":["B"],"exp":"6.3.7.6 双方工作票签发人在工作票上分别签名，各自承担部分工作票签发人相应的安全责任。"},{"id":"E032","type":"single","ch":"6","sec":"6.3.7.7","stem":"第一种工作票所列工作地点超过两个，或有两个及以上不同的工作单位（班组）在一起工作时，可采用（　）。","options":["带电作业工作票","总工作票和分工作票","一张第二种工作票","多张第一种工作票"],"answer":["B"],"exp":"6.3.7.7 可采用总工作票和分工作票。总、分工作票应由同一个工作票签发人签发。"},{"id":"E033","type":"multi","ch":"6","sec":"6.3.7.7","stem":"关于总工作票和分工作票，下列说法正确的是（　）。","options":["总、分工作票应由同一个工作票签发人签发","分工作票应一式两份","总、分工作票在格式上与第一种工作票一致","总工作票上所列的安全措施应包括所有分工作票上所列的安全措施"],"answer":["A","B","C","D"],"exp":"6.3.7.7 对总、分工作票的签发人、安全措施涵盖、格式一致、份数均有规定。"},{"id":"E034","type":"single","ch":"6","sec":"6.3.7.7","stem":"分工作票的许可和终结，由（　）办理。","options":["分工作票负责人与总工作票负责人","工作票签发人与工作许可人","总工作票负责人与工作许可人","分工作票负责人与工作许可人"],"answer":["D"],"exp":"6.3.7.7 分工作票的许可和终结，由分工作票负责人与工作许可人办理。"},{"id":"E035","type":"multi","ch":"6","sec":"6.3.7.7","stem":"关于总、分工作票的许可与终结时序，下列正确的是（　）。","options":["分工作票应在总工作票许可后才可许可","总工作票应在所有分工作票终结后才可终结","分工作票可先于总工作票许可","总工作票可先于分工作票终结"],"answer":["A","B"],"exp":"6.3.7.7 分工作票应在总工作票许可后才可许可；总工作票应在所有分工作票终结后才可终结。"},{"id":"E036","type":"judge","ch":"6","sec":"6.3.7.7","stem":"几个班组同时进行工作时，总工作票的工作班成员栏内，应填写各分工作票的负责人，不必填写全部工作班人员姓名。","options":["正确","错误"],"answer":["A"],"exp":"6.3.7.7 几个班组同时进行工作时，总工作票的工作班成员栏内，只填写各分工作票的负责人，不必填写全部工作班人员姓名。分工作票上要填写工作班人员姓名。"},{"id":"K027","type":"single","ch":"6","sec":"6.3.7.7","stem":"总、分工作票应由（　）签发。","options":["工作许可人","同一个工作票签发人","各自的工作票签发人","总工作票负责人"],"answer":["B"],"exp":"6.3.7.7 总、分工作票应由同一个工作票签发人签发。"},{"id":"K028","type":"single","ch":"6","sec":"6.3.7.7","stem":"分工作票应一式两份，由（　）分别收执。","options":["分工作票负责人和工作票签发人","分工作票负责人和工作许可人","总工作票负责人和分工作票负责人","工作票签发人和工作许可人"],"answer":["C"],"exp":"6.3.7.7 分工作票应一式两份，由总工作票负责人和分工作票负责人分别收执。"},{"id":"K029","type":"judge","ch":"6","sec":"6.3.7.7","stem":"分工作票上可以只填写分工作票负责人，不必填写工作班人员姓名。","options":["正确","错误"],"answer":["B"],"exp":"6.3.7.7 总工作票上只填写各分工作票负责人，分工作票上要填写工作班人员姓名。"},{"id":"K030","type":"single","ch":"6","sec":"6.3.7.7","stem":"采用总、分工作票的条件是第一种工作票所列工作地点（　），或有两个及以上不同的工作单位（班组）在一起工作。","options":["两个及以上","超过两个","超过三个","超过五个"],"answer":["B"],"exp":"6.3.7.7 第一种工作票所列工作地点超过两个，或有两个及以上不同的工作单位（班组）在一起工作时，可采用总工作票和分工作票。"},{"id":"K031","type":"judge","ch":"6","sec":"6.3.7.7","stem":"总、分工作票在格式上与第二种工作票一致。","options":["正确","错误"],"answer":["B"],"exp":"6.3.7.7 总、分工作票在格式上与第一种工作票一致。"},{"id":"E037","type":"single","ch":"6","sec":"6.3.7.8","stem":"供电单位或施工单位到用户变电站内施工时，工作票应由（　）签发。","options":["仅供电单位","有权签发工作票的用户单位、施工单位或供电单位","仅用户单位","调度控制中心"],"answer":["B"],"exp":"6.3.7.8 工作票应由有权签发工作票的用户单位、施工单位或供电单位签发。"},{"id":"K047","type":"single","ch":"6","sec":"6.3.8","stem":"下列关于工作票使用的说法，错误的是（　）。","options":["第一种工作票应在工作前一日送达运维人员","带电作业工作票应在工作前一日送达","工作负责人允许变更一次","工作票有破损不能继续使用时，应补填新的工作票"],"answer":["B"],"exp":"6.3.8.10 第二种工作票和带电作业工作票可在进行工作的当天预先交给工作许可人。"},{"id":"E038","type":"single","ch":"6","sec":"6.3.8.1","stem":"一个工作负责人（　）同时执行多张工作票，工作票上所列的工作地点，以一个电气连接部分为限。","options":["不能","可以","经批准可以","在同一变电站内可以"],"answer":["A"],"exp":"6.3.8.1 一个工作负责人不能同时执行多张工作票。"},{"id":"E039","type":"single","ch":"6","sec":"6.3.8.1","stem":"所谓一个电气连接部分是指电气装置中，可以用（　）同其他电气装置分开的部分。","options":["熔断器","断路器（开关）","隔离开关（刀闸）","接地刀闸"],"answer":["C"],"exp":"6.3.8.1 a）所谓一个电气连接部分是指：电气装置中，可以用隔离开关（刀闸）同其他电气装置分开的部分。"},{"id":"E040","type":"judge","ch":"6","sec":"6.3.8.1","stem":"直流双极停用，换流变压器及所有高压直流设备均可视为一个电气连接部分。","options":["正确","错误"],"answer":["A"],"exp":"6.3.8.1 b）直流双极停用，换流变压器及所有高压直流设备均可视为一个电气连接部分。"},{"id":"E041","type":"multi","ch":"6","sec":"6.3.8.1","stem":"直流单极运行时，停用极的（　）可视为一个电气连接部分。","options":["水冷系统","换流变压器","阀厅","直流场设备"],"answer":["A","B","C","D"],"exp":"6.3.8.1 c）直流单极运行，停用极的换流变压器、阀厅、直流场设备、水冷系统可视为一个电气连接部分。双极公共区域为运行设备。"},{"id":"E042","type":"judge","ch":"6","sec":"6.3.8.1","stem":"直流单极运行时，双极公共区域视为停电设备。","options":["正确","错误"],"answer":["B"],"exp":"6.3.8.1 c）双极公共区域为运行设备。"},{"id":"K032","type":"judge","ch":"6","sec":"6.3.8.1","stem":"一个工作负责人可以同时执行两张工作票。","options":["正确","错误"],"answer":["B"],"exp":"6.3.8.1 一个工作负责人不能同时执行多张工作票。"},{"id":"K033","type":"single","ch":"6","sec":"6.3.8.1","stem":"工作票上所列的工作地点，以（　）为限。","options":["一个电压等级","一个配电室","一个电气连接部分","一个间隔"],"answer":["C"],"exp":"6.3.8.1 工作票上所列的工作地点，以一个电气连接部分为限。"},{"id":"E043","type":"single","ch":"6","sec":"6.3.8.2","stem":"一张工作票上所列的检修设备应（　），开工前工作票内的全部安全措施应一次完成。","options":["按需停、送电","按顺序停、送电","分批停、送电","同时停、送电"],"answer":["D"],"exp":"6.3.8.2 一张工作票上所列的检修设备应同时停、送电，开工前工作票内的全部安全措施应一次完成。"},{"id":"E044","type":"single","ch":"6","sec":"6.3.8.2","stem":"若至预定时间，一部分工作尚未完成，需继续工作而不妨碍送电者，在送电前，应（　）。","options":["按照送电后现场设备带电情况，办理新的工作票，布置好安全措施后方可继续工作","经工作许可人同意后继续工作","办理工作票延期手续后继续工作","在原工作票上增填工作项目"],"answer":["A"],"exp":"6.3.8.2 应按照送电后现场设备带电情况，办理新的工作票，布置好安全措施后，方可继续工作。"},{"id":"K034","type":"judge","ch":"6","sec":"6.3.8.2","stem":"一张工作票上所列的检修设备，可以分批停电、分批送电。","options":["正确","错误"],"answer":["B"],"exp":"6.3.8.2 一张工作票上所列的检修设备应同时停、送电。"},{"id":"K035","type":"judge","ch":"6","sec":"6.3.8.2","stem":"开工前工作票内的全部安全措施应一次完成。","options":["正确","错误"],"answer":["A"],"exp":"6.3.8.2 开工前工作票内的全部安全措施应一次完成。"},{"id":"E045","type":"multi","ch":"6","sec":"6.3.8.3","stem":"若以下设备同时停、送电，可使用同一张工作票的是（　）。","options":["全站停电","属于同一电压等级、位于同一平面场所，工作中不会触及带电导体的几个电气连接部分","一台变压器停电检修，其断路器（开关）也配合检修","不同电压等级的相邻设备"],"answer":["A","B","C"],"exp":"6.3.8.3 规定了可使用同一张工作票的三种情形。"},{"id":"K036","type":"single","ch":"6","sec":"6.3.8.3","stem":"一台变压器停电检修，其断路器也配合检修，（　）。","options":["可使用同一张工作票","应分别填用工作票","应使用总、分工作票","应使用第二种工作票"],"answer":["A"],"exp":"6.3.8.3 b）一台变压器停电检修，其断路器（开关）也配合检修，可使用同一张工作票。"},{"id":"K037","type":"judge","ch":"6","sec":"6.3.8.3","stem":"全站停电时，可使用同一张工作票。","options":["正确","错误"],"answer":["A"],"exp":"6.3.8.3 c）全站停电，可使用同一张工作票。"},{"id":"K038","type":"single","ch":"6","sec":"6.3.8.3","stem":"几个电气连接部分同时停、送电，可使用同一张工作票的条件不包括（　）。","options":["位于同一平面场所","工作中不会触及带电导体","属于同一个检修班组","属于同一电压等级"],"answer":["C"],"exp":"6.3.8.3 a）属于同一电压等级、位于同一平面场所，工作中不会触及带电导体的几个电气连接部分。"},{"id":"E046","type":"single","ch":"6","sec":"6.3.8.4","stem":"同一变电站内在几个电气连接部分上依次进行不停电的同一类型的工作，可以使用（　）。","options":["一张第一种工作票","一张带电作业工作票","多张第二种工作票","一张第二种工作票"],"answer":["D"],"exp":"6.3.8.4 可以使用一张第二种工作票。"},{"id":"K039","type":"judge","ch":"6","sec":"6.3.8.4","stem":"同一变电站内在几个电气连接部分上依次进行不停电的同一类型的工作，可以使用一张第一种工作票。","options":["正确","错误"],"answer":["B"],"exp":"6.3.8.4 可以使用一张第二种工作票。"},{"id":"E047","type":"single","ch":"6","sec":"6.3.8.5","stem":"在同一变电站内，依次进行的同一类型的带电作业可以使用（　）。","options":["一张第二种工作票","一张第一种工作票","一张带电作业工作票","逐项分别开具工作票"],"answer":["C"],"exp":"6.3.8.5 在同一变电站内，依次进行的同一类型的带电作业可以使用一张带电作业工作票。"},{"id":"E048","type":"multi","ch":"6","sec":"6.3.8.6","stem":"持线路或电缆工作票进入变电站或发电厂升压站进行架空线路、电缆等工作，应（　）。","options":["上述单位的工作票签发人和工作负责人名单应事先送有关运维单位备案","留存","由变电站或发电厂工作许可人许可","增填工作票份数"],"answer":["A","B","C","D"],"exp":"6.3.8.6 应增填工作票份数，由变电站或发电厂工作许可人许可，并留存；名单应事先送有关运维单位备案。"},{"id":"K040","type":"single","ch":"6","sec":"6.3.8.6","stem":"持线路工作票进入变电站进行架空线路工作，应由（　）许可。","options":["值班调控人员","变电站工作许可人","线路工作许可人","线路工作票签发人"],"answer":["B"],"exp":"6.3.8.6 应增填工作票份数，由变电站或发电厂工作许可人许可，并留存。"},{"id":"F001","type":"single","ch":"6","sec":"6.3.8.7","stem":"需要变更工作班成员时，应经（　）同意，在对新的作业人员进行安全交底手续后，方可进行工作。","options":["工作票签发人","工作许可人","专责监护人","工作负责人"],"answer":["D"],"exp":"6.3.8.7 需要变更工作班成员时，应经工作负责人同意。"},{"id":"F002","type":"single","ch":"6","sec":"6.3.8.7","stem":"如确需变更工作负责人应由（　）同意并通知工作许可人。","options":["工作许可人","专责监护人","运维负责人","工作票签发人"],"answer":["D"],"exp":"6.3.8.7 如确需变更工作负责人应由工作票签发人同意并通知工作许可人，工作许可人将变动情况记录在工作票上。"},{"id":"F003","type":"single","ch":"6","sec":"6.3.8.7","stem":"工作负责人允许变更（　）。","options":["一次","两次","不限次数","三次"],"answer":["A"],"exp":"6.3.8.7 工作负责人允许变更一次。原、现工作负责人应对工作任务和安全措施进行交接。"},{"id":"F004","type":"judge","ch":"6","sec":"6.3.8.7","stem":"变更工作负责人后，原、现工作负责人应对工作任务和安全措施进行交接。","options":["正确","错误"],"answer":["A"],"exp":"6.3.8.7 原、现工作负责人应对工作任务和安全措施进行交接。"},{"id":"K041","type":"judge","ch":"6","sec":"6.3.8.7","stem":"变更工作班成员只需经工作负责人同意，无需进行安全交底。","options":["正确","错误"],"answer":["B"],"exp":"6.3.8.7 应经工作负责人同意，在对新的作业人员进行安全交底手续后，方可进行工作。"},{"id":"K042","type":"judge","ch":"6","sec":"6.3.8.7","stem":"工作负责人变更情况由工作许可人记录在工作票上。","options":["正确","错误"],"answer":["A"],"exp":"6.3.8.7 工作许可人将变动情况记录在工作票上。"},{"id":"K043","type":"single","ch":"6","sec":"6.3.8.7","stem":"某工作票已变更过一次工作负责人，现需再次变更，应（　）。","options":["经工作票签发人同意后可再次变更","不允许在原工作票上再次变更工作负责人","经运维负责人同意后可再次变更","经工作许可人同意后可再次变更"],"answer":["B"],"exp":"6.3.8.7 工作负责人允许变更一次。"},{"id":"F005","type":"single","ch":"6","sec":"6.3.8.8","stem":"在原工作票的停电及安全措施范围内增加工作任务时，应由工作负责人征得（　）同意，并在工作票上增填工作项目。","options":["工作票签发人和工作许可人","工作许可人","运维负责人","工作票签发人"],"answer":["A"],"exp":"6.3.8.8 应由工作负责人征得工作票签发人和工作许可人同意，并在工作票上增填工作项目。"},{"id":"F006","type":"single","ch":"6","sec":"6.3.8.8","stem":"若需变更或增设安全措施者，应（　）。","options":["在原工作票上增填","由工作负责人自行决定","填用新的工作票，并重新履行签发许可手续","经工作许可人同意后实施"],"answer":["C"],"exp":"6.3.8.8 若需变更或增设安全措施者应填用新的工作票，并重新履行签发许可手续。"},{"id":"K044","type":"judge","ch":"6","sec":"6.3.8.8","stem":"在原工作票的停电及安全措施范围内增加工作任务，需要变更安全措施时，可在原工作票上增填。","options":["正确","错误"],"answer":["B"],"exp":"6.3.8.8 若需变更或增设安全措施者应填用新的工作票，并重新履行签发许可手续。"},{"id":"F007","type":"judge","ch":"6","sec":"6.3.8.9","stem":"变更工作负责人或增加工作任务，如工作票签发人和工作许可人无法当面办理，应通过电话联系，并在工作票登记簿和工作票上注明。","options":["正确","错误"],"answer":["A"],"exp":"6.3.8.9 应通过电话联系，并在工作票登记簿和工作票上注明。"},{"id":"F008","type":"single","ch":"6","sec":"6.3.8.10","stem":"第一种工作票应在（　）送达运维人员。","options":["工作前一日","工作当日","工作前三日","工作开始前"],"answer":["A"],"exp":"6.3.8.10 第一种工作票应在工作前一日送达运维人员，可直接送达或通过传真、局域网传送。"},{"id":"F009","type":"judge","ch":"6","sec":"6.3.8.10","stem":"传真传送的第一种工作票可直接许可，不必等待正式工作票到达。","options":["正确","错误"],"answer":["B"],"exp":"6.3.8.10 传真传送的工作票许可应待正式工作票到达后履行。"},{"id":"F010","type":"single","ch":"6","sec":"6.3.8.10","stem":"第二种工作票和带电作业工作票可在（　）预先交给工作许可人。","options":["工作开始后","工作前一日","工作前三日","进行工作的当天"],"answer":["D"],"exp":"6.3.8.10 第二种工作票和带电作业工作票可在进行工作的当天预先交给工作许可人。"},{"id":"K045","type":"single","ch":"6","sec":"6.3.8.10","stem":"临时工作的第一种工作票，可（　）。","options":["在工作开始前直接交给工作许可人","不必交给工作许可人","在前一日交给调控人员","在工作开始后补交"],"answer":["A"],"exp":"6.3.8.10 临时工作可在工作开始前直接交给工作许可人。"},{"id":"K046","type":"multi","ch":"6","sec":"6.3.8.10","stem":"第一种工作票送达运维人员的方式包括（　）。","options":["电话口述","传真传送","直接送达","局域网传送"],"answer":["B","C","D"],"exp":"6.3.8.10 第一种工作票应在工作前一日送达运维人员，可直接送达或通过传真、局域网传送。"},{"id":"F011","type":"single","ch":"6","sec":"6.3.8.11","stem":"工作票有破损不能继续使用时，应（　）。","options":["由工作负责人重新誊抄","补填新的工作票，并重新履行签发许可手续","经工作许可人同意后继续使用","用透明胶带修补后继续使用"],"answer":["B"],"exp":"6.3.8.11 应补填新的工作票，并重新履行签发许可手续。"},{"id":"K048","type":"single","ch":"6","sec":"6.3.9","stem":"下列关于工作票有效期与延期的说法，正确的是（　）。","options":["带电作业工作票可延期一次","第一、二种工作票只能延期一次，带电作业工作票不准延期","三种工作票均可延期一次","第一种工作票可延期两次"],"answer":["B"],"exp":"6.3.9.2 第一、二种工作票只能延期一次。带电作业工作票不准延期。"},{"id":"F012","type":"single","ch":"6","sec":"6.3.9.1","stem":"第一、二种工作票和带电作业工作票的有效时间，以（　）为限。","options":["工作票签发日期起7天","批准的检修期","工作负责人确定的期限","调控人员许可的期限"],"answer":["B"],"exp":"6.3.9.1 第一、二种工作票和带电作业工作票的有效时间，以批准的检修期为限。"},{"id":"F013","type":"single","ch":"6","sec":"6.3.9.2","stem":"第一、二种工作票需办理延期手续，应在工期尚未结束以前由（　）向运维负责人提出申请。","options":["工作票签发人","专责监护人","工作许可人","工作负责人"],"answer":["D"],"exp":"6.3.9.2 应在工期尚未结束以前由工作负责人向运维负责人提出申请。"},{"id":"F014","type":"single","ch":"6","sec":"6.3.9.2","stem":"第一、二种工作票只能延期（　）。","options":["两次","一次","三次","不限次数"],"answer":["B"],"exp":"6.3.9.2 第一、二种工作票只能延期一次。"},{"id":"F015","type":"judge","ch":"6","sec":"6.3.9.2","stem":"带电作业工作票可以延期一次。","options":["正确","错误"],"answer":["B"],"exp":"6.3.9.2 带电作业工作票不准延期。"},{"id":"F016","type":"judge","ch":"6","sec":"6.3.9.2","stem":"属于调控中心管辖、许可的检修设备办理工作票延期，还应通过值班调控人员批准。","options":["正确","错误"],"answer":["A"],"exp":"6.3.9.2 属于调控中心管辖、许可的检修设备，还应通过值班调控人员批准，由运维负责人通知工作许可人给予办理。"},{"id":"K049","type":"single","ch":"6","sec":"6.3.9.2","stem":"工作票延期申请由运维负责人通知（　）给予办理。","options":["工作负责人","工作票签发人","值班调控人员","工作许可人"],"answer":["D"],"exp":"6.3.9.2 由运维负责人通知工作许可人给予办理。"},{"id":"K050","type":"judge","ch":"6","sec":"6.3.9.2","stem":"工作票延期手续应在工期结束后及时补办。","options":["正确","错误"],"answer":["B"],"exp":"6.3.9.2 应在工期尚未结束以前提出申请。"},{"id":"K051","type":"single","ch":"6","sec":"6.3.10","stem":"工作负责人应经（　）批准。","options":["本单位","安监部门","工区（车间）","设备运维管理单位"],"answer":["C"],"exp":"6.3.10.2 工作负责人（监护人）应是经工区（车间，下同）批准的人员。"},{"id":"K052","type":"single","ch":"6","sec":"6.3.10","stem":"下列人员中，名单应公布的是（　）。","options":["工作许可人","工作票签发人","专责监护人","工作负责人"],"answer":["B"],"exp":"6.3.10.1 工作票签发人员名单应公布。"},{"id":"F017","type":"multi","ch":"6","sec":"6.3.10.1","stem":"工作票签发人应是（　）。","options":["具有相关工作经验的生产领导人、技术人员或经本单位批准的人员","熟悉设备情况、熟悉本规程","熟悉人员技术水平","经工区批准的运维人员"],"answer":["A","B","C"],"exp":"6.3.10.1 工作票签发人应是熟悉人员技术水平、熟悉设备情况、熟悉本规程，并具有相关工作经验的生产领导人、技术人员或经本单位批准的人员。工作票签发人员名单应公布。"},{"id":"F018","type":"judge","ch":"6","sec":"6.3.10.1","stem":"工作票签发人员名单应公布。","options":["正确","错误"],"answer":["A"],"exp":"6.3.10.1 工作票签发人员名单应公布。"},{"id":"F019","type":"multi","ch":"6","sec":"6.3.10.2","stem":"工作负责人（监护人）应是（　）。","options":["熟悉工作班成员的工作能力","熟悉设备情况和本规程","具有相关工作经验","经工区（车间）批准的人员"],"answer":["A","B","C","D"],"exp":"6.3.10.2 工作负责人（监护人）应是具有相关工作经验，熟悉设备情况和本规程，经工区（车间，下同）批准的人员。工作负责人还应熟悉工作班成员的工作能力。"},{"id":"F020","type":"single","ch":"6","sec":"6.3.10.3","stem":"工作许可人应是经（　）批准的有一定工作经验的运维人员或检修操作人员。","options":["设备运维管理单位","本单位","工区","调度控制中心"],"answer":["C"],"exp":"6.3.10.3 工作许可人应是经工区批准的有一定工作经验的运维人员或检修操作人员（进行该工作任务操作及做安全措施的人员）。"},{"id":"F021","type":"single","ch":"6","sec":"6.3.10.3","stem":"用户变、配电站的工作许可人应是（　）。","options":["供电单位派出人员","用户单位负责人","持有效证书的高压电气工作人员","调控人员"],"answer":["C"],"exp":"6.3.10.3 用户变、配电站的工作许可人应是持有效证书的高压电气工作人员。"},{"id":"K053","type":"judge","ch":"6","sec":"6.3.10.3","stem":"检修操作人员（进行该工作任务操作及做安全措施的人员）经工区批准，可以担任工作许可人。","options":["正确","错误"],"answer":["A"],"exp":"6.3.10.3 工作许可人应是经工区批准的有一定工作经验的运维人员或检修操作人员（进行该工作任务操作及做安全措施的人员）。"},{"id":"F022","type":"single","ch":"6","sec":"6.3.10.4","stem":"专责监护人应是（　）的人员。","options":["具有相关工作经验，熟悉设备情况和本规程","具有高级工以上技能等级","本单位生产领导人","经工区批准的运维人员"],"answer":["A"],"exp":"6.3.10.4 专责监护人应是具有相关工作经验，熟悉设备情况和本规程的人员。"},{"id":"K054","type":"single","ch":"6","sec":"6.3.11","stem":"\"确认所派工作负责人和工作班人员是否适当和充足\"是（　）的安全责任。","options":["工作负责人","工作票签发人","专责监护人","工作许可人"],"answer":["B"],"exp":"6.3.11.1 c）工作票签发人的安全责任。"},{"id":"K055","type":"single","ch":"6","sec":"6.3.11","stem":"\"关注工作班成员身体状况和精神状态是否出现异常迹象\"是（　）的安全责任。","options":["工作票签发人","工作负责人（监护人）","工作班成员","工作许可人"],"answer":["B"],"exp":"6.3.11.2 f）工作负责人（监护人）的安全责任。"},{"id":"K056","type":"single","ch":"6","sec":"6.3.11","stem":"\"负责检查检修设备有无突然来电的危险\"是（　）的安全责任。","options":["专责监护人","工作票签发人","工作负责人","工作许可人"],"answer":["D"],"exp":"6.3.11.3 c）工作许可人的安全责任。"},{"id":"K057","type":"single","ch":"6","sec":"6.3.11","stem":"\"确认被监护人员和监护范围\"是（　）的安全责任。","options":["工作负责人","工作许可人","工作票签发人","专责监护人"],"answer":["D"],"exp":"6.3.11.4 a）专责监护人的安全责任。"},{"id":"K058","type":"single","ch":"6","sec":"6.3.11","stem":"\"确认工作必要性和安全性\"是（　）的安全责任。","options":["运维负责人","工作票签发人","工作负责人","工作许可人"],"answer":["B"],"exp":"6.3.11.1 a）工作票签发人的安全责任。"},{"id":"K059","type":"single","ch":"6","sec":"6.3.11","stem":"\"对工作票所列内容即使发生很小疑问，也应向工作票签发人询问清楚\"是（　）的安全责任。","options":["工作班成员","专责监护人","工作许可人","工作负责人"],"answer":["C"],"exp":"6.3.11.3 d）工作许可人的安全责任。"},{"id":"K060","type":"single","ch":"6","sec":"6.3.11","stem":"\"对自己在工作中的行为负责，互相关心工作安全\"是（　）的安全责任。","options":["工作许可人","工作负责人","工作班成员","专责监护人"],"answer":["C"],"exp":"6.3.11.5 b）工作班成员的安全责任。"},{"id":"K061","type":"single","ch":"6","sec":"6.3.11","stem":"\"工作前，对工作班成员进行工作任务、安全措施、技术措施交底和危险点告知，并确认每个工作班成员都已签名\"是（　）的安全责任。","options":["工作票签发人","工作负责人（监护人）","工作许可人","专责监护人"],"answer":["B"],"exp":"6.3.11.2 c）工作负责人（监护人）的安全责任。"},{"id":"F023","type":"multi","ch":"6","sec":"6.3.11.1","stem":"工作票签发人的安全责任包括（　）。","options":["确认工作票上所填安全措施是否正确完备","确认所派工作负责人和工作班人员是否适当和充足","确认工作必要性和安全性","负责检查检修设备有无突然来电的危险"],"answer":["A","B","C"],"exp":"6.3.11.1 工作票签发人的三项安全责任。选项D为工作许可人的责任（6.3.11.3 c）。"},{"id":"F024","type":"multi","ch":"6","sec":"6.3.11.2","stem":"工作负责人（监护人）的安全责任包括（　）。","options":["严格执行工作票所列安全措施","工作前，对工作班成员进行工作任务、安全措施、技术措施交底和危险点告知，并确认每个工作班成员都已签名","正确组织工作","检查工作票所列安全措施是否正确完备，是否符合现场实际条件，必要时予以补充完善"],"answer":["A","B","C","D"],"exp":"6.3.11.2 a）~f）规定了工作负责人的安全责任。"},{"id":"F025","type":"multi","ch":"6","sec":"6.3.11.2","stem":"工作负责人（监护人）还应（　）。","options":["监督工作班成员遵守本规程，正确使用劳动防护用品和安全工器具以及执行现场安全措施","关注人员变动是否合适","关注工作班成员身体状况和精神状态是否出现异常迹象","审查工作票所列安全措施是否符合现场条件"],"answer":["A","B","C"],"exp":"6.3.11.2 e）、f）。选项D为工作许可人的责任。"},{"id":"K062","type":"judge","ch":"6","sec":"6.3.11.2","stem":"工作负责人发现工作票所列安全措施不符合现场实际条件时，必要时应予以补充完善。","options":["正确","错误"],"answer":["A"],"exp":"6.3.11.2 b）检查工作票所列安全措施是否正确完备，是否符合现场实际条件，必要时予以补充完善。"},{"id":"F026","type":"multi","ch":"6","sec":"6.3.11.3","stem":"工作许可人的安全责任包括（　）。","options":["工作现场布置的安全措施是否完善，必要时予以补充","负责检查检修设备有无突然来电的危险","对工作票所列内容即使发生很小疑问，也应向工作票签发人询问清楚，必要时应要求作详细补充","负责审查工作票所列安全措施是否正确、完备，是否符合现场条件"],"answer":["A","B","C","D"],"exp":"6.3.11.3 a）~d）规定了工作许可人的四项安全责任。"},{"id":"F027","type":"multi","ch":"6","sec":"6.3.11.4","stem":"专责监护人的安全责任包括（　）。","options":["工作前，对被监护人员交待监护范围内的安全措施、告知危险点和安全注意事项","监督被监护人员遵守本规程和现场安全措施，及时纠正被监护人员的不安全行为","确认被监护人员和监护范围","正确组织工作"],"answer":["A","B","C"],"exp":"6.3.11.4 a）~c）。\"正确组织工作\"是工作负责人的责任。"},{"id":"F028","type":"multi","ch":"6","sec":"6.3.11.5","stem":"工作班成员的安全责任包括（　）。","options":["熟悉工作内容、工作流程，掌握安全措施，明确工作中的危险点，并在工作票上履行交底签名确认手续","服从工作负责人（监护人）、专责监护人的指挥，严格遵守本规程和劳动纪律","正确使用施工器具、安全工器具和劳动防护用品","在确定的作业范围内工作，对自己在工作中的行为负责，互相关心工作安全"],"answer":["A","B","C","D"],"exp":"6.3.11.5 a）~c）规定了工作班成员的安全责任。"},{"id":"K063","type":"judge","ch":"6","sec":"6.3.11.5","stem":"工作班成员应在工作票上履行交底签名确认手续。","options":["正确","错误"],"answer":["A"],"exp":"6.3.11.5 a）并在工作票上履行交底签名确认手续。"},{"id":"F029","type":"multi","ch":"6","sec":"6.4.1","stem":"工作许可人在完成施工现场的安全措施后，还应完成下列（　）手续，工作班方可开始工作。","options":["对工作负责人指明带电设备的位置和注意事项","向工作班成员交待工作内容和人员分工","会同工作负责人到现场再次检查所做的安全措施，对具体的设备指明实际的隔离措施，证明检修设备确无电压","和工作负责人在工作票上分别确认、签名"],"answer":["A","C","D"],"exp":"6.4.1.1~6.4.1.3 规定了工作许可的三项手续。选项D属工作监护制度中工作负责人的职责（6.5.1）。"},{"id":"M001","type":"single","ch":"6","sec":"6.4.1","stem":"工作许可时，工作许可人应会同（　）到现场再次检查所做的安全措施。","options":["运维负责人","工作票签发人","工作负责人","专责监护人"],"answer":["C"],"exp":"6.4.1.1 会同工作负责人到现场再次检查所做的安全措施，对具体的设备指明实际的隔离措施，证明检修设备确无电压。"},{"id":"M002","type":"judge","ch":"6","sec":"6.4.1","stem":"工作许可人完成施工现场的安全措施后，即可通知工作班开始工作。","options":["正确","错误"],"answer":["B"],"exp":"6.4.1 工作许可人在完成施工现场的安全措施后，还应完成现场检查、指明带电部位、双方签名等手续，工作班方可开始工作。"},{"id":"M003","type":"single","ch":"6","sec":"6.4.1.1","stem":"工作许可人会同工作负责人到现场检查安全措施时，应（　）。","options":["只需出示操作票","对具体的设备指明实际的隔离措施，证明检修设备确无电压","只需在工作票上签字","只需口头交待安全措施"],"answer":["B"],"exp":"6.4.1.1 对具体的设备指明实际的隔离措施，证明检修设备确无电压。"},{"id":"M004","type":"single","ch":"6","sec":"6.4.1.2","stem":"工作许可时，工作许可人应对工作负责人指明（　）。","options":["带电设备的位置和注意事项","工作班人员分工","工作结束时间","检修设备的缺陷情况"],"answer":["A"],"exp":"6.4.1.2 对工作负责人指明带电设备的位置和注意事项。"},{"id":"F030","type":"single","ch":"6","sec":"6.4.2","stem":"（　）不得变更有关检修设备的运行接线方式。","options":["工作票签发人","运维人员","工作负责人","检修人员"],"answer":["B"],"exp":"6.4.2 运维人员不得变更有关检修设备的运行接线方式。"},{"id":"F031","type":"single","ch":"6","sec":"6.4.2","stem":"工作负责人、工作许可人任何一方不得擅自变更安全措施，工作中如有特殊情况需要变更时，应（　）。","options":["先取得对方的同意并及时恢复，变更情况及时记录在值班日志内","由工作负责人决定","由工作许可人决定","报调控人员批准"],"answer":["A"],"exp":"6.4.2 应先取得对方的同意并及时恢复。变更情况及时记录在值班日志内。"},{"id":"M005","type":"judge","ch":"6","sec":"6.4.2","stem":"工作中如有特殊情况，工作负责人可以自行变更安全措施，事后告知工作许可人。","options":["正确","错误"],"answer":["B"],"exp":"6.4.2 工作负责人、工作许可人任何一方不得擅自变更安全措施，需要变更时应先取得对方的同意并及时恢复。"},{"id":"M006","type":"single","ch":"6","sec":"6.4.2","stem":"安全措施变更情况应及时记录在（　）内。","options":["操作票","值班日志","工作票登记簿","设备台账"],"answer":["B"],"exp":"6.4.2 变更情况及时记录在值班日志内。"},{"id":"F032","type":"multi","ch":"6","sec":"6.4.3","stem":"关于变电站（发电厂）第二种工作票采取电话许可方式，下列说法正确的是（　）。","options":["可采取电话许可方式，但应录音，并各自作好记录","工作结束后应汇报工作许可人","工作所需安全措施可由工作人员自行布置","第一种工作票也可采取电话许可方式"],"answer":["A","B","C"],"exp":"6.4.3 仅变电站（发电厂）第二种工作票可采取电话许可方式。"},{"id":"F033","type":"judge","ch":"6","sec":"6.4.3","stem":"变电站（发电厂）第一种工作票可采取电话许可方式，但应录音。","options":["正确","错误"],"answer":["B"],"exp":"6.4.3 仅第二种工作票可采取电话许可方式。"},{"id":"M007","type":"judge","ch":"6","sec":"6.4.3","stem":"采取电话许可的第二种工作票，工作所需安全措施可由工作人员自行布置。","options":["正确","错误"],"answer":["A"],"exp":"6.4.3 采取电话许可的工作票，工作所需安全措施可由工作人员自行布置，工作结束后应汇报工作许可人。"},{"id":"M008","type":"judge","ch":"6","sec":"6.4.3","stem":"采取电话许可方式时，可以不录音，但应作好记录。","options":["正确","错误"],"answer":["B"],"exp":"6.4.3 可采取电话许可方式，但应录音，并各自作好记录。"},{"id":"M018","type":"single","ch":"6","sec":"6.5","stem":"下列关于变更监护人员的说法，正确的是（　）。","options":["专责监护人长时间离开由工作负责人变更，工作负责人长时间离开由原工作票签发人变更","两者都由工作负责人变更","两者都由工作许可人变更","两者都由工作票签发人变更"],"answer":["A"],"exp":"6.5.3 专责监护人由工作负责人变更；6.5.4 工作负责人由原工作票签发人变更。"},{"id":"F034","type":"multi","ch":"6","sec":"6.5.1","stem":"工作许可手续完成后，工作负责人、专责监护人应向工作班成员交待（　），进行危险点告知，并履行确认手续，工作班方可开始工作。","options":["人员分工","工作内容","现场安全措施","带电部位"],"answer":["A","B","C","D"],"exp":"6.5.1 应交待工作内容、人员分工、带电部位和现场安全措施，进行危险点告知，并履行确认手续。"},{"id":"F035","type":"judge","ch":"6","sec":"6.5.1","stem":"工作负责人、专责监护人应始终在工作现场，对工作班人员的安全认真监护，及时纠正不安全的行为。","options":["正确","错误"],"answer":["A"],"exp":"6.5.1 工作负责人、专责监护人应始终在工作现场。"},{"id":"M009","type":"single","ch":"6","sec":"6.5.1","stem":"工作班方可开始工作的前提是：工作许可手续完成后，工作负责人、专责监护人向工作班成员交待有关内容，进行危险点告知，并（　）。","options":["报告调控人员","悬挂标示牌","履行确认手续","通知工作票签发人"],"answer":["C"],"exp":"6.5.1 进行危险点告知，并履行确认手续，工作班方可开始工作。"},{"id":"F036","type":"single","ch":"6","sec":"6.5.2","stem":"所有工作人员（包括工作负责人）不许单独进入、滞留在（　）。","options":["控制室内","工具间内","继电保护室内","高压室、阀厅内和室外高压设备区内"],"answer":["D"],"exp":"6.5.2 所有工作人员（包括工作负责人）不许单独进入、滞留在高压室、阀厅内和室外高压设备区内。"},{"id":"F037","type":"single","ch":"6","sec":"6.5.2","stem":"若工作需要（如测量极性、回路导通试验、光纤回路检查等），而且现场设备允许时，可以准许工作班中（　）同时在他室进行工作。","options":["专责监护人","任意一人","有实际经验的一个人或几人","两人以上"],"answer":["C"],"exp":"6.5.2 可以准许工作班中有实际经验的一个人或几人同时在他室进行工作，但工作负责人应在事前将有关安全注意事项予以详尽的告知。"},{"id":"M010","type":"judge","ch":"6","sec":"6.5.2","stem":"工作负责人可以单独进入高压室检查设备。","options":["正确","错误"],"answer":["B"],"exp":"6.5.2 所有工作人员（包括工作负责人）不许单独进入、滞留在高压室、阀厅内和室外高压设备区内。"},{"id":"M011","type":"judge","ch":"6","sec":"6.5.2","stem":"进行回路导通试验时，若现场设备允许，可以准许工作班中有实际经验的人员在他室进行工作，但工作负责人应事前告知有关安全注意事项。","options":["正确","错误"],"answer":["A"],"exp":"6.5.2 若工作需要（如测量极性、回路导通试验、光纤回路检查等），而且现场设备允许时，可以准许；但工作负责人应在事前将有关安全注意事项予以详尽的告知。"},{"id":"M012","type":"multi","ch":"6","sec":"6.5.2","stem":"下列（　）属于可以准许工作班中有实际经验的人员同时在他室进行工作的情形（现场设备允许时）。","options":["回路导通试验","光纤回路检查","更换高压设备","测量极性"],"answer":["A","B","D"],"exp":"6.5.2 如测量极性、回路导通试验、光纤回路检查等。"},{"id":"F038","type":"single","ch":"6","sec":"6.5.3","stem":"（　）应根据现场的安全条件、施工范围、工作需要等具体情况，增设专责监护人和确定被监护的人员。","options":["工作票签发人或工作负责人","调控人员","运维负责人","工作许可人"],"answer":["A"],"exp":"6.5.3 工作票签发人或工作负责人，应根据现场的安全条件、施工范围、工作需要等具体情况，增设专责监护人和确定被监护的人员。"},{"id":"F039","type":"judge","ch":"6","sec":"6.5.3","stem":"专责监护人不得兼做其他工作。","options":["正确","错误"],"answer":["A"],"exp":"6.5.3 专责监护人不得兼做其他工作。"},{"id":"F040","type":"single","ch":"6","sec":"6.5.3","stem":"专责监护人临时离开时，应（　）。","options":["告知工作负责人后即可离开","不必采取措施","通知被监护人员停止工作或离开工作现场，待专责监护人回来后方可恢复工作","指定他人临时代替"],"answer":["C"],"exp":"6.5.3 专责监护人临时离开时，应通知被监护人员停止工作或离开工作现场，待专责监护人回来后方可恢复工作。"},{"id":"F041","type":"single","ch":"6","sec":"6.5.3","stem":"若专责监护人必须长时间离开工作现场时，应由（　）变更专责监护人，履行变更手续，并告知全体被监护人员。","options":["工作许可人","工作票签发人","工作负责人","运维负责人"],"answer":["C"],"exp":"6.5.3 应由工作负责人变更专责监护人。注意与工作负责人长时间离开时由\"原工作票签发人\"变更（6.5.4）相区分。"},{"id":"M013","type":"single","ch":"6","sec":"6.5.3","stem":"专责监护人临时离开工作现场时，被监护人员应（　）。","options":["停止工作或离开工作现场","在工作负责人监护下继续工作","自行注意安全继续工作","由工作班中资历最深的人员监护"],"answer":["A"],"exp":"6.5.3 专责监护人临时离开时，应通知被监护人员停止工作或离开工作现场。"},{"id":"M014","type":"judge","ch":"6","sec":"6.5.3","stem":"专责监护人在监护的同时可以参与部分简单工作。","options":["正确","错误"],"answer":["B"],"exp":"6.5.3 专责监护人不得兼做其他工作。"},{"id":"M015","type":"single","ch":"6","sec":"6.5.3","stem":"专责监护人必须长时间离开工作现场时，变更后应告知（　）。","options":["全体被监护人员","工作许可人","工作票签发人","调控人员"],"answer":["A"],"exp":"6.5.3 应由工作负责人变更专责监护人，履行变更手续，并告知全体被监护人员。"},{"id":"F042","type":"single","ch":"6","sec":"6.5.4","stem":"工作期间，工作负责人若因故暂时离开工作现场时，应（　）。","options":["由专责监护人自动代行职责","停止全部工作","通知工作许可人后离开","指定能胜任的人员临时代替，离开前应将工作现场交待清楚，并告知工作班成员"],"answer":["D"],"exp":"6.5.4 应指定能胜任的人员临时代替，离开前应将工作现场交待清楚，并告知工作班成员。原工作负责人返回工作现场时，也应履行同样的交接手续。"},{"id":"F043","type":"single","ch":"6","sec":"6.5.4","stem":"若工作负责人必须长时间离开工作现场时，应由（　）变更工作负责人。","options":["原工作票签发人","专责监护人","运维负责人","工作许可人"],"answer":["A"],"exp":"6.5.4 应由原工作票签发人变更工作负责人，履行变更手续，并告知全体作业人员及工作许可人。"},{"id":"M016","type":"single","ch":"6","sec":"6.5.4","stem":"原工作负责人暂时离开后返回工作现场时，应（　）。","options":["重新办理工作票","向工作许可人报告","直接恢复负责","履行同样的交接手续"],"answer":["D"],"exp":"6.5.4 原工作负责人返回工作现场时，也应履行同样的交接手续。"},{"id":"M017","type":"single","ch":"6","sec":"6.5.4","stem":"工作负责人必须长时间离开工作现场，变更工作负责人后，应告知（　）。","options":["工作许可人","全体作业人员及工作许可人","调控人员","全体作业人员"],"answer":["B"],"exp":"6.5.4 应由原工作票签发人变更工作负责人，履行变更手续，并告知全体作业人员及工作许可人。"},{"id":"M019","type":"judge","ch":"6","sec":"6.5.4","stem":"工作负责人暂时离开工作现场时，可不指定代替人员，由工作班成员自行工作。","options":["正确","错误"],"answer":["B"],"exp":"6.5.4 应指定能胜任的人员临时代替。"},{"id":"M035","type":"single","ch":"6","sec":"6.6","stem":"下列关于工作间断、转移和终结的说法，错误的是（　）。","options":["只有同一停电系统的所有工作票都已终结并得到许可指令后，方可合闸送电","在未办理工作票终结手续以前，任何人员不准将停电设备合闸送电","已终结的工作票应保存3个月","工作间断时，工作班人员应从工作现场撤出"],"answer":["C"],"exp":"6.6.7 已终结的工作票、事故紧急抢修单应保存1年。"},{"id":"F044","type":"multi","ch":"6","sec":"6.6.1","stem":"关于工作间断，下列说法正确的是（　）。","options":["每日收工，应清扫工作地点，开放已封闭的通道，并电话告知工作许可人","工作间断时，工作班人员应从工作现场撤出","若工作间断后所有安全措施和接线方式保持不变，工作票可由工作负责人执存","次日复工时，工作负责人应电话告知工作许可人，并重新认真检查确认安全措施是否符合工作票要求"],"answer":["A","B","C","D"],"exp":"6.6.1 对工作间断的撤出、收工、工作票执存和复工均有规定。"},{"id":"F045","type":"judge","ch":"6","sec":"6.6.1","stem":"间断后继续工作，若无工作负责人或专责监护人带领，作业人员不得进入工作地点。","options":["正确","错误"],"answer":["A"],"exp":"6.6.1 间断后继续工作，若无工作负责人或专责监护人带领，作业人员不得进入工作地点。"},{"id":"M020","type":"judge","ch":"6","sec":"6.6.1","stem":"工作间断时，工作班人员可以留在工作现场休息。","options":["正确","错误"],"answer":["B"],"exp":"6.6.1 工作间断时，工作班人员应从工作现场撤出。"},{"id":"M021","type":"single","ch":"6","sec":"6.6.1","stem":"每日收工时，应清扫工作地点，开放已封闭的通道，并（　）告知工作许可人。","options":["书面","电话","短信","当面"],"answer":["B"],"exp":"6.6.1 每日收工，应清扫工作地点，开放已封闭的通道，并电话告知工作许可人。"},{"id":"M022","type":"single","ch":"6","sec":"6.6.1","stem":"若工作间断后所有安全措施和接线方式保持不变，工作票可由（　）执存。","options":["工作负责人","专责监护人","工作许可人","工作票签发人"],"answer":["A"],"exp":"6.6.1 工作票可由工作负责人执存。"},{"id":"M023","type":"judge","ch":"6","sec":"6.6.1","stem":"次日复工时，工作负责人电话告知工作许可人后即可开工，无需重新检查安全措施。","options":["正确","错误"],"answer":["B"],"exp":"6.6.1 次日复工时，工作负责人应电话告知工作许可人，并重新认真检查确认安全措施是否符合工作票要求。"},{"id":"F046","type":"single","ch":"6","sec":"6.6.2","stem":"在未办理工作票终结手续以前，（　）将停电设备合闸送电。","options":["经调控人员同意可以","任何人员不准","运维负责人可以","经工作负责人同意可以"],"answer":["B"],"exp":"6.6.2 在未办理工作票终结手续以前，任何人员不准将停电设备合闸送电。"},{"id":"F047","type":"single","ch":"6","sec":"6.6.2","stem":"在工作间断期间，若有紧急需要，运维人员可在工作票未交回的情况下合闸送电，但应先通知工作负责人，在得到（　）的答复后方可执行。","options":["工作票签发人同意送电","工作负责人同意送电","调控人员同意送电","工作班全体人员已经离开工作地点、可以送电"],"answer":["D"],"exp":"6.6.2 在得到工作班全体人员已经离开工作地点、可以送电的答复后方可执行。"},{"id":"F048","type":"multi","ch":"6","sec":"6.6.2","stem":"工作间断期间紧急合闸送电时，应采取下列（　）措施。","options":["拆除临时遮栏、接地线和标示牌，恢复常设遮栏，换挂\"止步，高压危险！\"的标示牌","应在所有道路派专人守候，以便告诉工作班人员\"设备已经合闸送电，不得继续工作\"","通知调度控制中心备案","守候人员在工作票未交回以前，不得离开守候地点"],"answer":["A","B","D"],"exp":"6.6.2 a）、b）规定了紧急合闸送电时应采取的措施。"},{"id":"M024","type":"judge","ch":"6","sec":"6.6.2","stem":"工作间断期间紧急送电，运维人员只要通知了工作负责人即可合闸送电。","options":["正确","错误"],"answer":["B"],"exp":"6.6.2 应先通知工作负责人，在得到工作班全体人员已经离开工作地点、可以送电的答复后方可执行，并采取规定措施。"},{"id":"M025","type":"single","ch":"6","sec":"6.6.2","stem":"工作间断期间紧急送电后，应换挂（　）的标示牌。","options":["\"止步，高压危险！\"","\"在此工作！\"","\"禁止合闸，有人工作！\"","\"从此进出！\""],"answer":["A"],"exp":"6.6.2 a）拆除临时遮栏、接地线和标示牌，恢复常设遮栏，换挂\"止步，高压危险！\"的标示牌。"},{"id":"M026","type":"single","ch":"6","sec":"6.6.2","stem":"工作间断期间紧急送电时，守候人员（　）。","options":["守候1小时后可离开","送电完成后即可离开","在工作票未交回以前，不得离开守候地点","待工作负责人到场后离开"],"answer":["C"],"exp":"6.6.2 b）守候人员在工作票未交回以前，不得离开守候地点。"},{"id":"F049","type":"multi","ch":"6","sec":"6.6.3","stem":"检修工作结束以前，若需将设备试加工作电压，应按下列（　）条件进行。","options":["全体作业人员撤离工作地点","应在工作负责人和运维人员进行全面检查无误后，由运维人员进行加压试验","将该系统的所有工作票收回，拆除临时遮栏、接地线和标示牌，恢复常设遮栏","经调控人员许可"],"answer":["A","B","C"],"exp":"6.6.3 a）~c）规定了试加工作电压的三个条件。工作班若需继续工作时，应重新履行工作许可手续。"},{"id":"F050","type":"judge","ch":"6","sec":"6.6.3","stem":"设备试加工作电压后，工作班若需继续工作时，应重新履行工作许可手续。","options":["正确","错误"],"answer":["A"],"exp":"6.6.3 工作班若需继续工作时，应重新履行工作许可手续。"},{"id":"M027","type":"judge","ch":"6","sec":"6.6.3","stem":"检修工作结束以前试加工作电压，由工作负责人进行加压试验。","options":["正确","错误"],"answer":["B"],"exp":"6.6.3 c）应在工作负责人和运维人员进行全面检查无误后，由运维人员进行加压试验。"},{"id":"M028","type":"judge","ch":"6","sec":"6.6.3","stem":"检修工作结束以前试加工作电压，只需收回本张工作票。","options":["正确","错误"],"answer":["B"],"exp":"6.6.3 b）将该系统的所有工作票收回。"},{"id":"F051","type":"single","ch":"6","sec":"6.6.4","stem":"在同一电气连接部分用同一张工作票依次在几个工作地点转移工作时，全部安全措施由运维人员在（　）做完，不需再办理转移手续。","options":["工作结束前","开工前一次","每日开工前","每次转移前"],"answer":["B"],"exp":"6.6.4 全部安全措施由运维人员在开工前一次做完，不需再办理转移手续。"},{"id":"F052","type":"multi","ch":"6","sec":"6.6.4","stem":"工作负责人在转移工作地点时，应向作业人员交待（　）。","options":["安全措施","带电范围","工作票编号","注意事项"],"answer":["A","B","D"],"exp":"6.6.4 工作负责人在转移工作地点时，应向作业人员交待带电范围、安全措施和注意事项。"},{"id":"M029","type":"judge","ch":"6","sec":"6.6.4","stem":"用同一张工作票在同一电气连接部分依次转移工作地点时，每次转移均需办理转移手续。","options":["正确","错误"],"answer":["B"],"exp":"6.6.4 全部安全措施由运维人员在开工前一次做完，不需再办理转移手续。"},{"id":"F053","type":"multi","ch":"6","sec":"6.6.5","stem":"全部工作完毕后，工作负责人应（　）。","options":["组织工作班清扫、整理现场","与运维人员共同检查设备状况、状态，有无遗留物件，是否清洁等","先周密地检查，待全体作业人员撤离工作地点后，再向运维人员交待所修项目、发现的问题、试验结果和存在问题等","在工作票上填明工作结束时间，经双方签名后表示工作终结"],"answer":["A","B","C","D"],"exp":"6.6.5 全部工作完毕后，工作班应清扫、整理现场，工作负责人按规定完成检查、交待、签名等程序。"},{"id":"F054","type":"multi","ch":"6","sec":"6.6.5","stem":"工作票方告终结，应满足（　）条件。","options":["工作票上的临时遮栏已拆除","标示牌已取下，已恢复常设遮栏","未拆除的接地线、未拉开的接地刀闸（装置）等设备运行方式已汇报调控人员","双方已在工作票上签名"],"answer":["A","B","C","D"],"exp":"6.6.5 待临时遮栏已拆除、标示牌已取下、已恢复常设遮栏、未拆除的接地线等设备运行方式已汇报调控人员，工作票方告终结。"},{"id":"M030","type":"single","ch":"6","sec":"6.6.5","stem":"全部工作完毕后，工作负责人向运维人员交待工作情况的时机是（　）。","options":["全体作业人员撤离工作地点后","工作票终结后","工作班清扫现场之前","最后一项工作完成的同时"],"answer":["A"],"exp":"6.6.5 工作负责人应先周密地检查，待全体作业人员撤离工作地点后，再向运维人员交待。"},{"id":"M031","type":"multi","ch":"6","sec":"6.6.5","stem":"工作结束时，工作负责人应向运维人员交待（　）。","options":["所修项目","存在问题","发现的问题","试验结果"],"answer":["A","B","C","D"],"exp":"6.6.5 向运维人员交待所修项目、发现的问题、试验结果和存在问题等。"},{"id":"M032","type":"single","ch":"6","sec":"6.6.5","stem":"工作终结的标志是（　）。","options":["设备恢复送电后","工作班撤离现场后","在工作票上填明工作结束时间，经双方签名后","工作负责人口头通知运维人员后"],"answer":["C"],"exp":"6.6.5 然后在工作票上填明工作结束时间。经双方签名后，表示工作终结。"},{"id":"M033","type":"judge","ch":"6","sec":"6.6.5","stem":"工作终结与工作票终结是同一回事。","options":["正确","错误"],"answer":["B"],"exp":"6.6.5 双方签名表示工作终结；待临时遮栏已拆除、标示牌已取下、已恢复常设遮栏、未拆除的接地线等已汇报调控人员后，工作票方告终结。"},{"id":"M034","type":"single","ch":"6","sec":"6.6.5","stem":"工作票终结前，未拆除的接地线、未拉开的接地刀闸（装置）等设备运行方式应（　）。","options":["汇报调控人员","告知工作票签发人","记入操作票","写入检修记录"],"answer":["A"],"exp":"6.6.5 未拆除的接地线、未拉开的接地刀闸（装置）等设备运行方式已汇报调控人员，工作票方告终结。"},{"id":"F055","type":"single","ch":"6","sec":"6.6.6","stem":"只有在同一停电系统的所有工作票都已终结，并得到（　）的许可指令后，方可合闸送电。","options":["工作票签发人","设备运维管理单位","值班调控人员或运维负责人","工作许可人"],"answer":["C"],"exp":"6.6.6 只有在同一停电系统的所有工作票都已终结，并得到值班调控人员或运维负责人的许可指令后，方可合闸送电。"},{"id":"F057","type":"judge","ch":"6","sec":"6.6.6","stem":"同一停电系统只要本张工作票已终结，即可合闸送电。","options":["正确","错误"],"answer":["B"],"exp":"6.6.6 须同一停电系统的所有工作票都已终结，并得到许可指令后，方可合闸送电。"},{"id":"F056","type":"single","ch":"6","sec":"6.6.7","stem":"已终结的工作票、事故紧急抢修单应保存（　）。","options":["1年","半年","2年","3年"],"answer":["A"],"exp":"6.6.7 已终结的工作票、事故紧急抢修单应保存1年。"},{"id":"M036","type":"judge","ch":"6","sec":"6.6.7","stem":"已终结的事故紧急抢修单可以不保存。","options":["正确","错误"],"answer":["B"],"exp":"6.6.7 已终结的工作票、事故紧急抢修单应保存1年。"},{"id":"G001","type":"multi","ch":"7","sec":"7.1","stem":"在电气设备上工作，保证安全的技术措施包括（　）。","options":["悬挂标示牌和装设遮栏（围栏）","接地","验电","停电"],"answer":["A","B","C","D"],"exp":"7.1 保证安全的技术措施为：a）停电；b）验电；c）接地；d）悬挂标示牌和装设遮栏（围栏）。共4项。"},{"id":"G002","type":"single","ch":"7","sec":"7.1","stem":"保证安全的技术措施共有（　）项。","options":["6","3","5","4"],"answer":["D"],"exp":"7.1 共4项：停电、验电、接地、悬挂标示牌和装设遮栏（围栏）。"},{"id":"G003","type":"single","ch":"7","sec":"7.1","stem":"保证安全的技术措施由（　）执行。","options":["工作班成员","工作负责人","运维人员或有权执行操作的人员","检修人员"],"answer":["C"],"exp":"7.1 上述措施由运维人员或有权执行操作的人员执行。"},{"id":"G004","type":"judge","ch":"7","sec":"7.1","stem":"保证安全的技术措施可由工作班成员自行执行。","options":["正确","错误"],"answer":["B"],"exp":"7.1 上述措施由运维人员或有权执行操作的人员执行。"},{"id":"N001","type":"single","ch":"7","sec":"7.1","stem":"下列不属于保证安全的技术措施的是（　）。","options":["验电","工作许可","接地","停电"],"answer":["B"],"exp":"7.1 技术措施为停电、验电、接地、悬挂标示牌和装设遮栏（围栏）；工作许可制度属于组织措施（6.1）。"},{"id":"N002","type":"single","ch":"7","sec":"7.1","stem":"保证安全的技术措施的正确顺序是（　）。","options":["停电→验电→接地→悬挂标示牌和装设遮栏","验电→停电→接地→悬挂标示牌","悬挂标示牌→停电→验电→接地","停电→接地→验电→悬挂标示牌"],"answer":["A"],"exp":"7.1 a）停电；b）验电；c）接地；d）悬挂标示牌和装设遮栏（围栏）。"},{"id":"G005","type":"multi","ch":"7","sec":"7.2.1","stem":"工作地点应停电的设备包括（　）。","options":["在35kV及以下的设备处工作，安全距离虽大于表3规定，但小于表1规定，同时又无绝缘隔板、安全遮栏措施的设备","检修的设备","与作业人员在进行工作中正常活动范围的距离小于表3规定的设备","带电部分在作业人员后面、两侧、上下，且无可靠安全措施的设备"],"answer":["A","B","C","D"],"exp":"7.2.1 a）~e）规定了工作地点应停电的设备，e）为\"其他需要停电的设备\"。"},{"id":"G018","type":"single","ch":"7","sec":"7.2.1","stem":"在35kV及以下的设备处工作，安全距离虽大于表3规定，但小于（　）规定，同时又无绝缘隔板、安全遮栏措施的设备应停电。","options":["表1","表4","表3的两倍","表2"],"answer":["A"],"exp":"7.2.1 c）在35kV及以下的设备处工作，安全距离虽大于表3规定，但小于表1规定，同时又无绝缘隔板、安全遮栏措施的设备。"},{"id":"N003","type":"single","ch":"7","sec":"7.2.1","stem":"在10kV设备处工作，作业人员正常活动范围与带电部分距离为0.5m，且无绝缘隔板、安全遮栏措施，该带电设备（　）。","options":["经许可后可不停电","应停电","装设接地线后可不停电","可不停电"],"answer":["B"],"exp":"7.2.1 c）35kV及以下设备处工作，安全距离大于表3（10kV为0.35m）但小于表1（0.70m），同时又无绝缘隔板、安全遮栏措施的设备应停电。"},{"id":"N004","type":"single","ch":"7","sec":"7.2.1","stem":"在110kV设备处工作，作业人员正常活动范围与带电部分距离为1.2m，该带电设备（　）。","options":["可不停电","应停电","装设临时遮栏后可不停电","经许可后可不停电"],"answer":["B"],"exp":"7.2.1 b）与作业人员在进行工作中正常活动范围的距离小于表3规定（110kV为1.50m）的设备应停电。"},{"id":"N005","type":"judge","ch":"7","sec":"7.2.1","stem":"带电部分在作业人员后面、两侧、上下，且无可靠安全措施的设备应停电。","options":["正确","错误"],"answer":["A"],"exp":"7.2.1 d）带电部分在作业人员后面、两侧、上下，且无可靠安全措施的设备。"},{"id":"G006","type":"single","ch":"7","sec":"表3","stem":"作业人员工作中正常活动范围与设备带电部分的安全距离，10kV及以下（13.8kV）为（　）。","options":["0.60m","0.95m","0.35m","0.70m"],"answer":["C"],"exp":"表3：10kV及以下（13.8kV）为0.35m。对比表1（不停电安全距离）为0.70m。"},{"id":"G007","type":"single","ch":"7","sec":"表3","stem":"作业人员工作中正常活动范围与设备带电部分的安全距离，20kV、35kV为（　）。","options":["1.15m","0.35m","1.00m","0.60m"],"answer":["D"],"exp":"表3：20kV、35kV为0.60m。"},{"id":"G008","type":"single","ch":"7","sec":"表3","stem":"作业人员工作中正常活动范围与设备带电部分的安全距离，66kV、110kV为（　）。","options":["1.65m","1.00m","3.00m","1.50m"],"answer":["D"],"exp":"表3：66kV、110kV为1.50m（与表1同值）。"},{"id":"G009","type":"single","ch":"7","sec":"表3","stem":"作业人员工作中正常活动范围与设备带电部分的安全距离，220kV为（　）。","options":["2.00m","2.55m","3.00m","4.00m"],"answer":["C"],"exp":"表3：220kV为3.00m。"},{"id":"G010","type":"single","ch":"7","sec":"表3","stem":"作业人员工作中正常活动范围与设备带电部分的安全距离，750kV为（　）。","options":["7.20m","9.50m","8.00m","6.70m"],"answer":["C"],"exp":"表3：750kV为8.00m（按海拔2000m校正）。对比表1为7.20m。"},{"id":"G011","type":"single","ch":"7","sec":"表3","stem":"作业人员工作中正常活动范围与设备带电部分的安全距离，1000kV为（　）。","options":["9.50m","8.25m","10.10m","8.70m"],"answer":["A"],"exp":"表3：1000kV为9.50m。"},{"id":"G012","type":"single","ch":"7","sec":"表3","stem":"作业人员工作中正常活动范围与设备带电部分的安全距离，±800kV为（　）。","options":["9.00m","9.30m","10.10m","9.50m"],"answer":["C"],"exp":"表3：±800kV为10.10m。"},{"id":"G013","type":"single","ch":"7","sec":"表3","stem":"作业人员工作中正常活动范围与设备带电部分的安全距离，±400kV为（　）。","options":["6.80m","5.90m","5.45m","6.70m"],"answer":["D"],"exp":"表3：±400kV为6.70m（按海拔3000m校正，海拔4000m时为6.80m）。"},{"id":"G014","type":"single","ch":"7","sec":"表3","stem":"作业人员工作中正常活动范围与设备带电部分的安全距离，±500kV为（　）。","options":["6.00m","5.60m","6.70m","6.80m"],"answer":["D"],"exp":"表3：±500kV为6.80m。"},{"id":"G015","type":"single","ch":"7","sec":"表3","stem":"作业人员工作中正常活动范围与设备带电部分的安全距离，±660kV为（　）。","options":["8.00m","10.10m","9.00m","8.40m"],"answer":["C"],"exp":"表3：±660kV为9.00m。"},{"id":"G016","type":"single","ch":"7","sec":"表3","stem":"作业人员工作中正常活动范围与设备带电部分的安全距离，330kV、500kV分别为（　）。","options":["3.00m、5.00m","4.00m、5.00m","3.25m、4.55m","4.00m、4.55m"],"answer":["B"],"exp":"表3：330kV为4.00m，500kV为5.00m（与表1同值）。"},{"id":"G017","type":"judge","ch":"7","sec":"表3","stem":"表3中未列电压等级按高一档电压等级确定安全距离。","options":["正确","错误"],"answer":["A"],"exp":"表3 注：表中未列电压等级按高一档电压等级确定安全距离。"},{"id":"N006","type":"single","ch":"7","sec":"表3","stem":"表3中±400kV数据按海拔3000m校正，海拔4000m时安全距离为（　）。","options":["5.90m","6.70m","6.80m","6.00m"],"answer":["C"],"exp":"表3 注a：±400kV数据是按海拔3000m校正的，海拔4000m时安全距离为6.80m。"},{"id":"N007","type":"single","ch":"7","sec":"表3","stem":"表3中未列出的15kV电压等级，作业人员正常活动范围与带电部分的安全距离应取（　）。","options":["0.60m","1.00m","0.50m","0.35m"],"answer":["A"],"exp":"表3 注：按高一档电压等级确定。15kV的高一档为20kV，取0.60m。"},{"id":"N008","type":"single","ch":"7","sec":"表3","stem":"10kV设备，表1（设备不停电）与表3（正常活动范围）的安全距离分别为（　）。","options":["0.70m、0.60m","0.70m、0.35m","1.00m、0.35m","0.35m、0.70m"],"answer":["B"],"exp":"表1 10kV及以下为0.70m；表3 10kV及以下为0.35m。"},{"id":"N009","type":"single","ch":"7","sec":"表3","stem":"35kV设备，表1、表2、表3的安全距离依次为（　）。","options":["1.00m、1.15m、0.35m","1.00m、1.15m、0.60m","1.00m、1.05m、0.60m","0.60m、1.15m、1.00m"],"answer":["B"],"exp":"表1 35kV为1.00m；表2 35kV为1.15m；表3 35kV为0.60m。"},{"id":"N010","type":"single","ch":"7","sec":"表3","stem":"750kV设备，表1与表3的安全距离分别为（　）。","options":["8.00m、7.20m","6.70m、8.00m","7.20m、6.70m","7.20m、8.00m"],"answer":["D"],"exp":"表1 750kV为7.20m；表3 750kV为8.00m。750kV表3大于表1。"},{"id":"N011","type":"judge","ch":"7","sec":"表3","stem":"表3中750kV数据是按海拔2000m校正的。","options":["正确","错误"],"answer":["A"],"exp":"表3 注b：750kV数据是按海拔2000m校正的，其他等级数据按海拔1000m校正。"},{"id":"N012","type":"judge","ch":"7","sec":"表3","stem":"表3中所有电压等级的安全距离都小于表1。","options":["正确","错误"],"answer":["B"],"exp":"66kV~500kV两表相同，±50kV及以下也相同（均1.50m）；750kV（8.00>7.20）、1000kV（9.50>8.70）及±400kV以上直流各档表3大于表1；只有10kV、20kV/35kV表3小于表1。"},{"id":"G019","type":"single","ch":"7","sec":"7.2.2","stem":"检修设备停电，应把各方面的电源完全断开，任何运行中的星形接线设备的中性点，应视为（　）。","options":["接地设备","带电设备","中性设备","绝缘设备"],"answer":["B"],"exp":"7.2.2 任何运行中的星形接线设备的中性点，应视为带电设备。"},{"id":"G020","type":"multi","ch":"7","sec":"7.2.2","stem":"关于检修设备停电，下列说法正确的是（　）。","options":["禁止在只经断路器（开关）断开电源的设备上工作","应使各方面有一个明显的断开点","应拉开隔离开关（刀闸），手车开关应拉至试验或检修位置","禁止在只经换流器闭锁隔离电源的设备上工作"],"answer":["A","B","C","D"],"exp":"7.2.2 对完全断开电源、禁止仅断开断路器或仅换流器闭锁、明显断开点均有规定。"},{"id":"G021","type":"single","ch":"7","sec":"7.2.2","stem":"若无法观察到停电设备的断开点，应（　）。","options":["拆除电气连接","有能够反映设备运行状态的电气和机械等指示","由两人确认","停止工作"],"answer":["B"],"exp":"7.2.2 若无法观察到停电设备的断开点，应有能够反映设备运行状态的电气和机械等指示。"},{"id":"G022","type":"single","ch":"7","sec":"7.2.2","stem":"与停电设备有关的变压器和电压互感器，应将设备（　），防止向停电检修设备反送电。","options":["各侧断开","二次侧断开","低压侧断开","高压侧断开"],"answer":["A"],"exp":"7.2.2 与停电设备有关的变压器和电压互感器，应将设备各侧断开，防止向停电检修设备反送电。"},{"id":"G076","type":"judge","ch":"7","sec":"7.2.2","stem":"检修设备停电时，只要断开断路器（开关）即可开始工作。","options":["正确","错误"],"answer":["B"],"exp":"7.2.2 禁止在只经断路器（开关）断开电源或只经换流器闭锁隔离电源的设备上工作。"},{"id":"N013","type":"judge","ch":"7","sec":"7.2.2","stem":"检修设备停电时，运行中的星形接线设备的中性点，可视为不带电。","options":["正确","错误"],"answer":["B"],"exp":"7.2.2 任何运行中的星形接线设备的中性点，应视为带电设备。"},{"id":"N014","type":"judge","ch":"7","sec":"7.2.2","stem":"禁止在只经换流器闭锁隔离电源的设备上工作。","options":["正确","错误"],"answer":["A"],"exp":"7.2.2 禁止在只经断路器（开关）断开电源或只经换流器闭锁隔离电源的设备上工作。"},{"id":"N015","type":"single","ch":"7","sec":"7.2.2","stem":"检修设备停电时，手车开关应拉至（　）。","options":["试验或检修位置","分闸位置即可","任意位置","工作位置"],"answer":["A"],"exp":"7.2.2 应拉开隔离开关（刀闸），手车开关应拉至试验或检修位置。"},{"id":"N016","type":"judge","ch":"7","sec":"7.2.2","stem":"与停电设备有关的电压互感器，只需断开高压侧，防止向停电检修设备反送电。","options":["正确","错误"],"answer":["B"],"exp":"7.2.2 与停电设备有关的变压器和电压互感器，应将设备各侧断开。"},{"id":"G023","type":"multi","ch":"7","sec":"7.2.3","stem":"检修设备和可能来电侧的断路器（开关）、隔离开关（刀闸）应（　），确保不会误送电。","options":["隔离开关（刀闸）操作把手应锁住","断开控制电源","悬挂标示牌","断开合闸能源"],"answer":["A","B","D"],"exp":"7.2.3 应断开控制电源和合闸能源，隔离开关（刀闸）操作把手应锁住，确保不会误送电。"},{"id":"N017","type":"judge","ch":"7","sec":"7.2.3","stem":"检修设备和可能来电侧的隔离开关（刀闸）操作把手应锁住，确保不会误送电。","options":["正确","错误"],"answer":["A"],"exp":"7.2.3 隔离开关（刀闸）操作把手应锁住，确保不会误送电。"},{"id":"G024","type":"single","ch":"7","sec":"7.2.4","stem":"对难以做到与电源完全断开的检修设备，可以（　）。","options":["采取加强监护措施","悬挂标示牌后工作","拆除设备与电源之间的电气连接","装设绝缘隔板"],"answer":["C"],"exp":"7.2.4 对难以做到与电源完全断开的检修设备，可以拆除设备与电源之间的电气连接。"},{"id":"N056","type":"single","ch":"7","sec":"7.3","stem":"下列关于验电的说法，错误的是（　）。","options":["高压验电应戴绝缘手套","验电前应先在有电设备上确认验电器良好","雨雪天气可以进行室外直接验电","330kV及以上的电气设备可采用间接验电方法"],"answer":["C"],"exp":"7.3.2 雨雪天气时不得进行室外直接验电。"},{"id":"G025","type":"single","ch":"7","sec":"7.3.1","stem":"验电时，应使用相应电压等级且合格的（　）验电器，在装设接地线或合接地刀闸（装置）处对各相分别验电。","options":["声光型","感应式","非接触式","接触式"],"answer":["D"],"exp":"7.3.1 应使用相应电压等级且合格的接触式验电器，在装设接地线或合接地刀闸（装置）处对各相分别验电。"},{"id":"G026","type":"single","ch":"7","sec":"7.3.1","stem":"验电前，应先（　），确认验电器良好。","options":["在有电设备上进行试验","查看外观","用万用表测量","在接地体上试验"],"answer":["A"],"exp":"7.3.1 验电前，应先在有电设备上进行试验，确认验电器良好；无法在有电设备上进行试验时，可用工频高压发生器等确认验电器良好。"},{"id":"G027","type":"judge","ch":"7","sec":"7.3.1","stem":"验电时可以只对一相进行验电，确认无电即可。","options":["正确","错误"],"answer":["B"],"exp":"7.3.1 应对各相分别验电。"},{"id":"N018","type":"single","ch":"7","sec":"7.3.1","stem":"无法在有电设备上试验验电器时，可用（　）等确认验电器良好。","options":["兆欧表","工频高压发生器","试电笔","万用表"],"answer":["B"],"exp":"7.3.1 无法在有电设备上进行试验时，可用工频高压发生器等确认验电器良好。"},{"id":"N019","type":"single","ch":"7","sec":"7.3.1","stem":"验电应在（　）处对各相分别进行。","options":["隔离开关操作机构","设备铭牌","断路器两侧","装设接地线或合接地刀闸（装置）"],"answer":["D"],"exp":"7.3.1 在装设接地线或合接地刀闸（装置）处对各相分别验电。"},{"id":"N020","type":"judge","ch":"7","sec":"7.3.1","stem":"验电时可以使用电压等级高于被验设备的验电器。","options":["正确","错误"],"answer":["B"],"exp":"7.3.1 验电时，应使用相应电压等级且合格的接触式验电器。"},{"id":"G028","type":"multi","ch":"7","sec":"7.3.2","stem":"关于高压验电，下列说法正确的是（　）。","options":["验电时手应握在手柄处不得超过护环","验电器的伸缩式绝缘棒长度应拉足","人体应与验电设备保持表1中规定的距离","应戴绝缘手套"],"answer":["A","B","C","D"],"exp":"7.3.2 对绝缘手套、绝缘棒拉足、手握位置、保持表1距离均有规定。"},{"id":"G029","type":"judge","ch":"7","sec":"7.3.2","stem":"雨雪天气时不得进行室外直接验电。","options":["正确","错误"],"answer":["A"],"exp":"7.3.2 雨雪天气时不得进行室外直接验电。"},{"id":"N021","type":"judge","ch":"7","sec":"7.3.2","stem":"高压验电时，手可以握在护环以上部位，以便更好地接触设备。","options":["正确","错误"],"answer":["B"],"exp":"7.3.2 验电时手应握在手柄处不得超过护环。"},{"id":"N022","type":"single","ch":"7","sec":"7.3.2","stem":"高压验电时，人体应与验电设备保持（　）中规定的距离。","options":["表3","表4","表2","表1"],"answer":["D"],"exp":"7.3.2 人体应与验电设备保持表1中规定的距离。"},{"id":"G030","type":"multi","ch":"7","sec":"7.3.3","stem":"下列（　）情况可以进行间接验电。","options":["高压直流输电设备","所有35kV及以上设备","无法进行直接验电的设备","雨雪天气时的户外设备"],"answer":["A","C","D"],"exp":"7.3.3 对无法进行直接验电的设备、高压直流输电设备和雨雪天气时的户外设备，可以进行间接验电。"},{"id":"G031","type":"single","ch":"7","sec":"7.3.3","stem":"间接验电判断时，至少应有（　）个非同样原理或非同源的指示发生对应变化，且所有这些确定的指示均已同时发生对应变化，才能确认该设备已无电。","options":["三","一","两","四"],"answer":["C"],"exp":"7.3.3 判断时，至少应有两个非同样原理或非同源的指示发生对应变化。"},{"id":"G032","type":"single","ch":"7","sec":"7.3.3","stem":"（　）及以上的电气设备，可采用间接验电方法进行验电。","options":["330kV","110kV","500kV","220kV"],"answer":["A"],"exp":"7.3.3 330kV及以上的电气设备，可采用间接验电方法进行验电。"},{"id":"G033","type":"judge","ch":"7","sec":"7.3.3","stem":"220kV的电气设备可采用间接验电方法进行验电。","options":["正确","错误"],"answer":["B"],"exp":"7.3.3 规定为330kV及以上。"},{"id":"N023","type":"judge","ch":"7","sec":"7.3.3","stem":"间接验电的检查项目应填写在操作票中作为检查项。","options":["正确","错误"],"answer":["A"],"exp":"7.3.3 以上检查项目应填写在操作票中作为检查项。"},{"id":"N024","type":"single","ch":"7","sec":"7.3.3","stem":"雨雪天气时的户外设备，验电应采用（　）。","options":["直接验电","间接验电","不验电","绝缘杆接触验电"],"answer":["B"],"exp":"7.3.2 雨雪天气时不得进行室外直接验电；7.3.3 雨雪天气时的户外设备可以进行间接验电。"},{"id":"N025","type":"single","ch":"7","sec":"7.3.3","stem":"下列设备中，按规程可采用间接验电方法的是（　）。","options":["10kV线路（晴天，可直接验电）","110kV户内设备（晴天，可直接验电）","500kV电气设备","35kV开关柜（可直接验电）"],"answer":["C"],"exp":"7.3.3 330kV及以上的电气设备，可采用间接验电方法进行验电。"},{"id":"G034","type":"single","ch":"7","sec":"7.3.4","stem":"表示设备断开和允许进入间隔的信号、经常接入的电压表等，如果指示有电，在排除异常情况前，（　）。","options":["应先装设接地线","可在加强监护下工作","禁止在设备上工作","可经工作许可人同意后工作"],"answer":["C"],"exp":"7.3.4 如果指示有电，在排除异常情况前，禁止在设备上工作。"},{"id":"N026","type":"judge","ch":"7","sec":"7.3.4","stem":"经常接入的电压表指示有电，但验电器验明无电，可以在设备上工作。","options":["正确","错误"],"answer":["B"],"exp":"7.3.4 表示设备断开和允许进入间隔的信号、经常接入的电压表等，如果指示有电，在排除异常情况前，禁止在设备上工作。"},{"id":"N055","type":"single","ch":"7","sec":"7.4","stem":"下列关于接地的说法，错误的是（　）。","options":["成套接地线应由有透明护套的多股软铜线和专用线夹组成","接地线截面积不得小于16mm²","禁止用缠绕的方法进行接地或短路","装设接地线应先接接地端，后接导体端"],"answer":["B"],"exp":"7.4.10 接地线截面积不得小于25mm²。"},{"id":"G035","type":"single","ch":"7","sec":"7.4.1","stem":"装设接地线应由（　）进行（经批准可以单人装设接地线的项目及运维人员除外）。","options":["工作负责人","三人","一人","两人"],"answer":["D"],"exp":"7.4.1 装设接地线应由两人进行（经批准可以单人装设接地线的项目及运维人员除外）。"},{"id":"G077","type":"judge","ch":"7","sec":"7.4.1","stem":"装设接地线必须由两人进行，无任何例外。","options":["正确","错误"],"answer":["B"],"exp":"7.4.1 装设接地线应由两人进行，但\"经批准可以单人装设接地线的项目及运维人员除外\"。"},{"id":"G036","type":"single","ch":"7","sec":"7.4.2","stem":"当验明设备确已无电压后，应（　）将检修设备接地并三相短路。","options":["在装设遮栏后","在工作开始前","经许可后","立即"],"answer":["D"],"exp":"7.4.2 当验明设备确已无电压后，应立即将检修设备接地并三相短路。"},{"id":"G037","type":"multi","ch":"7","sec":"7.4.2","stem":"关于电缆及电容器接地前的放电要求，下列正确的是（　）。","options":["电缆及电容器接地前应逐相充分放电","装在绝缘支架上的电容器外壳也应放电","串联电容器及与整组电容器脱离的电容器应逐个多次放电","星形接线电容器的中性点应接地"],"answer":["A","B","C","D"],"exp":"7.4.2 对电缆及电容器的放电、中性点接地、逐个多次放电、外壳放电均有规定。"},{"id":"N027","type":"single","ch":"7","sec":"7.4.2","stem":"验明设备确已无电压后，应立即将检修设备（　）。","options":["悬挂标示牌","接地并三相短路","通知工作负责人","装设遮栏"],"answer":["B"],"exp":"7.4.2 当验明设备确已无电压后，应立即将检修设备接地并三相短路。"},{"id":"N028","type":"judge","ch":"7","sec":"7.4.2","stem":"串联电容器接地前只需放电一次。","options":["正确","错误"],"answer":["B"],"exp":"7.4.2 串联电容器及与整组电容器脱离的电容器应逐个多次放电。"},{"id":"N029","type":"judge","ch":"7","sec":"7.4.2","stem":"星形接线电容器的中性点应接地。","options":["正确","错误"],"answer":["A"],"exp":"7.4.2 星形接线电容器的中性点应接地。"},{"id":"G038","type":"single","ch":"7","sec":"7.4.3","stem":"对于可能送电至停电设备的各方面都应装设接地线或合上接地刀闸（装置），所装接地线与带电部分应考虑（　）时仍符合安全距离的规定。","options":["风力影响","接地线摆动","温度变化","设备振动"],"answer":["B"],"exp":"7.4.3 所装接地线与带电部分应考虑接地线摆动时仍符合安全距离的规定。"},{"id":"N030","type":"single","ch":"7","sec":"7.4.3","stem":"对于可能送电至停电设备的（　），都应装设接地线或合上接地刀闸（装置）。","options":["电源侧","各方面","负荷侧","主电源侧"],"answer":["B"],"exp":"7.4.3 对于可能送电至停电设备的各方面都应装设接地线或合上接地刀闸（装置）。"},{"id":"G039","type":"single","ch":"7","sec":"7.4.4","stem":"对于因平行或邻近带电设备导致检修设备可能产生感应电压时，应加装工作接地线或使用个人保安线，个人保安线由（　）。","options":["工作负责人装设","工作许可人装设","运维人员装设","作业人员自装自拆"],"answer":["D"],"exp":"7.4.4 加装的接地线应登录在工作票上，个人保安线由作业人员自装自拆。"},{"id":"G040","type":"judge","ch":"7","sec":"7.4.4","stem":"因感应电压加装的接地线应登录在工作票上。","options":["正确","错误"],"answer":["A"],"exp":"7.4.4 加装的接地线应登录在工作票上。"},{"id":"N031","type":"judge","ch":"7","sec":"7.4.4","stem":"个人保安线应由运维人员装设和拆除。","options":["正确","错误"],"answer":["B"],"exp":"7.4.4 个人保安线由作业人员自装自拆。"},{"id":"N058","type":"multi","ch":"7","sec":"7.4.4","stem":"因平行或邻近带电设备导致检修设备可能产生感应电压时，应（　）。","options":["加装工作接地线","停用邻近带电设备","加装的接地线应登录在工作票上","使用个人保安线"],"answer":["A","C","D"],"exp":"7.4.4 应加装工作接地线或使用个人保安线，加装的接地线应登录在工作票上，个人保安线由作业人员自装自拆。"},{"id":"G041","type":"single","ch":"7","sec":"7.4.5","stem":"在门型构架的线路侧进行停电检修，如工作地点与所装接地线的距离小于（　），工作地点虽在接地线外侧，也可不另装接地线。","options":["20m","8m","10m","15m"],"answer":["C"],"exp":"7.4.5 如工作地点与所装接地线的距离小于10m，工作地点虽在接地线外侧，也可不另装接地线。"},{"id":"N032","type":"judge","ch":"7","sec":"7.4.5","stem":"在门型构架的线路侧停电检修，工作地点在接地线外侧且距离为12m，可不另装接地线。","options":["正确","错误"],"answer":["B"],"exp":"7.4.5 工作地点与所装接地线的距离小于10m时，才可不另装接地线。"},{"id":"G042","type":"single","ch":"7","sec":"7.4.6","stem":"检修部分若分为几个在电气上不相连接的部分，则各段应（　）。","options":["分别验电接地短路","仅两端接地","统一验电接地","由工作负责人确定接地方式"],"answer":["A"],"exp":"7.4.6 检修部分若分为几个在电气上不相连接的部分，则各段应分别验电接地短路。"},{"id":"G043","type":"single","ch":"7","sec":"7.4.6","stem":"降压变电站全部停电时，应将（　）的部分接地短路，其余部分不必每段都装设接地线或合上接地刀闸（装置）。","options":["主变各侧","各个可能来电侧","所有母线","出线侧"],"answer":["B"],"exp":"7.4.6 降压变电站全部停电时，应将各个可能来电侧的部分接地短路。"},{"id":"N033","type":"judge","ch":"7","sec":"7.4.6","stem":"降压变电站全部停电时，每段母线都必须装设接地线。","options":["正确","错误"],"answer":["B"],"exp":"7.4.6 降压变电站全部停电时，应将各个可能来电侧的部分接地短路，其余部分不必每段都装设接地线或合上接地刀闸（装置）。"},{"id":"G044","type":"single","ch":"7","sec":"7.4.7","stem":"接地线、接地刀闸与检修设备之间（　）连有断路器（开关）或熔断器。","options":["不得","在特殊情况下可以","经批准可以","可以"],"answer":["A"],"exp":"7.4.7 接地线、接地刀闸与检修设备之间不得连有断路器（开关）或熔断器。"},{"id":"G045","type":"single","ch":"7","sec":"7.4.7","stem":"若由于设备原因，接地刀闸与检修设备之间连有断路器（开关），在接地刀闸和断路器（开关）合上后，应（　）。","options":["有保证断路器（开关）不会分闸的措施","断开断路器控制电源即可","不作其他要求","悬挂\"禁止合闸\"标示牌"],"answer":["A"],"exp":"7.4.7 应有保证断路器（开关）不会分闸的措施。同时按7.5.1还应悬挂\"禁止分闸！\"的标示牌。"},{"id":"N034","type":"judge","ch":"7","sec":"7.4.7","stem":"接地线与检修设备之间可以连有熔断器。","options":["正确","错误"],"answer":["B"],"exp":"7.4.7 接地线、接地刀闸与检修设备之间不得连有断路器（开关）或熔断器。"},{"id":"G046","type":"multi","ch":"7","sec":"7.4.8","stem":"在配电装置上，关于接地线装设地点的要求，下列正确的是（　）。","options":["应去除这些地点的油漆或绝缘层，并划有黑色标记","接地线应采用三相短路式接地线；若使用分相式接地线时，应设置三相合一的接地端","接地线应装在该装置导电部分的规定地点","所有配电装置的适当地点，均应设有与接地网相连的接地端，接地电阻应合格"],"answer":["A","B","C","D"],"exp":"7.4.8 对接地线装设地点、黑色标记、接地端与接地电阻、三相短路式接地线均有规定。"},{"id":"N035","type":"single","ch":"7","sec":"7.4.8","stem":"配电装置上装设接地线的规定地点，应去除油漆或绝缘层，并划有（　）标记。","options":["黑色","红色","白色","黄绿相间"],"answer":["A"],"exp":"7.4.8 应去除这些地点的油漆或绝缘层，并划有黑色标记。"},{"id":"N036","type":"single","ch":"7","sec":"7.4.8","stem":"若使用分相式接地线时，应（　）。","options":["每相分别接至不同接地点","只接一相","增加截面积","设置三相合一的接地端"],"answer":["D"],"exp":"7.4.8 接地线应采用三相短路式接地线，若使用分相式接地线时，应设置三相合一的接地端。"},{"id":"G047","type":"single","ch":"7","sec":"7.4.9","stem":"装设接地线应（　）。","options":["先接导体端，后接接地端","先接接地端，后接导体端","两端同时接","视现场情况确定顺序"],"answer":["B"],"exp":"7.4.9 装设接地线应先接接地端，后接导体端，拆接地线的顺序与此相反。"},{"id":"G048","type":"single","ch":"7","sec":"7.4.9","stem":"拆接地线的顺序是（　）。","options":["两端同时拆","任意顺序","先拆导体端，后拆接地端","先拆接地端，后拆导体端"],"answer":["C"],"exp":"7.4.9 拆接地线的顺序与装设顺序相反，即先拆导体端，后拆接地端。"},{"id":"G049","type":"multi","ch":"7","sec":"7.4.9","stem":"关于装、拆接地线，下列说法正确的是（　）。","options":["接地线应接触良好，连接应可靠","带接地线拆设备接头时，应采取防止接地线脱落的措施","人体不得碰触接地线或未接地的导线，以防止触电","装、拆接地线导体端均应使用绝缘棒和戴绝缘手套"],"answer":["A","B","C","D"],"exp":"7.4.9 对绝缘棒和绝缘手套、人体不得碰触、接触良好、防止脱落均有规定。"},{"id":"N037","type":"judge","ch":"7","sec":"7.4.9","stem":"装设接地线时，应先接导体端，后接接地端。","options":["正确","错误"],"answer":["B"],"exp":"7.4.9 装设接地线应先接接地端，后接导体端；拆除顺序相反。"},{"id":"N038","type":"judge","ch":"7","sec":"7.4.9","stem":"装、拆接地线的接地端时，也必须使用绝缘棒。","options":["正确","错误"],"answer":["B"],"exp":"7.4.9 规定的是装、拆接地线导体端均应使用绝缘棒和戴绝缘手套。"},{"id":"G050","type":"single","ch":"7","sec":"7.4.10","stem":"成套接地线应由（　）和专用线夹组成。","options":["裸铜绞线","有透明护套的多股软铜线","钢绞线","绝缘导线"],"answer":["B"],"exp":"7.4.10 成套接地线应由有透明护套的多股软铜线和专用线夹组成。"},{"id":"G051","type":"single","ch":"7","sec":"7.4.10","stem":"接地线截面积不得小于（　），同时应满足装设地点短路电流的要求。","options":["50mm²","16mm²","25mm²","35mm²"],"answer":["C"],"exp":"7.4.10 接地线截面积不得小于25mm²，同时应满足装设地点短路电流的要求。"},{"id":"G052","type":"multi","ch":"7","sec":"7.4.10","stem":"关于接地线的使用，下列说法正确的是（　）。","options":["接地线截面积不得小于25mm²","接地线应使用专用的线夹固定在导体上","禁止用缠绕的方法进行接地或短路","禁止使用其他导线接地或短路"],"answer":["A","B","C","D"],"exp":"7.4.10 对禁止其他导线、专用线夹固定、禁止缠绕、截面积均有规定。"},{"id":"N039","type":"judge","ch":"7","sec":"7.4.10","stem":"接地线截面积满足25mm²即可，无需考虑装设地点短路电流。","options":["正确","错误"],"answer":["B"],"exp":"7.4.10 接地线截面积不得小于25mm²，同时应满足装设地点短路电流的要求。"},{"id":"N040","type":"judge","ch":"7","sec":"7.4.10","stem":"紧急情况下，可以用缠绕的方法进行接地或短路。","options":["正确","错误"],"answer":["B"],"exp":"7.4.10 禁止用缠绕的方法进行接地或短路。"},{"id":"G053","type":"single","ch":"7","sec":"7.4.11","stem":"禁止作业人员擅自移动或拆除接地线。高压回路上的工作，必须要拆除全部或一部分接地线后始能进行工作者，上述工作应（　），方可进行。","options":["征得工作负责人的许可","征得专责监护人的许可","征得工作票签发人的许可","征得运维人员的许可（根据调控人员指令装设的接地线，应征得调控人员的许可）"],"answer":["D"],"exp":"7.4.11 上述工作应征得运维人员的许可（根据调控人员指令装设的接地线，应征得调控人员的许可），方可进行。工作完毕后立即恢复。"},{"id":"G054","type":"multi","ch":"7","sec":"7.4.11","stem":"高压回路上必须拆除全部或一部分接地线后始能进行的工作包括（　）。","options":["测量母线和电缆的绝缘电阻","测量线路参数","检查断路器（开关）触头是否同时接触","更换设备绝缘子"],"answer":["A","B","C"],"exp":"7.4.11 举例为：测量母线和电缆的绝缘电阻，测量线路参数，检查断路器（开关）触头是否同时接触。"},{"id":"G055","type":"multi","ch":"7","sec":"7.4.11","stem":"需要部分或全部拆除接地线的情形包括（　）。","options":["将接地线全部拆除或拉开接地刀闸（装置）","拆除一相接地线","拆除全部短路线，保留接地线","拆除接地线，保留短路线"],"answer":["A","B","D"],"exp":"7.4.11 a）拆除一相接地线；b）拆除接地线，保留短路线；c）将接地线全部拆除或拉开接地刀闸（装置）。"},{"id":"N041","type":"single","ch":"7","sec":"7.4.11","stem":"根据调控人员指令装设的接地线，需要拆除时应征得（　）的许可。","options":["调控人员","工作票签发人","运维人员","工作负责人"],"answer":["A"],"exp":"7.4.11 上述工作应征得运维人员的许可（根据调控人员指令装设的接地线，应征得调控人员的许可）。"},{"id":"N042","type":"judge","ch":"7","sec":"7.4.11","stem":"为测量母线绝缘电阻而经许可拆除的接地线，工作完毕后应立即恢复。","options":["正确","错误"],"answer":["A"],"exp":"7.4.11 工作完毕后立即恢复。"},{"id":"G056","type":"multi","ch":"7","sec":"7.4.12","stem":"关于接地线的编号与记录，下列说法正确的是（　）。","options":["每组接地线及其存放位置均应编号","装、拆接地线应作好记录，交接班时应交待清楚","接地线可随意存放","接地线号码与存放位置号码应一致"],"answer":["A","B","D"],"exp":"7.4.12、7.4.13 对接地线编号、号码一致、装拆记录与交接班交待均有规定。"},{"id":"N043","type":"judge","ch":"7","sec":"7.4.12","stem":"接地线号码与存放位置号码应一致。","options":["正确","错误"],"answer":["A"],"exp":"7.4.12 每组接地线及其存放位置均应编号，接地线号码与存放位置号码应一致。"},{"id":"N044","type":"single","ch":"7","sec":"7.4.13","stem":"装、拆接地线，应作好记录，（　）时应交待清楚。","options":["交接班","工作结束","月底盘点","设备送电"],"answer":["A"],"exp":"7.4.13 装、拆接地线，应作好记录，交接班时应交待清楚。"},{"id":"N045","type":"single","ch":"7","sec":"7.5","stem":"主变压器检修，在其高压侧断路器的操作把手上应悬挂（　）。","options":["\"禁止合闸，有人工作！\"","\"止步，高压危险！\"","\"禁止合闸，线路有人工作！\"","\"在此工作！\""],"answer":["A"],"exp":"7.5.1 在一经合闸即可送电到工作地点的断路器（开关）和隔离开关（刀闸）的操作把手上，均应悬挂\"禁止合闸，有人工作！\"的标示牌。"},{"id":"N046","type":"single","ch":"7","sec":"7.5","stem":"室外高压设备检修，工作地点四周围栏的出入口应悬挂（　）。","options":["\"在此工作！\"","\"从此进出！\"","\"从此上下！\"","\"止步，高压危险！\""],"answer":["B"],"exp":"7.5.5 其出入口要围至临近道路旁边，并设有\"从此进出！\"的标示牌。"},{"id":"N057","type":"multi","ch":"7","sec":"7.5","stem":"下列标示牌中，属于禁止类的有（　）。","options":["\"从此上下！\"","\"禁止攀登，高压危险！\"","\"禁止合闸，有人工作！\"","\"禁止分闸！\""],"answer":["B","C","D"],"exp":"7.5.1、7.5.7 中以\"禁止\"开头的标示牌有\"禁止合闸，有人工作！\"\"禁止合闸，线路有人工作！\"\"禁止分闸！\"\"禁止攀登，高压危险！\"；\"从此上下！\"不属于禁止类。"},{"id":"G057","type":"single","ch":"7","sec":"7.5.1","stem":"在一经合闸即可送电到工作地点的断路器（开关）和隔离开关（刀闸）的操作把手上，均应悬挂（　）的标示牌。","options":["\"禁止合闸，线路有人工作！\"","\"止步，高压危险！\"","\"禁止分闸！\"","\"禁止合闸，有人工作！\""],"answer":["D"],"exp":"7.5.1 应悬挂\"禁止合闸，有人工作！\"的标示牌。"},{"id":"G058","type":"single","ch":"7","sec":"7.5.1","stem":"如果线路上有人工作，应在线路断路器（开关）和隔离开关（刀闸）操作把手上悬挂（　）的标示牌。","options":["\"禁止合闸，线路有人工作！\"","\"在此工作！\"","\"禁止分闸！\"","\"禁止合闸，有人工作！\""],"answer":["A"],"exp":"7.5.1 如果线路上有人工作，应悬挂\"禁止合闸，线路有人工作！\"的标示牌。"},{"id":"G059","type":"single","ch":"7","sec":"7.5.1","stem":"对由于设备原因，接地刀闸（装置）与检修设备之间连有断路器（开关），在接地刀闸（装置）和断路器（开关）合上后，在断路器（开关）操作把手上应悬挂（　）的标示牌。","options":["\"禁止分闸！\"","\"禁止合闸，有人工作！\"","\"止步，高压危险！\"","\"禁止攀登，高压危险！\""],"answer":["A"],"exp":"7.5.1 应悬挂\"禁止分闸！\"的标示牌。"},{"id":"G060","type":"judge","ch":"7","sec":"7.5.1","stem":"在显示屏上进行操作的断路器（开关）或隔离开关（刀闸）的操作处，也应设置相应的\"禁止合闸\"\"禁止分闸\"标记。","options":["正确","错误"],"answer":["A"],"exp":"7.5.1 在显示屏上进行操作的断路器（开关）或隔离开关（刀闸）的操作处应设置\"禁止合闸，有人工作！\"或\"禁止合闸，线路有人工作！\"以及\"禁止分闸！\"的标记。"},{"id":"G061","type":"single","ch":"7","sec":"7.5.2","stem":"部分停电的工作，安全距离小于（　）规定距离以内的未停电设备，应装设临时遮栏。","options":["表4","表3","表2","表1"],"answer":["D"],"exp":"7.5.2 部分停电的工作，安全距离小于表1规定距离以内的未停电设备，应装设临时遮栏。"},{"id":"G062","type":"single","ch":"7","sec":"7.5.2","stem":"临时遮栏与带电部分的距离不得小于（　）的规定数值。","options":["表2","表1","表3","表4"],"answer":["C"],"exp":"7.5.2 临时遮栏与带电部分的距离不得小于表3的规定数值。"},{"id":"G063","type":"multi","ch":"7","sec":"7.5.2","stem":"关于临时遮栏，下列说法正确的是（　）。","options":["应悬挂\"止步，高压危险！\"的标示牌","装设应牢固","35kV及以下设备可用与带电部分直接接触的绝缘隔板代替临时遮栏","可用干燥木材、橡胶或其他坚韧绝缘材料制成"],"answer":["A","B","C","D"],"exp":"7.5.2 对临时遮栏材料、牢固、标示牌以及35kV及以下用绝缘隔板代替均有规定，绝缘隔板绝缘性能应符合附录J的要求。"},{"id":"G064","type":"single","ch":"7","sec":"7.5.2","stem":"（　）及以下设备可用与带电部分直接接触的绝缘隔板代替临时遮栏。","options":["20kV","66kV","35kV","10kV"],"answer":["C"],"exp":"7.5.2 35kV及以下设备可用与带电部分直接接触的绝缘隔板代替临时遮栏。"},{"id":"N047","type":"judge","ch":"7","sec":"7.5.2","stem":"临时遮栏可用金属材料制成。","options":["正确","错误"],"answer":["B"],"exp":"7.5.2 临时遮栏可用干燥木材、橡胶或其他坚韧绝缘材料制成。"},{"id":"N048","type":"judge","ch":"7","sec":"7.5.2","stem":"110kV设备可用与带电部分直接接触的绝缘隔板代替临时遮栏。","options":["正确","错误"],"answer":["B"],"exp":"7.5.2 仅35kV及以下设备可用与带电部分直接接触的绝缘隔板代替临时遮栏。"},{"id":"N049","type":"single","ch":"7","sec":"7.5.2","stem":"绝缘隔板绝缘性能应符合本规程（　）的要求。","options":["附录I","附录A","附录G","附录J"],"answer":["D"],"exp":"7.5.2 绝缘隔板绝缘性能应符合附录J的要求。标示牌式样见附录I（7.5.1）。"},{"id":"G065","type":"single","ch":"7","sec":"7.5.3","stem":"在室内高压设备上工作，应在工作地点（　）悬挂\"止步，高压危险！\"的标示牌。","options":["四周围栏上","两旁及对面运行设备间隔的遮栏（围栏）上和禁止通行的过道遮栏（围栏）上","正上方","入口处"],"answer":["B"],"exp":"7.5.3 应在工作地点两旁及对面运行设备间隔的遮栏（围栏）上和禁止通行的过道遮栏（围栏）上悬挂\"止步，高压危险！\"的标示牌。"},{"id":"G066","type":"judge","ch":"7","sec":"7.5.4","stem":"高压开关柜内手车开关拉出后，隔离带电部位的挡板封闭后禁止开启，并设置\"止步，高压危险！\"的标示牌。","options":["正确","错误"],"answer":["A"],"exp":"7.5.4 高压开关柜内手车开关拉出后，隔离带电部位的挡板封闭后禁止开启，并设置\"止步，高压危险！\"的标示牌。"},{"id":"N050","type":"judge","ch":"7","sec":"7.5.4","stem":"高压开关柜内手车开关拉出后，隔离带电部位的挡板封闭后，检修人员可随时开启检查。","options":["正确","错误"],"answer":["B"],"exp":"7.5.4 隔离带电部位的挡板封闭后禁止开启。"},{"id":"G067","type":"multi","ch":"7","sec":"7.5.5","stem":"在室外高压设备上工作，应（　）。","options":["工作地点四周围栏上悬挂适当数量的\"止步，高压危险！\"标示牌，标示牌应朝向围栏里面","在工作地点四周装设围栏","禁止越过围栏","围栏出入口要围至临近道路旁边，并设有\"从此进出！\"的标示牌"],"answer":["A","B","C","D"],"exp":"7.5.5 对室外高压设备上工作的围栏装设、出入口标示牌、标示牌朝向及禁止越过围栏均有规定。"},{"id":"G068","type":"single","ch":"7","sec":"7.5.5","stem":"若室外配电装置的大部分设备停电，只有个别地点保留有带电设备而其他设备无触及带电导体的可能时，可以在带电设备四周装设全封闭围栏，围栏上悬挂的\"止步，高压危险！\"标示牌应朝向（　）。","options":["围栏外面","设备方向","道路方向","围栏里面"],"answer":["A"],"exp":"7.5.5 此种情况下标示牌应朝向围栏外面；而工作地点四周围栏上的标示牌应朝向围栏里面。"},{"id":"N051","type":"judge","ch":"7","sec":"7.5.5","stem":"室外高压设备工作地点四周围栏上的\"止步，高压危险！\"标示牌应朝向围栏外面。","options":["正确","错误"],"answer":["B"],"exp":"7.5.5 工作地点四周围栏上的标示牌应朝向围栏里面；只有在带电设备四周装设全封闭围栏时，标示牌朝向围栏外面。"},{"id":"G069","type":"single","ch":"7","sec":"7.5.6","stem":"在工作地点应设置（　）的标示牌。","options":["\"从此进出！\"","\"在此工作！\"","\"止步，高压危险！\"","\"从此上下！\""],"answer":["B"],"exp":"7.5.6 在工作地点设置\"在此工作！\"的标示牌。"},{"id":"G070","type":"single","ch":"7","sec":"7.5.7","stem":"在室外构架上工作，应在工作地点邻近带电部分的横梁上悬挂（　）的标示牌。","options":["\"止步，高压危险！\"","\"禁止攀登，高压危险！\"","\"从此上下！\"","\"在此工作！\""],"answer":["A"],"exp":"7.5.7 在室外构架上工作，应在工作地点邻近带电部分的横梁上悬挂\"止步，高压危险！\"的标示牌。"},{"id":"G071","type":"single","ch":"7","sec":"7.5.7","stem":"在作业人员上下的铁架或梯子上，应悬挂（　）的标示牌。","options":["\"禁止攀登，高压危险！\"","\"从此进出！\"","\"从此上下！\"","\"在此工作！\""],"answer":["C"],"exp":"7.5.7 在作业人员上下铁架或梯子上，应悬挂\"从此上下！\"的标示牌。"},{"id":"G072","type":"single","ch":"7","sec":"7.5.7","stem":"在邻近其他可能误登的带电构架上，应悬挂（　）的标示牌。","options":["\"止步，高压危险！\"","\"禁止合闸，有人工作！\"","\"禁止攀登，高压危险！\"","\"从此上下！\""],"answer":["C"],"exp":"7.5.7 在邻近其他可能误登的带电构架上，应悬挂\"禁止攀登，高压危险！\"的标示牌。"},{"id":"N052","type":"single","ch":"7","sec":"7.5.7","stem":"在室外构架上工作，下列标示牌悬挂位置正确的是（　）。","options":["作业人员上下的铁架上挂\"禁止攀登，高压危险！\"","邻近可能误登的带电构架上挂\"从此上下！\"","作业人员上下的梯子上挂\"从此上下！\"","工作地点邻近带电部分的横梁上挂\"在此工作！\""],"answer":["C"],"exp":"7.5.7 邻近带电部分横梁挂\"止步，高压危险！\"；上下铁架或梯子挂\"从此上下！\"；可能误登的带电构架挂\"禁止攀登，高压危险！\"。"},{"id":"G073","type":"single","ch":"7","sec":"7.5.8","stem":"因工作原因必须短时移动或拆除遮栏（围栏）、标示牌，应征得（　）同意，并在工作负责人的监护下进行，完毕后应立即恢复。","options":["调控人员","工作票签发人","工作许可人","运维负责人"],"answer":["C"],"exp":"7.5.8 应征得工作许可人同意，并在工作负责人的监护下进行。完毕后应立即恢复。"},{"id":"G074","type":"judge","ch":"7","sec":"7.5.8","stem":"禁止作业人员擅自移动或拆除遮栏（围栏）、标示牌。","options":["正确","错误"],"answer":["A"],"exp":"7.5.8 禁止作业人员擅自移动或拆除遮栏（围栏）、标示牌。"},{"id":"N053","type":"single","ch":"7","sec":"7.5.8","stem":"因工作需要短时移动遮栏，应在（　）的监护下进行。","options":["工作负责人","工作许可人","运维负责人","专责监护人"],"answer":["A"],"exp":"7.5.8 应征得工作许可人同意，并在工作负责人的监护下进行。"},{"id":"G075","type":"multi","ch":"7","sec":"7.5.9","stem":"直流换流站单极停电工作，应（　）。","options":["在围栏面向停电设备及运行阀厅门口悬挂\"止步，高压危险！\"标示牌","在双极公共区域设备与停电区域之间设置围栏","在检修阀厅和直流场设备处设置\"在此工作\"的标示牌","将双极公共区域设备全部停电"],"answer":["A","B","C"],"exp":"7.5.9 直流换流站单极停电工作的围栏设置与标示牌悬挂要求。"},{"id":"N054","type":"single","ch":"7","sec":"7.5.9","stem":"直流换流站单极停电工作，在检修阀厅和直流场设备处应设置（　）的标示牌。","options":["\"从此进出！\"","\"在此工作\"","\"禁止合闸，有人工作！\"","\"止步，高压危险！\""],"answer":["B"],"exp":"7.5.9 在检修阀厅和直流场设备处设置\"在此工作\"的标示牌。"}]</script>

var L=['A','B','C','D'];
var CH=[{k:'1~3',n:'范围·术语'},{k:'4',n:'第4章 总则'},{k:'5',n:'第5章 基本要求'},{k:'6',n:'第6章 组织措施'},{k:'7',n:'第7章 技术措施'}];
var TY=[{k:'single',n:'单选'},{k:'multi',n:'多选'},{k:'judge',n:'判断'}];
var KEY='gwaq1799_1_v1';

/* ---------- 存档 ---------- */
var S={seen:{},wrong:{},star:{},done:0,right:0,filt:{ch:[],ty:[]},theme:''};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);for(var k in p)if(p[k]!=null)S[k]=p[k];}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ---------- 主题 ---------- */
var root=document.documentElement;
if(S.theme)root.setAttribute('data-theme',S.theme);
document.getElementById('theme').onclick=function(){
  var cur=root.getAttribute('data-theme');
  var dark=cur?cur==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  S.theme=dark?'light':'dark';root.setAttribute('data-theme',S.theme);save();
};

var view=document.getElementById('view'),dock=document.getElementById('dock'),dockin=document.getElementById('dockin');
var prog=document.getElementById('prog'),homeBtn=document.getElementById('home'),ttl=document.getElementById('ttl'),sub=document.getElementById('sub');
homeBtn.onclick=function(){R.mode='';renderHome();};

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function byId(id){for(var i=0;i<QS.length;i++)if(QS[i].id===id)return QS[i];return null;}
function pool(){
  var f=S.filt;
  return QS.filter(function(q){
    if(f.ch.length&&f.ch.indexOf(q.ch)<0)return false;
    if(f.ty.length&&f.ty.indexOf(q.type)<0)return false;
    return true;
  });
}
function wrongList(){var o=[];for(var id in S.wrong)if(S.wrong[id]){var q=byId(id);if(q)o.push(q);}return o;}
function starList(){var o=[];for(var id in S.star)if(S.star[id]){var q=byId(id);if(q)o.push(q);}return o;}

/* ---------- 运行态 ---------- */
var R={mode:'',list:[],i:0,pick:[],shown:false,exam:null,log:[]};

/* ---------- 首页 ---------- */
function renderHome(){
  dock.hidden=true;homeBtn.hidden=true;prog.style.width='0';
  ttl.textContent='变电安规刷题';sub.textContent='Q/GDW 1799.1—2013';
  var p=pool(),w=wrongList().length,st=starList().length;
  var acc=S.done?Math.round(S.right/S.done*100):0;
  var h='';
  h+='<div class="panel hero">'
    +'<span class="lab">国家电网公司电力安全工作规程</span>'
    +'<h1>变电部分 第1~7章 题库</h1>'
    +'<div class="std mono">Q/GDW 1799.1—2013</div>'
    +'<div class="scope">'
      +'<div class="kpi"><b class="mono">'+QS.length+'</b><span>总题量</span></div>'
      +'<div class="kpi"><b class="mono">'+S.done+'</b><span>已答</span></div>'
      +'<div class="kpi"><b class="mono">'+acc+'%</b><span>正确率</span></div>'
      +'<div class="kpi"><b class="mono">'+w+'</b><span>错题</span></div>'
    +'</div></div>';

  h+='<div class="sec"><h2>练习范围</h2><em>已选 '+p.length+' 题</em></div>';
  h+='<div class="panel filters">';
  h+='<div class="frow"><span class="lab">章节</span>';
  CH.forEach(function(c){
    var n=QS.filter(function(q){return q.ch===c.k;}).length;
    h+='<button class="chip" data-f="ch" data-v="'+c.k+'" aria-pressed="'+(S.filt.ch.indexOf(c.k)>=0)+'">'+c.n+'<span class="n mono">'+n+'</span></button>';
  });
  h+='</div><div class="frow"><span class="lab">题型</span>';
  TY.forEach(function(t){
    var n=QS.filter(function(q){return q.type===t.k;}).length;
    h+='<button class="chip" data-f="ty" data-v="'+t.k+'" aria-pressed="'+(S.filt.ty.indexOf(t.k)>=0)+'">'+t.n+'<span class="n mono">'+n+'</span></button>';
  });
  h+='</div><div class="frow"><span class="lab"></span><span style="font-size:12px;color:var(--ink-3)">不选即全部</span></div>';
  h+='</div>';

  h+='<div class="sec"><h2>开始练习</h2></div><div class="modes">';
  h+='<button class="mode" data-go="seq"><b>顺序练习</b><span>按章节条文顺序逐题作答，答完即看解析</span></button>';
  h+='<button class="mode" data-go="rnd"><b>随机练习</b><span>打乱顺序，接近考场上的出题感觉</span></button>';
  h+='<button class="mode" data-go="read"><b>背题模式</b><span>直接显示答案与条文出处，快速过一遍</span></button>';
  h+='<button class="mode" data-go="exam"><b>模拟考试</b><span>抽 50 题 · 60 分钟 · 交卷评分</span></button>';
  h+='<button class="mode wide" data-go="wrong"><div><b>错题本</b><span>只练做错过的题，答对后移出</span></div><span class="cnt mono">'+w+' 题</span></button>';
  h+='<button class="mode wide" data-go="star"><div><b>收藏夹</b><span>标记为重点的条文题</span></div><span class="cnt mono">'+st+' 题</span></button>';
  h+='</div>';

  h+='<div class="note">题目依据 Q/GDW 1799.1—2013《国家电网公司电力安全工作规程 变电部分》第1~7章编写，每题标注条文号，可对照原文复核。表1、表2、表3 的安全距离数值已逐条核对原表。</div>';
  h+='<div class="sec"><h2>记录</h2></div><div class="panel filters"><div class="frow">'
    +'<button class="btn" id="reset">清空练习记录</button>'
    +'<span style="font-size:12px;color:var(--ink-3)">记录保存在本机浏览器</span></div></div>';

  view.innerHTML=h;
  [].forEach.call(view.querySelectorAll('.chip'),function(b){
    b.onclick=function(){
      var arr=S.filt[b.dataset.f],v=b.dataset.v,k=arr.indexOf(v);
      if(k<0)arr.push(v);else arr.splice(k,1);
      save();renderHome();
    };
  });
  [].forEach.call(view.querySelectorAll('[data-go]'),function(b){b.onclick=function(){start(b.dataset.go);};});
  document.getElementById('reset').onclick=function(){
    if(!confirm('清空已答记录、错题本和收藏？此操作不可撤销。'))return;
    S.seen={};S.wrong={};S.star={};S.done=0;S.right=0;save();renderHome();
  };
  window.scrollTo(0,0);
}

/* ---------- 启动一个模式 ---------- */
function start(mode){
  var list;
  if(mode==='wrong'){list=wrongList();if(!list.length)return emptyState('错题本是空的','先去练习，做错的题会自动收进来。');}
  else if(mode==='star'){list=starList();if(!list.length)return emptyState('收藏夹是空的','答题时点右下角的旗标可以收藏重点条文。');}
  else if(mode==='exam'){
    var s=shuffle(QS.filter(function(q){return q.type==='single';})).slice(0,25);
    var m=shuffle(QS.filter(function(q){return q.type==='multi';})).slice(0,10);
    var j=shuffle(QS.filter(function(q){return q.type==='judge';})).slice(0,15);
    list=s.concat(m,j);
    R.exam={left:60*60,t0:Date.now()};
  }else{
    list=pool().slice();
    if(!list.length)return emptyState('没有符合条件的题','回到首页放宽章节或题型的筛选。');
    if(mode==='rnd')list=shuffle(list);
  }
  R.mode=mode;R.list=list;R.i=0;R.pick=[];R.shown=(mode==='read');R.log=[];
  if(mode!=='exam')R.exam=null;
  homeBtn.hidden=false;
  ttl.textContent={seq:'顺序练习',rnd:'随机练习',read:'背题模式',exam:'模拟考试',wrong:'错题本',star:'收藏夹'}[mode];
  if(R.exam)tick();
  renderQ();
}
function emptyState(t,d){
  dock.hidden=true;homeBtn.hidden=false;
  view.innerHTML='<div class="panel empty"><b>'+esc(t)+'</b>'+esc(d)+'</div>';
}

/* ---------- 考试计时 ---------- */
var timerId=null;
function tick(){
  clearInterval(timerId);
  timerId=setInterval(function(){
    if(!R.exam)return clearInterval(timerId);
    R.exam.left--;
    var el=document.getElementById('tmr');
    if(el){el.textContent=fmt(R.exam.left);el.className='timer mono'+(R.exam.left<300?' low':'');}
    if(R.exam.left<=0){clearInterval(timerId);finishExam(true);}
  },1000);
}
function fmt(s){s=Math.max(0,s);var m=Math.floor(s/60);return (m<10?'0':'')+m+':'+((s%60)<10?'0':'')+(s%60);}

/* ---------- 渲染一题 ---------- */
function renderQ(){
  var q=R.list[R.i];if(!q)return;
  var isExam=R.mode==='exam', reveal=R.shown&&!isExam;
  prog.style.width=((R.i+(R.shown||isExam&&R.pick.length?1:0))/R.list.length*100)+'%';
  sub.textContent=(R.i+1)+' / '+R.list.length;

  var tn={single:'单选题',multi:'多选题',judge:'判断题'}[q.type];
  var h='<div class="panel card">';
  h+='<div class="qhead"><span class="tag t-'+q.type+'">'+tn+'</span>';
  if(!isExam)h+='<span class="tag src mono">'+esc(q.sec)+'</span>';
  h+='<span class="qidx mono">'+(R.i+1)+' / '+R.list.length+'</span></div>';
  h+='<p class="stem">'+esc(q.stem)+'</p><div class="opts">';
  q.options.forEach(function(o,n){
    var k=L[n],st='';
    if(reveal){
      var isAns=q.answer.indexOf(k)>=0, isPick=R.pick.indexOf(k)>=0;
      if(isAns&&isPick)st='ok';else if(isPick)st='bad';else if(isAns)st='miss';
    }else if(R.pick.indexOf(k)>=0)st='pick';
    h+='<button class="opt" data-k="'+k+'"'+(st?' data-s="'+st+'"':'')+(reveal?' disabled':'')+'>'
      +'<span class="k mono">'+k+'</span><span class="tx">'+esc(o)+'</span></button>';
  });
  h+='</div>';

  if(reveal){
    var ok=same(R.pick,q.answer);
    h+='<div class="verdict '+(ok?'ok':'bad')+'"><div class="vtop">'
      +'<span>'+(R.mode==='read'?'条文要点':(ok?'答对':'答错'))+'</span>'
      +'<span class="ans mono">正确答案 '+q.answer.join(' ')+'</span></div>'
      +'<p>'+esc(q.exp)+'</p></div>';
  }
  h+='</div>';
  view.innerHTML=h;
  [].forEach.call(view.querySelectorAll('.opt'),function(b){b.onclick=function(){pickOpt(b.dataset.k);};});
  renderDock();
  window.scrollTo(0,0);
}
function same(a,b){if(a.length!==b.length)return false;var x=a.slice().sort().join(),y=b.slice().sort().join();return x===y;}

function pickOpt(k){
  var q=R.list[R.i];
  if(R.shown&&R.mode!=='read')return;
  if(R.mode==='read')return;
  if(q.type==='multi'){
    var n=R.pick.indexOf(k);
    if(n<0)R.pick.push(k);else R.pick.splice(n,1);
    renderQ();
  }else{
    R.pick=[k];
    if(R.mode==='exam'){R.log[R.i]=R.pick.slice();next();}
    else submit();
  }
}
function submit(){
  var q=R.list[R.i];
  if(!R.pick.length)return;
  if(R.mode==='exam'){R.log[R.i]=R.pick.slice();return next();}
  R.shown=true;
  var ok=same(R.pick,q.answer);
  if(!S.seen[q.id]){S.done++;if(ok)S.right++;}
  S.seen[q.id]=1;
  if(ok){if(S.wrong[q.id])delete S.wrong[q.id];}else{S.wrong[q.id]=1;}
  save();renderQ();
}
function next(){
  if(R.i>=R.list.length-1){
    if(R.mode==='exam')return finishExam(false);
    return finishSet();
  }
  R.i++;R.pick=(R.mode==='exam'&&R.log[R.i])?R.log[R.i].slice():[];
  R.shown=(R.mode==='read');
  renderQ();
}
function prev(){
  if(R.i<=0)return;
  R.i--;R.pick=(R.mode==='exam'&&R.log[R.i])?R.log[R.i].slice():[];
  R.shown=(R.mode!=='exam'&&R.mode!=='read')?!!S.seen[R.list[R.i].id]&&false:(R.mode==='read');
  R.shown=(R.mode==='read');
  renderQ();
}

/* ---------- 底部操作栏 ---------- */
function renderDock(){
  var q=R.list[R.i],isExam=R.mode==='exam';
  dock.hidden=false;
  var h='';
  h+='<button class="btn" id="bprev"'+(R.i===0?' disabled':'')+'>上一题</button>';
  if(isExam){
    h+='<span class="timer mono'+(R.exam.left<300?' low':'')+'" id="tmr">'+fmt(R.exam.left)+'</span>';
    h+='<span class="meta mono">已答 '+R.log.filter(Boolean).length+'/'+R.list.length+'</span>';
    h+='<div class="dock-sp"></div>';
    h+='<button class="btn" id="bhand">交卷</button>';
    h+='<button class="btn pri" id="bnext"'+(q.type==='multi'&&!R.pick.length?' disabled':'')+'>'+(R.i===R.list.length-1?'完成':'下一题')+'</button>';
  }else{
    h+='<button class="star" id="bstar" aria-pressed="'+(!!S.star[q.id])+'" title="收藏"><svg viewBox="0 0 24 24"><path d="M5 21V4.5h11l-1.4 3.2L16 11H5"/></svg></button>';
    h+='<div class="dock-sp"></div>';
    if(!R.shown)h+='<button class="btn pri" id="bsub"'+(R.pick.length?'':' disabled')+'>确定</button>';
    else h+='<button class="btn pri" id="bnext">'+(R.i===R.list.length-1?'完成':'下一题')+'</button>';
  }
  dockin.innerHTML=h;
  var g=function(id){return document.getElementById(id);};
  if(g('bprev'))g('bprev').onclick=prev;
  if(g('bsub'))g('bsub').onclick=submit;
  if(g('bnext'))g('bnext').onclick=function(){if(isExam&&R.pick.length)R.log[R.i]=R.pick.slice();next();};
  if(g('bhand'))g('bhand').onclick=function(){if(confirm('确认交卷？'))finishExam(false);};
  if(g('bstar'))g('bstar').onclick=function(){
    if(S.star[q.id])delete S.star[q.id];else S.star[q.id]=1;
    save();renderDock();
  };
}

/* ---------- 练习结束 ---------- */
function finishSet(){
  dock.hidden=true;prog.style.width='100%';
  var n=R.list.length,w=0;
  R.list.forEach(function(q){if(S.wrong[q.id])w++;});
  var h='<div class="panel score">'
    +'<span class="lab">本轮完成</span>'
    +'<div class="big mono">'+n+'</div><div class="sub">题已练完</div>'
    +'<div class="grid3">'
      +'<div class="stat"><b class="mono">'+n+'</b><span>本轮题量</span></div>'
      +'<div class="stat"><b class="mono">'+w+'</b><span>仍在错题本</span></div>'
      +'<div class="stat"><b class="mono">'+(S.done?Math.round(S.right/S.done*100):0)+'%</b><span>累计正确率</span></div>'
    +'</div></div>';
  h+='<div class="modes" style="margin-top:14px">'
    +'<button class="mode" data-go="wrong"><b>去练错题</b><span>把还没吃透的条文再过一遍</span></button>'
    +'<button class="mode" id="rehome"><b>返回首页</b><span>换个章节或题型继续</span></button></div>';
  view.innerHTML=h;
  view.querySelector('[data-go]').onclick=function(){start('wrong');};
  document.getElementById('rehome').onclick=renderHome;
  window.scrollTo(0,0);
}

function finishExam(timeup){
  clearInterval(timerId);dock.hidden=true;prog.style.width='100%';
  var single=0,multi=0,judge=0,got=0,tot=0,bad=[];
  R.list.forEach(function(q,i){
    var pick=R.log[i]||[],ok=same(pick,q.answer);
    var w=q.type==='multi'?2:1;tot+=w;
    if(ok)got+=w;else bad.push({q:q,pick:pick,i:i});
    if(!S.seen[q.id]){S.done++;if(ok)S.right++;}
    S.seen[q.id]=1;
    if(ok){if(S.wrong[q.id])delete S.wrong[q.id];}else S.wrong[q.id]=1;
    if(ok){if(q.type==='single')single++;else if(q.type==='multi')multi++;else judge++;}
  });
  save();
  var sc=Math.round(got/tot*100),pass=sc>=80;
  var used=R.exam?fmt(60*60-R.exam.left):'--:--';
  var h='<div class="panel score">'
    +'<span class="lab">'+(timeup?'时间到 · 自动交卷':'模拟考试成绩')+'</span>'
    +'<div class="big mono '+(pass?'pass':'fail')+'">'+sc+'</div>'
    +'<div class="sub">'+(pass?'合格（80 分线）':'未达 80 分合格线')+' · 用时 '+used+'</div>'
    +'<div class="grid3">'
      +'<div class="stat"><b class="mono">'+single+'/25</b><span>单选</span></div>'
      +'<div class="stat"><b class="mono">'+multi+'/10</b><span>多选</span></div>'
      +'<div class="stat"><b class="mono">'+judge+'/15</b><span>判断</span></div>'
    +'</div></div>';
  if(bad.length){
    h+='<div class="sec"><h2>错题回顾</h2><em>'+bad.length+' 题</em></div><div class="revlist">';
    bad.forEach(function(b){
      h+='<div class="rev"><span class="no mono">'+(b.i+1)+'</span><div class="bd">'
        +'<p>'+esc(b.q.stem)+'</p>'
        +'<small class="mono">你选 '+(b.pick.length?b.pick.join(' '):'未作答')+' · 正确 '+b.q.answer.join(' ')+' · '+esc(b.q.sec)+'</small>'
        +'<p style="color:var(--ink-2);font-size:13px;margin-top:5px">'+esc(b.q.exp)+'</p>'
        +'</div></div>';
    });
    h+='</div>';
  }else{
    h+='<div class="note">全部答对，这套卷子没有留下错题。</div>';
  }
  h+='<div class="modes" style="margin-top:14px">'
    +'<button class="mode" id="again"><b>再考一次</b><span>重新抽题，重新计时</span></button>'
    +'<button class="mode" id="rehome"><b>返回首页</b><span>去练错题或换章节</span></button></div>';
  view.innerHTML=h;
  document.getElementById('again').onclick=function(){start('exam');};
  document.getElementById('rehome').onclick=renderHome;
  window.scrollTo(0,0);
}

/* ---------- 键盘 ---------- */
document.addEventListener('keydown',function(e){
  if(!R.mode||dock.hidden)return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  var k=e.key.toUpperCase();
  if(['A','B','C','D'].indexOf(k)>=0){e.preventDefault();var q=R.list[R.i];if(q&&L.indexOf(k)<q.options.length)pickOpt(k);return;}
  if(k>='1'&&k<='4'){e.preventDefault();var q2=R.list[R.i];var n=+k-1;if(q2&&n<q2.options.length)pickOpt(L[n]);return;}
  if(e.key==='Enter'||e.key===' '){
    e.preventDefault();
    if(R.mode==='exam'||R.shown)next();else submit();
    return;
  }
  if(e.key==='ArrowLeft'){e.preventDefault();prev();}
  if(e.key==='ArrowRight'){e.preventDefault();if(R.mode==='exam'||R.shown)next();}
});

renderHome();
})();
</script>
